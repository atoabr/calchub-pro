<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="CalcHub Pro — 159 engineering, building-services, pipeline, finance, jewelry and gemstone calculators with formulas, code editions, working and PDF reports. By Engr. Abrar Hussain, Best Quality First Inc.">
<meta property="og:title" content="CalcHub Pro — every calculation, with the formula on the page"><meta property="og:description" content="159 calculators for engineers and trades, with formulas, standards and PDF calculation reports."><meta property="og:type" content="website">
<meta name="theme-color" content="#14181D"><link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="CalcHub Pro">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="config.js"></script>
</head><body>
<title>CalcHub Pro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: engineer's calculation pad — grouped category rail, input sheet beside a result card that reads like a stamped calc sheet (formula, working, sources) */
:root{
  --pt-alkali:#FBE1D3; --pt-alkaline:#FCEDCB; --pt-transition:#DFE9F5; --pt-post:#E1EEDD; --pt-metalloid:#ECE6CF; --pt-nonmetal:#D6EFE6; --pt-halogen:#E4F2CC; --pt-noble:#EAE2F7; --pt-lanthanide:#F8DFEA; --pt-actinide:#F2DDEF; --pt-uncertain:#E9EAE6;
  --paper:#F3F4F1; --surface:#FFFFFF; --sunk:#ECEEEA; --line:#D9DCD6; --line-strong:#B9BEB6;
  --ink:#14181D; --muted:#5B636C; --accent:#0D5C8C; --accent-ink:#0A4A71; --accent-soft:#E2EEF6; --on-accent:#FFFFFF;
  --result:#FFF6E5; --result-ink:#7A4A06; --ok:#18794E; --ok-soft:#E3F3EA; --bad:#B42318; --bad-soft:#FDECEA; --warn-soft:#FFF3D6; --warn-ink:#7A5200;
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",ui-sans-serif,system-ui,sans-serif;
  --f-ui:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --shadow:0 1px 2px rgba(20,24,29,.06),0 8px 24px rgba(20,24,29,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--pt-alkali:#4F2E1F; --pt-alkaline:#4B3A15; --pt-transition:#1E314D; --pt-post:#213A26; --pt-metalloid:#3D3520; --pt-nonmetal:#143D31; --pt-halogen:#2C3C14; --pt-noble:#33264F; --pt-lanthanide:#4A2235; --pt-actinide:#43213F; --pt-uncertain:#2C2E2B;

  --paper:#0F1215; --surface:#171B20; --sunk:#12161A; --line:#2A3038; --line-strong:#3A424C;
  --ink:#E6E9EC; --muted:#98A1AB; --accent:#6CB4E8; --accent-ink:#9CCDF0; --accent-soft:#132B3C; --on-accent:#0F1215;
  --result:#2A2111; --result-ink:#F2C879; --ok:#5FD39A; --ok-soft:#10291D; --bad:#F2877C; --bad-soft:#341614; --warn-soft:#2D2410; --warn-ink:#F0CB76;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{--pt-alkali:#4F2E1F; --pt-alkaline:#4B3A15; --pt-transition:#1E314D; --pt-post:#213A26; --pt-metalloid:#3D3520; --pt-nonmetal:#143D31; --pt-halogen:#2C3C14; --pt-noble:#33264F; --pt-lanthanide:#4A2235; --pt-actinide:#43213F; --pt-uncertain:#2C2E2B;

  --paper:#0F1215; --surface:#171B20; --sunk:#12161A; --line:#2A3038; --line-strong:#3A424C;
  --ink:#E6E9EC; --muted:#98A1AB; --accent:#6CB4E8; --accent-ink:#9CCDF0; --accent-soft:#132B3C; --on-accent:#0F1215;
  --result:#2A2111; --result-ink:#F2C879; --ok:#5FD39A; --ok-soft:#10291D; --bad:#F2877C; --bad-soft:#341614; --warn-soft:#2D2410; --warn-ink:#F0CB76;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.15;text-wrap:balance}
.mono{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-strong);background:var(--surface);padding:8px 13px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent-ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{background:var(--accent-ink);color:var(--on-accent)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.ghost{background:none;border-color:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--accent-ink);cursor:pointer;font-weight:600}
.link:hover{text-decoration:underline}
input[type=text],input[type=email],input[type=date],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:9px 11px;font-size:15px}
textarea{resize:vertical;min-height:96px;font-family:var(--f-num);font-size:14px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:5px;background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.chip.std{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent;font-family:var(--f-num);font-weight:500}
.chip.warn{background:var(--warn-soft);color:var(--warn-ink);border-color:transparent}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.eyebrow{font-family:var(--f-num);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* ---------- shell ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:14px;align-items:center}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;cursor:pointer;padding:0;flex:none}
.brand .logo{width:46px;height:46px;flex:none;border-radius:10px;background:#fff;object-fit:contain;padding:3px;border:1px solid var(--line)}
.brand .bt{display:flex;flex-direction:column;align-items:flex-start;text-align:left;line-height:1.15}
.brand b{font-family:var(--f-display);font-size:20px;font-weight:700;letter-spacing:-.01em}
.brand small{font-size:11.5px;color:var(--muted);font-weight:400;white-space:nowrap}
.brand small strong{color:var(--ink);font-weight:600}
.credit{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-block:20px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:13px;color:var(--muted);text-align:center}
.credit img{width:34px;height:34px;border-radius:7px;background:#fff;padding:2px;border:1px solid var(--line)}
.credit b{color:var(--ink)}
.paper .ph .brandline{display:flex;align-items:center;gap:10px}
.paper .ph img{width:44px;height:44px;border-radius:8px;background:#fff;border:1px solid var(--line);padding:2px}
.brand b span{color:var(--accent)}
.sbox{position:relative;flex:1;max-width:620px}
.sbox input{padding-left:38px;padding-right:62px;background:var(--sunk);border-color:transparent;height:40px}
.sbox>svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.sbox kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-family:var(--f-num);font-size:11.5px;border:1px solid var(--line-strong);border-radius:5px;padding:1px 5px;color:var(--muted);background:var(--surface)}
.sres{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);max-height:60vh;overflow:auto;z-index:30;padding:6px}
.sres button{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;text-align:left;border:0;background:none;padding:8px 10px;border-radius:7px;cursor:pointer}
.sres button:hover,.sres button.on{background:var(--accent-soft)}
.sres small{color:var(--muted);font-size:12.5px}
.tsp{flex:none;display:flex;gap:6px;align-items:center;margin-left:auto}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 10px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--paper)}
.seg.mode button{display:inline-flex;align-items:center;gap:5px;padding:7px 9px}.seg.mode svg.i{width:16px;height:16px}
@media (max-width:1440px){.seg.mode .ml{display:none}}
.count{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:11.5px;font-family:var(--f-num)}
.layout{display:grid;grid-template-columns:248px minmax(0,1fr);max-width:1480px;margin:0 auto}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 67px);align-self:start;height:calc(100vh - 67px);overflow:auto;padding:16px 10px 30px max(16px,env(safe-area-inset-left,0px));border-right:1px solid var(--line)}
.side h4{font-family:var(--f-num);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:18px 8px 6px;font-weight:500}
.side h4:first-child{margin-top:0}
.nb{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:7px 8px;border-radius:7px;cursor:pointer;font-weight:500;text-align:left;font-size:14.5px}
.nb:hover{background:var(--sunk)}
.nb.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.nb .ct{margin-left:auto;font-size:12px;color:var(--muted);font-family:var(--f-num)}
main{padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.wrap{max-width:1160px;margin:0 auto}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:22px;align-items:end;margin-bottom:26px}
.hero h1{font-family:var(--f-display);font-size:clamp(30px,4vw,44px);font-weight:700;letter-spacing:-.015em}
.hero p{margin:8px 0 0;color:var(--muted);max-width:58ch;font-size:16px}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.how div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px;min-width:0}
.how b{display:block;font-family:var(--f-num);font-size:12px;color:var(--accent-ink);font-weight:600;margin-bottom:2px}
.figs{display:flex;gap:26px;margin-top:16px;font-size:13px;color:var(--muted)}
.figs b{display:block;font-family:var(--f-num);font-size:24px;color:var(--ink);font-weight:500;line-height:1.1}
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;cursor:pointer;white-space:nowrap;font-weight:500}
.pill:hover{border-color:var(--accent)}
.pill small{color:var(--muted)}
.sec{margin-top:30px}
.sec>h2{font-family:var(--f-display);font-size:20px;font-weight:700;margin-bottom:12px;display:flex;align-items:baseline;gap:10px}
.sec>h2 small{font-family:var(--f-ui);font-size:13px;font-weight:400;color:var(--muted)}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.cat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 14px 10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.cat header{display:flex;align-items:flex-start;gap:11px;margin-bottom:4px}
.cat header .ic{width:36px;height:36px;border-radius:8px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.cat header h3{font-size:16px;font-weight:700;font-family:var(--f-display)}
.cat header small{display:block;color:var(--muted);font-size:12.5px;font-weight:400;margin-top:2px}
.cat ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.cat li button{width:100%;text-align:left;border:0;background:none;padding:5px 6px;border-radius:6px;cursor:pointer;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.cat li button:hover{background:var(--sunk);color:var(--accent-ink)}
.cat li .st{color:var(--result-ink)}
:where(.hue){--c:var(--accent-ink);--cs:var(--accent-soft)}
.cat.hue{border-top:3px solid var(--c)}
.cat.hue header .ic{background:var(--cs);color:var(--c)}
.cat.hue li button:hover{color:var(--c);background:var(--cs)}
button.cat.hue:hover{border-color:var(--c);border-top-color:var(--c)}
.nb.hue svg.i{color:var(--c)}
.nb.hue.on{background:var(--cs);color:var(--c)}
.cdot{width:9px;height:9px;border-radius:50%;background:var(--c);display:inline-block;flex:none}
.ctag{display:inline-flex;align-items:center;gap:6px;background:var(--cs);color:var(--c);font:600 12.5px var(--f-ui);padding:4px 10px 4px 7px;border-radius:999px;border:0;cursor:pointer}
.ctag svg.i{width:15px;height:15px}
.ctag:hover{filter:brightness(.97)}
.chead.chero{border-left:4px solid var(--c);padding-left:12px}
.chead.chero .ic{width:38px;height:38px;border-radius:9px;background:var(--cs);color:var(--c);display:grid;place-items:center;flex:none}
#cform.hue{border-top:3px solid var(--c)}
.crumbs .link.hue{color:var(--c);font-weight:600}
.sec>h2 .gbar{display:inline-flex;gap:3px;vertical-align:middle;margin-right:8px}.sec>h2 .gbar i{width:6px;height:16px;border-radius:2px;background:var(--c);display:block}
.pill .cdot{margin-right:-2px}
.cat .new{font-family:var(--f-num);font-size:10.5px;font-weight:600;color:var(--result-ink);background:var(--result);padding:1px 6px;border-radius:4px;align-self:center}
.empty{border:1px dashed var(--line-strong);border-radius:10px;padding:14px;color:var(--muted);font-size:14px}

/* ---------- calculator ---------- */
.crumbs{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:8px;flex-wrap:wrap}
.chead{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:6px}
.chead h1{font-family:var(--f-display);font-size:clamp(24px,3vw,32px);font-weight:700;margin-right:4px}
.star{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;width:36px;height:36px;cursor:pointer;font-size:17px;color:var(--muted)}
.star.on{color:var(--result-ink);border-color:var(--result-ink)}
.guide{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);margin:0 0 16px}
.guide span b{font-family:var(--f-num);color:var(--accent-ink);font-weight:600;margin-right:4px}
.cgrid{display:grid;grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr);gap:18px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.card>h2{font-family:var(--f-num);font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:12px;display:flex;justify-content:space-between;gap:8px}
.fields{display:flex;flex-direction:column;gap:13px}
.fld label{display:block;font-weight:600;font-size:14px;margin-bottom:5px}
.fld .help{font-size:12.5px;color:var(--muted);margin-top:4px}
.fld .err{font-size:13px;color:var(--bad);margin-top:4px}
.fld.bad input,.fld.bad textarea{border-color:var(--bad)}
.ig{display:flex;align-items:stretch;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);overflow:hidden}
.ig:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ig input{border:0!important;box-shadow:none!important;border-radius:0;font-family:var(--f-num);background:none}
.ig .pre{display:grid;place-items:center;padding:0 10px;color:var(--muted);background:var(--sunk);font-family:var(--f-num);font-size:14px}
.ig select{width:auto;max-width:42%;border:0;border-left:1px solid var(--line);border-radius:0;background:var(--sunk);font-size:14px;padding:0 8px;font-family:var(--f-num);box-shadow:none!important}
.res{position:sticky;top:calc(env(safe-area-inset-top,0px) + 86px);box-shadow:var(--shadow)}
.prim{border-radius:10px;background:var(--result);padding:14px 16px;margin-bottom:12px;border:1px solid transparent}
.prim .lab{font-size:13px;font-weight:600;color:var(--result-ink)}
.prim .val{font-family:var(--f-num);font-size:clamp(24px,3.2vw,34px);font-weight:500;line-height:1.2;word-break:break-word;margin-top:2px}
.prim .alt{font-family:var(--f-num);font-size:13.5px;color:var(--muted);margin-top:3px}
.prim.err{background:var(--bad-soft)} .prim.err .lab{color:var(--bad)} .prim.err .val{font-family:var(--f-ui);font-size:16px;font-weight:600;color:var(--bad)}
.rtab{width:100%;border-collapse:collapse;font-size:14px}
.rtab td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.rtab td:last-child{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.rtab td small{display:block;color:var(--muted);font-size:12px}
.blk{margin-top:14px}
.blk h3{font-family:var(--f-num);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:6px}
.formula{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-family:var(--f-num);font-size:13.5px;overflow-x:auto;white-space:pre-wrap}
.steps{margin:0;padding-left:22px;font-size:13px;font-family:var(--f-num)}
.steps li{margin-bottom:4px}
.notes{font-size:13px;color:var(--muted);margin:0;padding-left:18px}
.notes li{margin-bottom:3px}
.disc{margin-top:12px;background:var(--warn-soft);color:var(--warn-ink);border-radius:8px;padding:9px 12px;font-size:13px;font-weight:500}
.acts{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.acts .sp{flex-basis:100%;height:0}
.convgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.convgrid div{background:var(--sunk);border-radius:8px;padding:8px 10px}
.convgrid small{display:block;color:var(--muted);font-size:12px}
.convgrid b{font-family:var(--f-num);font-weight:500;font-size:15px;word-break:break-all}

/* ---------- sheet / report preview ---------- */
.sheet-head{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.paper{background:var(--surface);border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow);padding:clamp(18px,4vw,44px);max-width:860px;margin:0 auto}
.paper .ph{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:18px}
.paper .ph b{font-family:var(--f-display);font-size:22px}
.paper .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:4px 18px;font-size:13px;margin-bottom:20px}
.paper .meta span{color:var(--muted)}
.paper section{border-top:1px solid var(--line);padding-top:16px;margin-top:18px}

/* ---------- formatting ---------- */
function fmtSig(x, sig=4){
  if(!isFinite(x)) return '—';
  if(x===0) return '0';
  const a=Math.abs(x);
  if(a>=1e15||a<1e-6) return x.toExponential(Math.max(0,sig-1)).replace('e+','e');
  const d=Math.max(0, sig-1-Math.floor(Math.log10(a)));
  const r=Number(x.toFixed(Math.min(d,12)));
  return r.toLocaleString('en-US',{maximumFractionDigits:Math.min(d,12)});
}
const cents = x => Math.round((x+Math.sign(x)*Number.EPSILON)*100)/100;
function fmtMoney(x, cur='USD'){ try{ return new Intl.NumberFormat('en-US',{style:'currency',currency:cur}).format(cents(x)) }catch(e){ return cur+' '+cents(x).toFixed(2) } }

/* ---------- safe expression parser (no eval) ---------- */
function evalExpr(src, mode='deg'){
  let s=String(src).replace(/×/g,'*').replace(/÷/g,'/').replace(/[−–]/g,'-').replace(/π/g,'pi').replace(/√/g,'sqrt').replace(/∛/g,'cbrt').trim();
  need(s.length>0,'Type an expression, for example 2+3*4.','expr');
  const open=(s.match(/\(/g)||[]).length-(s.match(/\)/g)||[]).length; if(open>0)s+=')'.repeat(open);   // close brackets the user left open
  evalExpr.closed=Math.max(0,open);
  let i=0;
  const peek=()=>s[i], ws=()=>{while(s[i]===' ')i++};
  const ang=x=>mode==='deg'?x*Math.PI/180:x, inv=x=>mode==='deg'?x*180/Math.PI:x;
  const F={sin:x=>Math.sin(ang(x)),cos:x=>Math.cos(ang(x)),tan:x=>Math.tan(ang(x)),asin:x=>inv(Math.asin(x)),acos:x=>inv(Math.acos(x)),atan:x=>inv(Math.atan(x)),
    sqrt:x=>{need(x>=0,'Square root needs a number of 0 or more.','expr');return Math.sqrt(x)},cbrt:Math.cbrt,
    log:x=>{need(x>0,'log needs a number above 0.','expr');return Math.log10(x)},ln:x=>{need(x>0,'ln needs a number above 0.','expr');return Math.log(x)},
    exp:Math.exp,abs:Math.abs,round:Math.round,floor:Math.floor,ceil:Math.ceil,sinh:Math.sinh,cosh:Math.cosh,tanh:Math.tanh};
  const whole=(n,r,f)=>{need(Number.isInteger(n)&&Number.isInteger(r)&&n>=0&&r>=0&&r<=n,`${f} needs whole numbers with 0 ≤ r ≤ n, for example ${f}(5,2).`,'expr');};
  const F2={ncr:(n,r)=>{whole(n,r,'nCr');r=Math.min(r,n-r);let v=1;for(let k=1;k<=r;k++)v=v*(n-r+k)/k;return Math.round(v)},
    npr:(n,r)=>{whole(n,r,'nPr');let v=1;for(let k=0;k<r;k++)v*=n-k;return v}};
  const C={pi:Math.PI,e:Math.E};
  function num(){ws();const m=/^(\d+\.?\d*|\.\d+)(e[+-]?\d+)?/i.exec(s.slice(i));if(!m)return null;i+=m[0].length;return parseFloat(m[0])}
  function primary(){ws();
    if(peek()==='('){i++;const v=expr();ws();need(peek()===')','Missing closing bracket.','expr');i++;return v}
    const n=num(); if(n!==null) return n;
    const m=/^[a-z]+/i.exec(s.slice(i));
    if(m){const id=m[0].toLowerCase();i+=m[0].length;ws();
      if(F[id]&&peek()!=='('){need(peek()!==undefined,`Add a number after ${id}, for example ${id}(30).`,'expr');return F[id](postfix())}   // √16, sin30
      if(F[id]){i++;const v=expr();ws();need(peek()===')','Missing closing bracket.','expr');i++;return F[id](v)}
      if(F2[id]){const nm=id==='ncr'?'nCr':'nPr';need(peek()==='(',`Use brackets after ${nm}, for example ${nm}(5,2).`,'expr');i++;const a=expr();ws();need(peek()===',',`${nm} needs two numbers separated by a comma, for example ${nm}(5,2).`,'expr');i++;const b=expr();ws();need(peek()===')','Missing closing bracket.','expr');i++;return F2[id](a,b)}
      need(id in C,`Unknown name "${m[0]}".`,'expr');return C[id]}
    throw new ValErr(`Unexpected "${peek()??'end'}" at position ${i+1}.`,'expr');
  }
  function postfix(){let v=primary();ws();while(peek()==='!'){i++;need(Number.isInteger(v)&&v>=0&&v<=170,'Factorial needs a whole number from 0 to 170.','expr');let f=1;for(let k=2;k<=v;k++)f*=k;v=f;ws()}return v}
  function power(){const b=postfix();ws();if(peek()==='^'){i++;return Math.pow(b,unary())}return b}
  function unary(){ws();if(peek()==='-'){i++;return -unary()}if(peek()==='+'){i++;return unary()}return power()}
  function term(){let v=unary();for(;;){ws();const c=peek();if(c==='*'){i++;v*=unary()}else if(c==='/'){i++;const d=unary();need(d!==0,'Division by zero.','expr');v/=d}else if(c==='%'){i++;v/=100}else if(c==='('||(c&&/[a-z]/i.test(c))){v*=unary()}else return v}}   // implied multiplication: 2pi, 3(4+1), 2sin(30)
  function expr(){let v=term();for(;;){ws();const c=peek();if(c==='+'){i++;v+=term()}else if(c==='-'){i++;v-=term()}else return v}}
  const v=expr(); ws(); need(i>=s.length,`Unexpected "${s[i]}" at position ${i+1}. Use * for multiplication.`,'expr');
  need(Number.isFinite(v),'The result is not a finite number.','expr'); return v;
}

/* ---------- number boxes: plain numbers or simple maths ("12.5 + 3.75", "2 × 450") ---------- */
const PLAIN_NUM=/^[+-]?(\d{1,3}(,\d{3})+|\d+)?(\.\d+)?(e[+-]?\d+)?$/i;
const isPlainNum=t=>PLAIN_NUM.test(t)&&/\d/.test(t);
function numFrom(s,key,label){
  const t=String(s).trim();
  if(isPlainNum(t))return Number(t.replace(/,/g,''));
  const L=label||'This value';
  need(!/^[+-]?\d+,\d{1,2}$/.test(t),`${L}: use a point for decimals, for example 1.5.`,key);
  need(!t.includes('%'),`${L}: % is not used in number boxes. Enter the value itself, for example 97.5.`,key);
  try{return evalExpr(t.replace(/(\d),(?=\d{3}(\D|$))/g,'$1'),'deg')}
  catch(e){const m=String(e.message);throw new ValErr(`${L}: ${/Unexpected "end"/.test(m)?'finish the sum, for example 12.5 + 3.75.':m.replace(' Use * for multiplication.','')}`,key)}
}

function molarMass(f){
  let s=String(f).replace(/\s/g,''); need(s.length,'Type a formula, for example C6H12O6.','f');
  const parts=s.split(/[·*.]/); let total=0, detail={};
  for(const part of parts){ let mult=1; let p=part; const m=p.match(/^(\d+)(.*)$/); if(m){mult=+m[1];p=m[2]}
    let i=0; const group=()=>{const counts={};while(i<p.length&&p[i]!==')'){
      if(p[i]==='('){i++;const inner=group();need(p[i]===')','Missing ")" in formula.','f');i++;const n=num();for(const k in inner)counts[k]=(counts[k]||0)+inner[k]*n;continue}
      const el=p.slice(i).match(/^[A-Z][a-z]?/);need(el,`Unexpected "${p[i]}" in formula. Elements start with a capital letter.`,'f');need(ATOMIC[el[0]]!==undefined,`Unknown element "${el[0]}".`,'f');i+=el[0].length;const n=num();counts[el[0]]=(counts[el[0]]||0)+n}
      return counts};
    const num=()=>{const m=p.slice(i).match(/^\d+/);if(m){i+=m[0].length;return +m[0]}return 1};
    const c=group(); need(i>=p.length,'Unmatched ")" in formula.','f');
    for(const k in c){detail[k]=(detail[k]||0)+c[k]*mult;total+=ATOMIC[k]*c[k]*mult}
  }
  return {total,detail};
}

def({id:'date-diff',cat:'general',title:'Date difference',kw:'days between dates age duration calendar',
  inputs:[date('a','Start date','2026-01-01'),date('b','End date','2026-12-31')],
  compute(v){need(/^\d{4}-\d{2}-\d{2}$/.test(v.a||''),'Choose a start date.','a');need(/^\d{4}-\d{2}-\d{2}$/.test(v.b||''),'Choose an end date.','b');
    const pa=v.a.split('-').map(Number),pb=v.b.split('-').map(Number);let A=Date.UTC(pa[0],pa[1]-1,pa[2]),B=Date.UTC(pb[0],pb[1]-1,pb[2]);let sign=1;if(B<A){[A,B]=[B,A];sign=-1}
    const days=Math.round((B-A)/864e5);const da=new Date(A),db=new Date(B);let y=db.getUTCFullYear()-da.getUTCFullYear(),m=db.getUTCMonth()-da.getUTCMonth(),d=db.getUTCDate()-da.getUTCDate();
    if(d<0){m--;d+=new Date(Date.UTC(db.getUTCFullYear(),db.getUTCMonth(),0)).getUTCDate()}if(m<0){y--;m+=12}
    return{results:[R('days','Days',sign*days,{primary:true,kind:'int'}),R('weeks','Weeks and days',`${Math.floor(days/7)} weeks ${days%7} days`,{kind:'text'}),R('ymd','Calendar difference',`${y} years ${m} months ${d} days`,{kind:'text'})],
      formula:'days = (end − start) ÷ 86,400,000 ms',steps:[`Dates counted in UTC so time zones and daylight saving do not shift the count.`,`The end date is not included (difference, not inclusive count).`]}}});
def({id:'average',cat:'general',title:'Average and statistics',kw:'mean median mode standard deviation',
  inputs:[area_('list','Numbers (separated by spaces, commas or new lines)','2 4 4 4 5 5 7 9')],
  compute(v){const a=parseList(v.list,'list');const n=a.length,sum=a.reduce((x,y)=>x+y,0),mean=sum/n,s=[...a].sort((x,y)=>x-y);
    const med=n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2;const cnt={};a.forEach(x=>cnt[x]=(cnt[x]||0)+1);const mx=Math.max(...Object.values(cnt));const modes=Object.keys(cnt).filter(k=>cnt[k]===mx);
    const ss=a.reduce((t,x)=>t+sq(x-mean),0);const pop=Math.sqrt(ss/n),samp=n>1?Math.sqrt(ss/(n-1)):NaN;
    return{results:[R('mean','Mean',mean,{primary:true}),R('median','Median',med),R('mode','Mode',mx>1?modes.join(', '):'No repeated value',{kind:'text'}),R('count','Count',n,{kind:'int'}),R('sum','Sum',sum,{sig:10}),R('min','Minimum',s[0]),R('max','Maximum',s[n-1]),R('sdp','Std deviation (population)',pop),R('sds','Std deviation (sample)',n>1?samp:'Needs 2+ values',{kind:n>1?'num':'text'})],
      formula:'mean = Σx ÷ n · σ = √(Σ(x − mean)² ÷ n) · s = √(Σ(x − mean)² ÷ (n − 1))',steps:[`Σx = ${fmtSig(sum,10)}, n = ${n}, mean = ${fmtSig(mean)}`,`Σ(x − mean)² = ${fmtSig(ss)}`]}}});

/* ---------------- FINANCIAL ---------------- */
def({id:'loan-emi',cat:'financial',title:'Loan / EMI',kw:'emi installment monthly payment amortization',
  inputs:[num('P','Loan amount',{money:true,def:100000,min:0}),num('rate','Annual interest rate (%)',{def:10,min:0,max:100}),num('term','Term',{def:12,min:1,int:true}),sel('tu','Term unit',[['m','Months'],['y','Years']])],
  compute(v){need(v.P>0,'Loan amount must be above zero.','P');need(v.rate>=0,'Rate cannot be negative.','rate');need(v.term>=1,'Term must be at least 1.','term');
    const n=v.tu==='y'?Math.round(v.term*12):Math.round(v.term),r=v.rate/1200,emi=amort(v.P,r,n),tot=cents(emi)*n;
    return{results:[R('emi','Monthly payment',emi,{kind:'money',primary:true}),R('total','Total paid',tot,{kind:'money'}),R('interest','Total interest',tot-v.P,{kind:'money'}),R('n','Payments',n,{kind:'int'})],
      formula:'EMI = P × r × (1 + r)ⁿ ÷ ((1 + r)ⁿ − 1), r = annual rate ÷ 12',steps:[`r = ${fmtSig(v.rate)} ÷ 1200 = ${fmtSig(r,6)}`,`n = ${n} monthly payments`,`EMI = ${fmtSig(v.P,10)} × ${fmtSig(r,6)} × (1 + ${fmtSig(r,6)})^${n} ÷ ((1 + ${fmtSig(r,6)})^${n} − 1) = ${cents(emi).toFixed(2)}`],assumptions:['Fixed rate, payments at the end of each month, no fees.','Totals use the payment rounded to cents; the last payment at a real lender may differ slightly.']}}});
def({id:'mortgage',cat:'financial',title:'Mortgage',kw:'home loan house down payment property tax insurance',
  inputs:[num('price','Home price',{money:true,def:250000,min:0}),num('down','Down payment (%)',{def:20,min:0,max:100}),num('rate','Annual interest rate (%)',{def:6.5,min:0,max:100}),num('years','Term (years)',{def:30,min:1,max:50,int:true}),num('tax','Property tax per year',{money:true,def:0,min:0}),num('ins','Home insurance per year',{money:true,def:0,min:0}),sel('comp','Interest compounding',[['m','Monthly (US and most countries)'],['s','Semi-annual (Canadian fixed-rate mortgages)']])],
  compute(v){need(v.price>0,'Home price must be above zero.','price');const loan=v.price*(1-v.down/100);need(loan>0,'Down payment covers the full price; no loan needed.','down');
    const n=v.years*12,r=v.comp==='s'?Math.pow(1+v.rate/200,1/6)-1:v.rate/1200,pi=amort(loan,r,n),extra=(v.tax+v.ins)/12,tot=cents(pi)*n;
    return{results:[R('pi','Principal and interest per month',pi,{kind:'money',primary:true}),R('monthly','Total monthly (with tax and insurance)',cents(pi)+extra,{kind:'money'}),R('loan','Loan amount',loan,{kind:'money'}),R('interest','Total interest over the term',tot-loan,{kind:'money'})],
      formula:`M = L × r × (1 + r)ⁿ ÷ ((1 + r)ⁿ − 1), L = price × (1 − down%), ${v.comp==='s'?'r = (1 + annual rate ÷ 2)^(1/6) − 1 (semi-annual compounding)':'r = annual rate ÷ 12'}`,steps:[`L = ${fmtSig(v.price,10)} × (1 − ${fmtSig(v.down)}%) = ${fmtSig(loan,10)}`,`r = ${fmtSig(r,6)}, n = ${n}`,`M = ${cents(pi).toFixed(2)}`],assumptions:['Fixed-rate loan; tax and insurance spread evenly across 12 months; PMI not included.']}}});
def({id:'compound',cat:'financial',title:'Compound interest',kw:'savings investment future value growth',
  inputs:[num('P','Starting amount',{money:true,def:1000,min:0}),num('rate','Annual interest rate (%)',{def:5,min:-100,max:100}),num('years','Years',{def:10,min:0}),sel('n','Compounding',[['1','Yearly'],['2','Half-yearly'],['4','Quarterly'],['12','Monthly'],['365','Daily']],'1'),num('C','Deposit each compounding period',{money:true,def:0,min:0})],
  compute(v){const n=+v.n,i=v.rate/100/n,N=n*v.years;const g=Math.pow(1+i,N);const fvP=v.P*g,fvC=i===0?v.C*N:v.C*(g-1)/i,fv=fvP+fvC,dep=v.P+v.C*N;
    return{results:[R('fv','Future value',fv,{kind:'money',primary:true}),R('deposits','Total deposited',dep,{kind:'money'}),R('interest','Interest earned',fv-dep,{kind:'money'})],
      formula:'FV = P(1 + r/n)^(n·t) + C × ((1 + r/n)^(n·t) − 1) ÷ (r/n)',steps:[`r/n = ${fmtSig(i,6)}, n·t = ${fmtSig(N)}`,`P part = ${fmtSig(fvP,10)}`,`Deposits part = ${fmtSig(fvC,10)}`],assumptions:['Deposits made at the end of each compounding period.']}}});
def({id:'simple',cat:'financial',title:'Simple interest',kw:'interest flat',
  inputs:[num('P','Principal',{money:true,def:1000,min:0}),num('rate','Annual rate (%)',{def:5,min:0}),num('years','Years',{def:3,min:0})],
  compute(v){const I=v.P*v.rate/100*v.years;return{results:[R('interest','Interest',I,{kind:'money',primary:true}),R('total','Total amount',v.P+I,{kind:'money'})],formula:'I = P × r × t',steps:[`${fmtSig(v.P,10)} × ${fmtSig(v.rate)}% × ${fmtSig(v.years)} = ${cents(I).toFixed(2)}`]}}});
def({id:'roi',cat:'financial',title:'Return on investment (ROI)',kw:'profit return annualized cagr',
  inputs:[num('inv','Amount invested',{money:true,def:1000,min:0}),num('ret','Amount returned',{money:true,def:1500,min:0}),num('years','Holding period (years)',{def:2,min:0,opt:true})],
  compute(v){need(v.inv>0,'Amount invested must be above zero.','inv');const g=v.ret-v.inv,roi=g/v.inv*100;const out=[R('roi','ROI',roi,{kind:'pct',primary:true}),R('gain','Gain',g,{kind:'money'})];const st=[`(${fmtSig(v.ret,10)} − ${fmtSig(v.inv,10)}) ÷ ${fmtSig(v.inv,10)} × 100 = ${fmtSig(roi)}%`];
    if(v.years>0){const a=(Math.pow(v.ret/v.inv,1/v.years)-1)*100;out.push(R('annual','Annualized return (CAGR)',a,{kind:'pct'}));st.push(`(${fmtSig(v.ret/v.inv,6)})^(1/${fmtSig(v.years)}) − 1 = ${fmtSig(a)}%`)}
    return{results:out,formula:'ROI = (returned − invested) ÷ invested × 100 · CAGR = (returned ÷ invested)^(1/years) − 1',steps:st}}});
def({id:'vat',cat:'financial',title:'Tax / VAT / GST',kw:'sales tax gst vat add remove',
  inputs:[num('amt','Amount',{money:true,def:100,min:0}),num('rate','Tax rate (%)',{def:20,min:0,max:100}),sel('mode','Amount is',[['net','Before tax (add tax)'],['gross','Including tax (remove tax)']])],
  compute(v){let net,tax,gross;if(v.mode==='net'){net=v.amt;tax=net*v.rate/100;gross=net+tax}else{gross=v.amt;net=gross/(1+v.rate/100);tax=gross-net}
    return{results:[R('gross','Total with tax',gross,{kind:'money',primary:v.mode==='net'}),R('net','Amount before tax',net,{kind:'money',primary:v.mode==='gross'}),R('tax','Tax',tax,{kind:'money'})],formula:v.mode==='net'?'tax = net × rate · total = net + tax':'net = total ÷ (1 + rate) · tax = total − net',steps:[v.mode==='net'?`${fmtSig(net,10)} × ${fmtSig(v.rate)}% = ${cents(tax).toFixed(2)}`:`${fmtSig(gross,10)} ÷ ${fmtSig(1+v.rate/100,6)} = ${cents(net).toFixed(2)}`]}}});
def({id:'discount',cat:'financial',title:'Discount',kw:'sale price percent off savings',
  inputs:[num('price','Original price',{money:true,def:80,min:0}),num('d1','Discount (%)',{def:25,min:0,max:100}),num('d2','Extra discount (%)',{def:0,min:0,max:100})],
  compute(v){const after1=v.price*(1-v.d1/100),final=after1*(1-v.d2/100);return{results:[R('final','Final price',final,{kind:'money',primary:true}),R('save','You save',v.price-final,{kind:'money'}),R('eff','Effective discount',(1-final/(v.price||1))*100,{kind:'pct'})],formula:'final = price × (1 − d1) × (1 − d2)',steps:[`${fmtSig(v.price,10)} × (1 − ${fmtSig(v.d1)}%) × (1 − ${fmtSig(v.d2)}%) = ${cents(final).toFixed(2)}`],assumptions:['Extra discounts apply to the already-discounted price.']}}});

def({id:'ohms-law',cat:'electrical',title:"Ohm's law",kw:'voltage current resistance power watts',disclaimer:ENG,
  inputs:[num('V','Voltage',{dim:'voltage',unit:'V',def:12,opt:true}),num('I','Current',{dim:'current',unit:'A',opt:true}),num('Rr','Resistance',{dim:'resistance',unit:'Ω',def:4,opt:true}),num('P','Power',{dim:'power',unit:'W',opt:true})],
  compute(v){const k=['V','I','Rr','P'].filter(x=>Number.isFinite(v[x]));need(k.length===2,'Fill in exactly two of the four values; leave the other two empty.','V');
    let {V,I,Rr,P}=v,how='';const has=x=>k.includes(x);
    if(has('V')&&has('I')){Rr=V/I;P=V*I;how='R = V ÷ I, P = V × I'}else if(has('V')&&has('Rr')){I=V/Rr;P=V*V/Rr;how='I = V ÷ R, P = V² ÷ R'}else if(has('V')&&has('P')){I=P/V;Rr=V*V/P;how='I = P ÷ V, R = V² ÷ P'}
    else if(has('I')&&has('Rr')){V=I*Rr;P=I*I*Rr;how='V = I × R, P = I² × R'}else if(has('I')&&has('P')){V=P/I;Rr=P/(I*I);how='V = P ÷ I, R = P ÷ I²'}else{I=Math.sqrt(P/Rr);V=Math.sqrt(P*Rr);how='I = √(P ÷ R), V = √(P × R)'}
    need([V,I,Rr,P].every(Number.isFinite),'These values give a division by zero. Check for zeros.','V');
    return{results:[R('V','Voltage',V,{unitText:'V',primary:!has('V')}),R('I','Current',I,{unitText:'A',primary:!has('I')&&has('V')}),R('R','Resistance',Rr,{unitText:'Ω'}),R('P','Power',P,{unitText:'W'})],formula:'V = I × R · P = V × I',steps:[how]}}});
def({id:'power-1ph',cat:'electrical',title:'Single-phase power',kw:'watts kva power factor ac',disclaimer:ENG,
  inputs:[num('V','Voltage',{dim:'voltage',unit:'V',def:230,min:0}),num('I','Current',{dim:'current',unit:'A',def:10,min:0}),num('pf','Power factor (0–1)',{def:0.9,min:0,max:1})],
  compute(v){const S=v.V*v.I,P=S*v.pf,Q=S*Math.sin(Math.acos(v.pf));return{results:[R('P','Real power',P,{unitText:'W',primary:true}),R('S','Apparent power',S,{unitText:'VA'}),R('Q','Reactive power',Q,{unitText:'var'})],formula:'P = V × I × PF · S = V × I · Q = S × sin(acos PF)',steps:[`P = ${fmtSig(v.V)} × ${fmtSig(v.I)} × ${fmtSig(v.pf)} = ${fmtSig(P)} W`]}}});
def({id:'power-3ph',cat:'electrical',title:'Three-phase power',kw:'3 phase kw kva motor line voltage',disclaimer:ENG,
  inputs:[num('V','Line-to-line voltage',{dim:'voltage',unit:'V',def:400,min:0}),num('I','Line current',{dim:'current',unit:'A',def:10,min:0}),num('pf','Power factor (0–1)',{def:0.85,min:0,max:1})],
  compute(v){const S=Math.sqrt(3)*v.V*v.I,P=S*v.pf,Q=S*Math.sin(Math.acos(v.pf));return{results:[R('P','Real power',P,{unitText:'W',primary:true}),R('S','Apparent power',S,{unitText:'VA'}),R('Q','Reactive power',Q,{unitText:'var'})],formula:'P = √3 × V_L × I_L × PF',steps:[`P = 1.7321 × ${fmtSig(v.V)} × ${fmtSig(v.I)} × ${fmtSig(v.pf)} = ${fmtSig(P)} W`],assumptions:['Balanced three-phase load.']}}});
def({id:'voltage-drop',cat:'electrical',title:'Voltage drop',kw:'cable length drop copper aluminium',disclaimer:ENG,
  inputs:[num('I','Load current',{dim:'current',unit:'A',def:20,min:0}),num('L','One-way cable length',{dim:'length',unit:'m',imp:'ft',def:30,min:0}),num('A','Conductor cross-section',{dim:'area',unit:'mm2',imp:'mm2',def:4,min:0}),sel('mat','Conductor',[['copper','Copper'],['aluminium','Aluminium']]),sel('ph','System',[['1','Single-phase / DC'],['3','Three-phase']]),num('V','Nominal voltage',{dim:'voltage',unit:'V',def:230,min:0})],
  compute(v){need(v.A>0,'Cross-section must be above zero.','A');const Amm=v.A*1e6,k=v.ph==='3'?Math.sqrt(3):2,vd=k*v.L*v.I*RHO[v.mat]/Amm,pct=v.V>0?vd/v.V*100:NaN;
    return{results:[R('vd','Voltage drop',vd,{unitText:'V',primary:true}),R('pct','Drop as % of supply',pct,{kind:'pct'}),R('vend','Voltage at load',v.V-vd,{unitText:'V'})],formula:`ΔV = ${v.ph==='3'?'√3':'2'} × L × I × ρ ÷ A`,steps:[`ρ (${v.mat}, 20 °C) = ${RHO[v.mat]} Ω·mm²/m`,`ΔV = ${v.ph==='3'?'1.7321':'2'} × ${fmtSig(v.L)} × ${fmtSig(v.I)} × ${RHO[v.mat]} ÷ ${fmtSig(Amm)} = ${fmtSig(vd)} V`],assumptions:['Resistive drop only (reactance ignored), conductor at 20 °C. Hot conductors drop more.']}}});
def({id:'wire-size',cat:'electrical',title:'Wire size',kw:'cable sizing awg mm2 ampacity nec iec',disclaimer:ENG,version:'1.0.0',
  inputs:[sel('std','Standard',[['nec','NEC (US, AWG)'],['iec','IEC 60364 (mm²)']]),num('I','Load current',{dim:'current',unit:'A',def:40,min:0}),num('L','One-way length',{dim:'length',unit:'m',imp:'ft',def:10,min:0}),num('V','Supply voltage',{dim:'voltage',unit:'V',def:240,min:1}),sel('ph','System',[['1','Single-phase'],['3','Three-phase']]),num('maxvd','Maximum voltage drop (%)',{def:3,min:0.1,max:20}),sel('cont','Continuous load (NEC ×125%)',[['no','No'],['yes','Yes']])],
  compute(v){need(v.I>0,'Load current must be above zero.','I');const k=v.ph==='3'?Math.sqrt(3):2;const design=v.std==='nec'&&v.cont==='yes'?v.I*1.25:v.I;
    const tbl=v.std==='nec'?NEC_CU75.rows:(v.ph==='3'?IEC_CU_PVC_C.rows3:IEC_CU_PVC_C.rows2);const src=v.std==='nec'?NEC_CU75.source:IEC_CU_PVC_C.source+(v.ph==='3'?', 3 loaded conductors':', 2 loaded conductors');
    const steps=[`Design current = ${fmtSig(v.I)} A${design!==v.I?' × 1.25 = '+fmtSig(design)+' A':''}`];
    for(const row of tbl){const amp=row[3]?Math.min(row[2],row[3]):row[2];const vd=k*v.L*v.I*RHO.copper/row[1],pct=vd/v.V*100;
      if(amp>=design&&pct<=v.maxvd){steps.push(`${row[0]}: ampacity ${amp} A ≥ ${fmtSig(design)} A, drop ${fmtSig(pct,3)}% ≤ ${fmtSig(v.maxvd)}% → selected`);
        return{results:[R('size','Minimum conductor',row[0],{kind:'text',primary:true}),R('amp','Ampacity used',amp,{unitText:'A'}),R('vd','Voltage drop',vd,{unitText:'V'}),R('pct','Drop',pct,{kind:'pct'})],formula:'smallest size where ampacity ≥ design current and ΔV% ≤ limit',steps,assumptions:['Copper conductors. No correction for ambient above 30 °C, grouping or terminal ratings.',src]}}
      steps.push(`${row[0]}: ${amp<design?`ampacity ${amp} A too low`:`drop ${fmtSig(pct,3)}% too high`}`)}
    throw new ValErr('No size in the table meets both limits. Use parallel conductors or a higher voltage, and consult an engineer.','I')}});
def({id:'resistors',cat:'electrical',title:'Resistors in series / parallel',kw:'resistance combination equivalent',disclaimer:ENG,
  inputs:[area_('list','Resistor values in Ω (spaces or commas)','100 100'),sel('mode','Connection',[['p','Parallel'],['s','Series']])],
  compute(v){const a=parseList(v.list,'list');need(a.every(x=>x>0),'Resistances must be above zero.','list');const t=v.mode==='s'?a.reduce((x,y)=>x+y,0):1/a.reduce((x,y)=>x+1/y,0);
    return{results:[R('R','Equivalent resistance',t,{unitText:'Ω',primary:true})],formula:v.mode==='s'?'R = R₁ + R₂ + …':'1/R = 1/R₁ + 1/R₂ + …',steps:[v.mode==='s'?a.join(' + ')+' = '+fmtSig(t):'1 ÷ ('+a.map(x=>'1/'+x).join(' + ')+') = '+fmtSig(t)]}}});

/* ---------------- CIVIL ---------------- */
def({id:'concrete',cat:'civil',title:'Concrete volume',kw:'slab footing column cubic yards m3',disclaimer:ENG,
  inputs:[sel('shape','Shape',[['rect','Slab / footing / rectangular column'],['cyl','Round column']]),num('L','Length',{dim:'length',unit:'m',imp:'ft',def:4,min:0}),num('W','Width',{dim:'length',unit:'m',imp:'ft',def:3,min:0}),num('D','Thickness / height',{dim:'length',unit:'m',imp:'ft',def:0.15,min:0}),num('dia','Diameter (round column)',{dim:'length',unit:'m',imp:'ft',def:0.3,min:0}),num('count','Quantity',{def:1,min:1,int:true}),num('waste','Waste allowance (%)',{def:0,min:0,max:50})],
  compute(v){const one=v.shape==='rect'?v.L*v.W*v.D:Math.PI*sq(v.dia)/4*v.D;need(one>0,'Dimensions must be above zero.','L');const net=one*v.count,tot=net*(1+v.waste/100);
    return{results:[R('vol','Concrete to order',tot,{dim:'volume',primary:true,show:['m3','yd3']}),R('net','Net volume',net,{dim:'volume',show:['m3','yd3']})],formula:v.shape==='rect'?'V = L × W × D × qty × (1 + waste)':'V = π d² ÷ 4 × h × qty × (1 + waste)',steps:[`One element = ${fmtSig(one)} m³`,`× ${v.count} × (1 + ${fmtSig(v.waste)}%) = ${fmtSig(tot)} m³`],assumptions:['Ready-mix is usually ordered rounded up to the supplier increment.']}}});
def({id:'rebar',cat:'civil',title:'Rebar weight',kw:'steel bar reinforcement kg per metre',disclaimer:ENG,
  inputs:[sel('d','Bar diameter',[['6','6 mm'],['8','8 mm'],['10','10 mm'],['12','12 mm'],['16','16 mm'],['20','20 mm'],['25','25 mm'],['32','32 mm']],'12'),num('len','Length of each bar',{dim:'length',unit:'m',imp:'ft',def:12,min:0}),num('n','Number of bars',{def:10,min:1,int:true})],
  compute(v){const d=+v.d,kgm=Math.PI/4*sq(d/1000)*7850,tot=kgm*v.len*v.n;
    return{results:[R('total','Total weight',tot,{dim:'mass',primary:true,show:['kg','lb']}),R('kgm','Weight per metre',kgm,{unitText:'kg/m',sig:4}),R('len','Total length',v.len*v.n,{dim:'length',show:['m','ft']})],formula:'w = π d² ÷ 4 × 7850 kg/m³ (≈ d² ÷ 162.2 with d in mm)',steps:[`w = ${d}² ÷ 162.2 = ${fmtSig(kgm)} kg/m`,`${fmtSig(kgm)} × ${fmtSig(v.len)} m × ${v.n} = ${fmtSig(tot)} kg`],assumptions:['Steel density 7,850 kg/m³; nominal diameter.']}}});
def({id:'bricks',cat:'civil',title:'Brick / block count',kw:'masonry wall bricks blocks mortar',disclaimer:ENG,

def({id:'slope',cat:'civil',title:'Area and slope / grade',kw:'gradient ramp percent angle rise run',disclaimer:ENG,

def({id:'beam',cat:'civil',title:'Simply supported beam (basics)',kw:'bending moment shear deflection udl point load',disclaimer:ENG,
  inputs:[sel('lt','Load type',[['udl','Uniform load along the span'],['pt','Point load at mid-span']]),num('L','Span',{dim:'length',unit:'m',imp:'ft',def:6,min:0}),num('w','Uniform load',{dim:'lineload',unit:'kN/m',imp:'lbf/ft',def:10,min:0}),num('P','Point load',{dim:'force',unit:'kN',imp:'lbf',def:20,min:0}),num('E','Elastic modulus (optional)',{dim:'pressure',unit:'GPa',imp:'psi',def:200,opt:true}),num('Iz','Second moment of area (optional)',{dim:'inertia',unit:'cm4',imp:'in4',opt:true})],
  compute(v){need(v.L>0,'Span must be above zero.','L');let Rr,M,d=NaN,f;if(v.lt==='udl'){Rr=v.w*v.L/2;M=v.w*v.L*v.L/8;if(v.E>0&&v.Iz>0)d=5*v.w*Math.pow(v.L,4)/(384*v.E*v.Iz);f='R = wL/2 · M = wL²/8 · δ = 5wL⁴/(384EI)'}else{Rr=v.P/2;M=v.P*v.L/4;if(v.E>0&&v.Iz>0)d=v.P*Math.pow(v.L,3)/(48*v.E*v.Iz);f='R = P/2 · M = PL/4 · δ = PL³/(48EI)'}
    const out=[R('M','Maximum bending moment',M,{dim:'moment',primary:true,show:['kN·m','lbf·ft']}),R('V','Maximum shear = each reaction',Rr,{dim:'force',show:['kN','lbf']})];if(Number.isFinite(d))out.push(R('def','Maximum deflection',d,{dim:'length',show:['mm','in']}),R('ratio','Span / deflection',`L / ${Math.round(v.L/d)}`,{kind:'text'}));
    return{results:out,formula:f,steps:[`M = ${fmtSig(M/1000)} kN·m, R = ${fmtSig(Rr/1000)} kN`],assumptions:['Linear elastic, simply supported, self-weight not included unless added to the load. Not a design check.']}}});

def({id:'molarity',cat:'chemical',title:'Molarity',kw:'concentration mol/L solution grams',disclaimer:ENG,
  inputs:[num('m','Mass of solute (g)',{def:5.844,min:0}),num('M','Molar mass (g/mol)',{def:58.44,min:0}),num('V','Solution volume',{dim:'volume',unit:'L',imp:'L',def:1,min:0})],
  compute(v){need(v.M>0,'Molar mass must be above zero.','M');need(v.V>0,'Volume must be above zero.','V');const n=v.m/v.M,c=n/(v.V*1000);return{results:[R('c','Molarity',c,{unitText:'mol/L',primary:true}),R('n','Amount of solute',n,{unitText:'mol'})],formula:'c = (m ÷ M) ÷ V',steps:[`n = ${fmtSig(v.m)} ÷ ${fmtSig(v.M)} = ${fmtSig(n)} mol`,`c = ${fmtSig(n)} ÷ ${fmtSig(v.V*1000)} L = ${fmtSig(c)} mol/L`]}}});
def({id:'dilution',cat:'chemical',title:'Dilution (C₁V₁ = C₂V₂)',kw:'stock solution dilute',disclaimer:ENG,
  inputs:[sel('find','Find',[['V1','Stock volume needed (V₁)'],['V2','Final volume (V₂)']]),num('C1','Stock concentration C₁',{def:1,min:0}),num('C2','Final concentration C₂',{def:0.1,min:0}),num('V','Known volume (V₂ or V₁)',{dim:'volume',unit:'mL',imp:'mL',def:100,min:0})],
  compute(v){need(v.C1>0&&v.C2>0,'Concentrations must be above zero.','C1');need(v.C2<=v.C1||v.find==='V2','Final concentration cannot be higher than the stock.','C2');
    if(v.find==='V1'){const V1=v.C2*v.V/v.C1;return{results:[R('V1','Stock volume V₁',V1,{dim:'volume',primary:true,show:['mL','L']}),R('solv','Add solvent',v.V-V1,{dim:'volume',show:['mL','L']})],formula:'V₁ = C₂ × V₂ ÷ C₁',steps:[`${fmtSig(v.C2)} × ${fmtSig(v.V*1e6)} mL ÷ ${fmtSig(v.C1)} = ${fmtSig(V1*1e6)} mL`]}}
    const V2=v.C1*v.V/v.C2;return{results:[R('V2','Final volume V₂',V2,{dim:'volume',primary:true,show:['mL','L']})],formula:'V₂ = C₁ × V₁ ÷ C₂',steps:[`${fmtSig(v.C1)} × ${fmtSig(v.V*1e6)} mL ÷ ${fmtSig(v.C2)} = ${fmtSig(V2*1e6)} mL`]}}});
def({id:'molar-mass',cat:'chemical',title:'Molecular weight',kw:'molar mass formula atomic weight periodic table mass percent composition moles grams',disclaimer:ENG,
  inputs:[text('f','Chemical formula','CuSO4·5H2O',{help:'Tap the periodic table or type. Brackets and hydrates allowed: Ca(OH)2, CuSO4·5H2O'}),
    num('mass','Mass of a sample (optional — gives moles)',{dim:'mass',unit:'g',imp:'oz',opt:true,min:0}),num('mol','Amount wanted (optional — gives grams)',{dim:'amount',unit:'mol',imp:'mol',opt:true,min:0})],
  compute(v){const {total,detail}=molarMass(v.f);const els=Object.entries(detail);
    const out=[R('M','Molar mass',total,{unitText:'g/mol',primary:true,sig:6}),R('comp','Atoms per formula unit',els.map(([k,n])=>`${k}${n>1?' × '+n:''}`).join(', '),{kind:'text'})];
    for(const [k,n] of els)out.push(R('pct_'+k,`${k} (${ELEMENT[k].name}) by mass`,n*ATOMIC[k]/total*100,{kind:'pct'}));
    const steps=els.map(([k,n])=>`${k}: ${n} × ${ATOMIC[k]}${ELEMENT[k].w==null?' (mass number)':''} = ${fmtSig(n*ATOMIC[k],6)} g/mol (${fmtSig(n*ATOMIC[k]/total*100,4)}%)`);
    steps.push(`Sum: M = ${fmtSig(total,6)} g/mol`);
    if(Number.isFinite(v.mass)){const n=v.mass*1000/total;out.push(R('n','Amount in the sample',n,{dim:'amount',show:['mol','mmol']}));steps.push(`n = m ÷ M = ${fmtSig(v.mass*1000)} g ÷ ${fmtSig(total,6)} g/mol = ${fmtSig(n)} mol`)}
    if(Number.isFinite(v.mol)){const m=v.mol*total/1000;out.push(R('m','Mass for that amount',m,{dim:'mass',show:['g','kg']}));steps.push(`m = n × M = ${fmtSig(v.mol)} mol × ${fmtSig(total,6)} g/mol = ${fmtSig(m*1000)} g`)}
    const radio=els.filter(([k])=>ELEMENT[k].w==null).map(([k])=>`${k} [${ELEMENT[k].mass}]`);
    const assumptions=['Standard atomic weights are the conventional values for normal terrestrial material; real samples can differ slightly (e.g. Li, B, Pb).'];
    if(radio.length)assumptions.push(`${radio.join(', ')} ${radio.length>1?'have':'has'} no standard atomic weight; the mass number of the longest-lived isotope was used, so the result is approximate.`);
    return{results:out,formula:'M = Σ (atoms × atomic weight) · mass % = atoms × atomic weight ÷ M × 100 · n = m ÷ M',steps,assumptions,refs:[ELEMENT_SRC]}}});
def({id:'element',cat:'chemical',title:'Element and atomic mass lookup',kw:'periodic table element atomic mass atomic weight atomic number symbol group period',
  inputs:[text('q','Element','Pd',{help:'Symbol (Pd), name (palladium) or atomic number (46) — or tap the table.'})],
  compute(v){const e=findElement(v.q);need(e,`No element matches "${String(v.q).trim()}". Try a symbol (Pd), a name (palladium) or an atomic number (46).`,'q');
    const out=[e.w!=null?R('w','Standard atomic weight',e.w,{unitText:'g/mol',primary:true,sig:6}):R('w','Mass number of the longest-lived isotope',`[${e.mass}]`,{kind:'text',primary:true}),
      R('name','Element',`${e.name[0].toUpperCase()+e.name.slice(1)} (${e.sym})`,{kind:'text'}),R('z','Atomic number',e.z,{kind:'int'}),
      R('pos','Position',`Period ${e.period}, ${e.group?'group '+e.group:(e.cat==='lanthanide'?'lanthanide series':'actinide series')}`,{kind:'text'}),R('cat','Type',CAT_NAME[e.cat],{kind:'text'})];
    if(e.u!=null)out.push(R('u','Uncertainty of the abridged value',`± ${e.u} g/mol`,{kind:'text'}));
    return{results:out,formula:e.w!=null?`Standard atomic weight of ${e.sym} = ${e.w} ± ${e.u}`:`${e.sym} has no standard atomic weight; [${e.mass}] is the mass number of its longest-lived isotope`,
      steps:[`Matched "${String(v.q).trim()}" to ${e.name} (${e.sym}), atomic number ${e.z}.`],refs:[ELEMENT_SRC]}}});
def({id:'ideal-gas',cat:'chemical',title:'Ideal gas law (PV = nRT)',kw:'pressure volume moles temperature gas',disclaimer:ENG,
  inputs:[sel('find','Solve for',[['V','Volume'],['P','Pressure'],['n','Amount (mol)'],['T','Temperature']]),num('P','Pressure',{dim:'pressure',unit:'atm',imp:'psi',def:1,opt:true}),num('V','Volume',{dim:'volume',unit:'L',imp:'L',opt:true}),num('n','Amount (mol)',{def:1,opt:true}),num('T','Temperature',{dim:'temp',unit:'K',imp:'K',def:273.15,opt:true})],
  compute(v){const Rg=8.314462618;const need2=k=>need(Number.isFinite(v[k])&&v[k]>0,`Enter a positive ${k==='n'?'amount':k==='T'?'temperature':k==='P'?'pressure':'volume'}.`,k);
    let out;switch(v.find){case'V':need2('P');need2('n');need2('T');out=R('V','Volume',v.n*Rg*v.T/v.P,{dim:'volume',primary:true,show:['L','m3']});break;
      case'P':need2('V');need2('n');need2('T');out=R('P','Pressure',v.n*Rg*v.T/v.V,{dim:'pressure',primary:true,show:['kPa','atm']});break;
      case'n':need2('P');need2('V');need2('T');out=R('n','Amount',v.P*v.V/(Rg*v.T),{unitText:'mol',primary:true});break;
      default:need2('P');need2('V');need2('n');out=R('T','Temperature',v.P*v.V/(v.n*Rg),{dim:'temp',primary:true,show:['K','C']})}
    return{results:[out],formula:'PV = nRT, R = 8.314462618 J/(mol·K)',steps:['All values converted to SI (Pa, m³, mol, K) before solving.'],assumptions:['Ideal gas behaviour; real gases deviate at high pressure or low temperature.']}}});
def({id:'ph',cat:'chemical',title:'pH and pOH',kw:'acid base hydrogen ion hydroxide',disclaimer:ENG,
  inputs:[sel('from','I know',[['H','[H⁺] (mol/L)'],['OH','[OH⁻] (mol/L)'],['pH','pH'],['pOH','pOH']]),num('x','Value',{def:0.001})],
  compute(v){fin(v.x,'x','Value');let pH;if(v.from==='H'){need(v.x>0,'Concentration must be above zero.','x');pH=-Math.log10(v.x)}else if(v.from==='OH'){need(v.x>0,'Concentration must be above zero.','x');pH=14+Math.log10(v.x)}else if(v.from==='pH')pH=v.x;else pH=14-v.x;
    return{results:[R('pH','pH',pH,{primary:true,sig:4}),R('pOH','pOH',14-pH),R('H','[H⁺]',Math.pow(10,-pH),{unitText:'mol/L'}),R('OH','[OH⁻]',Math.pow(10,pH-14),{unitText:'mol/L'}),R('kind','Solution is',pH<7?'Acidic':pH>7?'Basic':'Neutral',{kind:'text'})],formula:'pH = −log₁₀[H⁺] · pH + pOH = 14',steps:['Uses Kw = 1.0 × 10⁻¹⁴ at 25 °C.'],assumptions:['Dilute aqueous solution at 25 °C; activity ≈ concentration.']}}});
def({id:'flow',cat:'chemical',title:'Flow rate in a pipe',kw:'velocity diameter discharge q = av',disclaimer:ENG,
  inputs:[sel('find','Find',[['Q','Flow rate from velocity'],['v','Velocity from flow rate']]),num('d','Pipe inner diameter',{dim:'length',unit:'mm',imp:'in',def:100,min:0}),num('vel','Velocity',{dim:'speed',unit:'m/s',imp:'ft/s',def:2,opt:true}),num('Q','Flow rate',{dim:'flow',unit:'L/s',imp:'gpm',opt:true})],
  compute(v){need(v.d>0,'Diameter must be above zero.','d');const A=Math.PI*sq(v.d)/4;if(v.find==='Q'){need(Number.isFinite(v.vel),'Enter a velocity.','vel');const Q=A*v.vel;return{results:[R('Q','Flow rate',Q,{dim:'flow',primary:true,show:['L/s','m3/h','gpm']}),R('A','Flow area',A,{dim:'area',show:['mm2','in2']})],formula:'Q = A × v, A = π d² ÷ 4',steps:[`A = ${fmtSig(A)} m², Q = ${fmtSig(A)} × ${fmtSig(v.vel)} = ${fmtSig(Q)} m³/s`]}}
    need(Number.isFinite(v.Q),'Enter a flow rate.','Q');const vel=v.Q/A;return{results:[R('vel','Velocity',vel,{dim:'speed',primary:true,show:['m/s','ft/s']})],formula:'v = Q ÷ A',steps:[`${fmtSig(v.Q)} ÷ ${fmtSig(A)} = ${fmtSig(vel)} m/s`]}}});

   RUN: validate + convert + compute
   raw: {key: number | [number, unit] | string}
   ================================================================ */
function runCalc(id, raw={}){
  const c=CALCS.find(x=>x.id===id); if(!c) throw new ValErr('Unknown calculator.');
  const v={};
  for(const inp of c.inputs){
    let x=raw[inp.key];
    if(inp.type==='num'){
      let unit=inp.unit; if(Array.isArray(x)){unit=x[1];x=x[0]}
      if(x===undefined||x===null||x===''){ if(raw.__useDefaults&&inp.def!==undefined){x=inp.def} else if(inp.opt){v[inp.key]=NaN;continue} else throw new ValErr(`Enter ${inp.label.toLowerCase()}.`,inp.key) }
      x=typeof x==='string'?numFrom(x,inp.key,inp.label):x;
      fin(x,inp.key,inp.label);
      if(inp.min!==undefined&&x<inp.min) throw new ValErr(`${inp.label} must be at least ${inp.min}.`,inp.key);
      if(inp.max!==undefined&&x>inp.max) throw new ValErr(`${inp.label} must be at most ${inp.max}.`,inp.key);
      if(inp.int&&!Number.isInteger(x)) throw new ValErr(`${inp.label} must be a whole number.`,inp.key);
      v[inp.key]=inp.dim?toSI(x,inp.dim,unit):x;
    } else v[inp.key]=x===undefined?inp.def:x;
  }
  const out=c.compute(v);
  if(!(out.refs&&out.refs.length)&&c.refs)out.refs=c.refs;
  if(c.extraAssumptions)out.assumptions=[...(out.assumptions||[]),...c.extraAssumptions];
  if(c.check)for(const k of (c.check(v,out)||[]).filter(Boolean))out.results.push(R(k.key,k.label,k.text,{kind:'text',check:k.ok===true?'ok':k.ok==='warn'?'warn':'bad'}));
  if(c.warn){const w=(c.warn(v,out)||[]).filter(Boolean);if(w.length)out.warnings=w}
  for(const r of out.results){ if(r.kind!=='text'&&r.kind!==undefined&&r.kind!=='int'&&r.kind!=='money'&&r.kind!=='pct'&&r.kind!=='num') continue;
    if(typeof r.value==='number'&&!Number.isFinite(r.value)) throw new ValErr('These inputs do not give a finite result. Check for zeros.'); }
  return {...out, calc:c.id, version:c.version, disclaimer:c.disclaimer};
}

/* Friction factor: laminar 64/Re; turbulent Colebrook–White solved iteratively (start: Swamee–Jain) */
function frictionFactor(Re, rel){
  if(Re<2300) return {f:64/Re, regime:'Laminar', method:'f = 64 ÷ Re'};
  let f=0.25/sq(Math.log10(rel/3.7+5.74/Math.pow(Re,0.9)));
  for(let k=0;k<60;k++){ const nf=1/sq(-2*Math.log10(rel/3.7+2.51/(Re*Math.sqrt(f)))); if(Math.abs(nf-f)<1e-12){f=nf;break} f=nf }
  return {f, regime:Re<4000?'Transitional (uncertain — treated as turbulent)':'Turbulent', method:'Colebrook–White: 1/√f = −2 log₁₀(ε/3.7D + 2.51/(Re√f))'};
}
function darcy({Q,D,L,eps,rho,nu,dz=0}){
  need(D>0,'Inside diameter must be above zero.','D');need(Q>0,'Flow rate must be above zero.','Q');need(nu>0,'Viscosity must be above zero.','nu');need(rho>0,'Density must be above zero.','rho');
  const A=area(D), v=Q/A, Re=v*D/nu, ff=frictionFactor(Re, eps/D);
  const hf=ff.f*(L/D)*v*v/(2*G0), dpf=rho*G0*hf, dpz=rho*G0*dz;
  return {A,v,Re,...ff,hf,dpf,dpz,dp:dpf+dpz};
}

function barlow(v, factorText, factor, refs, code){

  if(v.mode==='t'){
    need(v.P>0,'Enter the design pressure.','P');
    const tp=v.P*D/(2*S*factor), treq=tp+CA, tnom=treq/(1-tol), hoop=v.P*D/(2*tnom);
    steps.push(`Pressure design thickness t = P D ÷ (2 S × factors) = ${fmtSig(v.P/1e6)} MPa × ${fmtSig(D*1000)} mm ÷ (2 × ${fmtSig(S/1e6)} MPa × ${fmtSig(factor,4)}) = ${fmtSig(tp*1000)} mm`);
    if(CA) steps.push(`+ corrosion allowance ${fmtSig(CA*1000)} mm = ${fmtSig(treq*1000)} mm`);
    if(tol) steps.push(`÷ (1 − ${fmtSig(tol*100)}% mill under-tolerance) = ${fmtSig(tnom*1000)} mm minimum nominal wall`);
    return {results:[R('tnom','Minimum nominal wall thickness',tnom,{dim:'length',primary:true,show:['mm','in']}),R('tp','Pressure design thickness',tp,{dim:'length',show:['mm','in']}),
      R('Dt','D / t ratio (nominal)',D/tnom,{sig:4}),R('hoopPct','Hoop stress / SMYS at design pressure (nominal wall)',hoop/S*100,{kind:'pct'})],
      formula:`${code}: P = 2 S t ÷ D × ${factorText}  →  t = P D ÷ (2 S × ${factorText})`,steps,
      assumptions:['Choose the next standard wall (e.g. ASME B36.10 schedule) at or above the minimum nominal wall.','Does not cover external loads, buckling, fatigue, road/rail crossings or fittings — check those separately.'],refs};
  }
  need(v.t>0,'Enter the nominal wall thickness.','t');
  const tnet=v.t*(1-tol)-CA; need(tnet>0,'Allowances are larger than the wall thickness.','t');
  const P=2*S*tnet*factor/D, hoop=P*D/(2*v.t);

  steps.push(`P = 2 × ${fmtSig(S/1e6)} MPa × ${fmtSig(tnet*1000)} mm ÷ ${fmtSig(D*1000)} mm × ${fmtSig(factor,4)} = ${fmtSig(P/1e6)} MPa = ${fmtSig(P/6894.757293168)} psi`);
  return {results:[R('P','Maximum design pressure (MAOP basis)',P,{dim:'pressure',primary:true,show:['MPa','bar','psi']}),R('hoop','Hoop stress at that pressure (nominal wall)',hoop,{dim:'pressure',show:['MPa','ksi']}),
    R('hoopPct','Hoop stress / SMYS',hoop/S*100,{kind:'pct'}),R('Dt','D / t ratio',D/v.t,{sig:4})],
    formula:`${code}: P = 2 S t ÷ D × ${factorText}`,steps,
    assumptions:['MAOP of a real line also depends on the hydrostatic test pressure, fittings, flanges and valves — the lowest rating governs.'],refs};
}

/* Hunter's probability method (NBS BMS65, 1940): smallest r with P(more than r fixtures flowing) ≤ risk */
function binomTail(n,p,r){ // P(X > r), log-space so large n does not underflow
  let lt=n*Math.log1p(-p), cdf=Math.exp(lt);
  for(let k=1;k<=r;k++){ lt+=Math.log((n-k+1)/k)+Math.log(p)-Math.log1p(-p); cdf+=Math.exp(lt) }
  return Math.max(0,1-cdf);
}

def({id:'fp-k',cat:'fire',title:'Sprinkler flow and pressure (K-factor)',kw:'sprinkler k factor flow pressure gpm psi nozzle q = k sqrt p',disclaimer:ENG,

def({id:'fp-friction',cat:'fire',title:'Sprinkler pipe friction loss (Hazen–Williams)',kw:'friction loss sprinkler pipe hazen williams nfpa 13 psi per foot c factor',disclaimer:ENG,

def({id:'el-pfc',cat:'electrical',title:'Power factor correction capacitor',kw:'power factor correction kvar capacitor bank improve pf',disclaimer:ENG,

def({id:'el-lux',cat:'electrical',title:'Lighting design (lumen method)',kw:'lighting lux lumen method number of fittings luminaires illuminance foot candles',disclaimer:ENG,

const gcd=(a,b)=>b?gcd(b,a%b):a;
function fracStr(x,den){const s=x<0?'−':'',a=Math.abs(x);let w=Math.floor(a),n=Math.round((a-w)*den);if(n===den){w++;n=0}const g=n?gcd(n,den):1;return n?`${s}${w?w+' ':''}${n/g}/${den/g}`:`${s}${w}`}

def({id:'frac-inch',cat:'general',title:'Fractions and inches',kw:'fraction inch tape measure 1/16 feet inches add subtract mixed numbers',
  inputs:[text('expr','Expression','3 1/2 + 2 3/4',{help:'Mixed numbers like 3 1/2 or 3-1/2, feet with \' (5\' 3 1/4"), and + − × ÷. Result is in inches.'}),sel('den','Round to the nearest',[['16','1/16 in'],['8','1/8 in'],['32','1/32 in'],['64','1/64 in'],['4','1/4 in']])],
  compute(v){let s=String(v.expr||'').replace(/["″]/g,' ').replace(/[×x]/g,'*').replace(/÷/g,'/').trim();need(s,'Type a measurement, for example 3 1/2 + 2 3/4.','expr');
    s=s.replace(/(\d+(?:\.\d+)?)\s*['′]\s*(?=\d)/g,'($1*12)+').replace(/(\d+(?:\.\d+)?)\s*['′]/g,'($1*12)');
    s=s.replace(/(\d+)[\s-]+(\d+)\/(\d+)/g,'($1+$2/$3)');
    let x;try{x=evalExpr(s,'deg')}catch(e){throw new ValErr('Check the expression: '+e.message.replace(' Use * for multiplication.',''),'expr')}
    const den=+v.den,ft=Math.trunc(x/12),inch=x-ft*12;
    return{results:[R('frac','Result',fracStr(x,den)+' in',{kind:'text',primary:true}),R('dec','Decimal inches',x,{sig:6,unitText:'in'}),R('mm','Millimetres',x*25.4,{sig:6,unitText:'mm'}),R('ftin','Feet and inches',`${ft}′ ${fracStr(inch,den)}″`,{kind:'text'})],
      formula:'Mixed numbers are converted to decimals, calculated, then rounded to the nearest fraction · 1 in = 25.4 mm',steps:[`Expression evaluated as ${s} = ${fmtSig(x,8)} in`,`Nearest 1/${den} in: ${fracStr(x,den)} in`],refs:['1 in = 25.4 mm exactly (NIST SP 811)']}}});
def({id:'right-tri',cat:'general',title:'Right triangle solver',kw:'pythagoras hypotenuse right angle triangle sides angle trigonometry',
  inputs:[num('a','Side a (opposite angle A)',{dim:'length',unit:'m',imp:'ft',def:3,opt:true}),num('b','Side b (adjacent to angle A)',{dim:'length',unit:'m',imp:'ft',def:4,opt:true}),num('c','Hypotenuse c',{dim:'length',unit:'m',imp:'ft',opt:true}),num('A','Angle A (degrees)',{opt:true,help:'Enter any two values (at least one side); leave the rest empty.'})],
  compute(v){let {a,b,c,A}=v;const h=x=>Number.isFinite(x);const ar=A*Math.PI/180;
    need([a,b,c,A].filter(h).length>=2,'Enter two values, at least one of them a side.','a');need(h(a)||h(b)||h(c),'Enter at least one side.','a');if(h(A))need(A>0&&A<90,'Angle A must be between 0 and 90°.','A');
    if(h(a)&&h(b)){c=Math.hypot(a,b)}else if(h(a)&&h(c)){need(c>a,'The hypotenuse must be the longest side.','c');b=Math.sqrt(c*c-a*a)}else if(h(b)&&h(c)){need(c>b,'The hypotenuse must be the longest side.','c');a=Math.sqrt(c*c-b*b)}
    else if(h(A)&&h(a)){c=a/Math.sin(ar);b=a/Math.tan(ar)}else if(h(A)&&h(b)){a=b*Math.tan(ar);c=b/Math.cos(ar)}else if(h(A)&&h(c)){a=c*Math.sin(ar);b=c*Math.cos(ar)}
    need(a>0&&b>0&&c>0,'Sides must be above zero.','a');const Ad=Math.atan2(a,b)*180/Math.PI;
    return{results:[R('c','Hypotenuse c',c,{dim:'length',primary:true}),R('a','Side a',a,{dim:'length'}),R('b','Side b',b,{dim:'length'}),R('A','Angle A',Ad,{sig:6,unitText:'°'}),R('B','Angle B',90-Ad,{sig:6,unitText:'°'}),R('area','Area',a*b/2,{dim:'area'}),R('per','Perimeter',a+b+c,{dim:'length'})],
      formula:'c² = a² + b² · sin A = a/c · cos A = b/c · tan A = a/b',steps:[`a = ${fmtSig(a,6)}, b = ${fmtSig(b,6)}, c = ${fmtSig(c,6)} m`,`A = atan(a/b) = ${fmtSig(Ad,6)}°, B = 90° − A`],refs:['Pythagorean theorem and right-triangle trigonometry']}}});
def({id:'time-calc',cat:'general',title:'Time and hours worked',kw:'hours worked timesheet duration time between clock overtime pay',
  inputs:[text('s','Start time','08:30',{help:'24-hour (17:15) or 12-hour (5:15 pm). An end time earlier than the start counts as overnight.'}),text('e','End time','17:15'),num('brk','Unpaid break (minutes)',{def:30,min:0}),num('rate','Hourly rate (optional)',{money:true,opt:true,min:0})],
  compute(v){const p=(t,k)=>{const m=String(t||'').trim().toLowerCase().match(/^(\d{1,2})(?::(\d{2}))?\s*(am|pm)?$/);need(m,'Enter a time like 08:30 or 5:15 pm.',k);let H=+m[1],M=+(m[2]||0);need(M<60&&H<=(m[3]?12:23),'Enter a valid time.',k);if(m[3]==='pm'&&H<12)H+=12;if(m[3]==='am'&&H===12)H=0;return H*60+M};
    const a=p(v.s,'s'),b=p(v.e,'e');let d=b-a;const over=d<0;if(over)d+=1440;d-=v.brk;need(d>=0,'The break is longer than the time worked.','brk');const hrs=d/60;
    const out=[R('h','Hours worked',hrs,{sig:4,unitText:'h',primary:true}),R('hm','Hours and minutes',`${Math.floor(d/60)} h ${String(d%60).padStart(2,'0')} min`,{kind:'text'})];
    if(Number.isFinite(v.rate))out.push(R('pay','Pay',hrs*v.rate,{kind:'money'}));
    return{results:out,formula:'hours = (end − start − break) ÷ 60',steps:[`${over?'Overnight shift: ':''}${b-a+(over?1440:0)} min − ${v.brk} min break = ${d} min`],refs:['Clock arithmetic (24-hour time, ISO 8601)']}}});

def({id:'markup',cat:'financial',title:'Markup and margin',kw:'markup margin profit selling price cost gross margin',
  inputs:[num('cost','Cost',{money:true,def:80,min:0}),sel('find','I know',[['price','Selling price'],['mu','Markup %'],['mg','Margin %']]),num('x','Value',{def:100,help:'The selling price, markup % or margin %, as chosen above.'})],
  compute(v){need(v.cost>0,'Cost must be above zero.','cost');let price;if(v.find==='price')price=v.x;else if(v.find==='mu')price=v.cost*(1+v.x/100);else{need(v.x<100,'Margin must be below 100 %.','x');price=v.cost/(1-v.x/100)}
    need(price>0,'The selling price must be above zero.','x');const pr=price-v.cost;
    return{results:[R('price','Selling price',price,{kind:'money',primary:true}),R('profit','Gross profit',pr,{kind:'money'}),R('mu','Markup (on cost)',pr/v.cost*100,{kind:'pct'}),R('mg','Margin (on price)',pr/price*100,{kind:'pct'})],
      formula:'markup = profit ÷ cost · margin = profit ÷ price',steps:[`profit = ${fmtSig(price,10)} − ${fmtSig(v.cost,10)} = ${fmtSig(pr,10)}`],refs:['Standard pricing definitions: markup on cost, gross margin on selling price']}}});
def({id:'break-even',cat:'financial',title:'Break-even point',kw:'break even units fixed costs variable cost contribution margin',
  inputs:[num('F','Fixed costs (per period)',{money:true,def:50000,min:0}),num('p','Price per unit',{money:true,def:25,min:0}),num('vc','Variable cost per unit',{money:true,def:15,min:0}),num('tp','Target profit (optional)',{money:true,opt:true,min:0})],
  compute(v){const cm=v.p-v.vc;need(cm>0,'The price must be above the variable cost.','p');const u=v.F/cm,out=[R('u','Break-even units',u,{sig:6,primary:true}),R('rev','Break-even revenue',u*v.p,{kind:'money'}),R('cm','Contribution per unit',cm,{kind:'money'}),R('cmr','Contribution margin ratio',cm/v.p*100,{kind:'pct'})];
    if(Number.isFinite(v.tp))out.push(R('ut','Units for the target profit',(v.F+v.tp)/cm,{sig:6}));
    return{results:out,formula:'units = fixed costs ÷ (price − variable cost)',steps:[`${fmtSig(v.F,10)} ÷ (${fmtSig(v.p)} − ${fmtSig(v.vc)}) = ${fmtSig(u,6)} units`],refs:['Cost–volume–profit analysis']}}});
def({id:'npv',cat:'financial',title:'NPV, IRR and payback',kw:'net present value internal rate of return payback discounted cash flow investment project',
  inputs:[num('I0','Initial investment',{money:true,def:10000,min:0}),area_('cf','Yearly cash flows (one per year)','3000 3500 4000 4500',{help:'Net cash in for years 1, 2, 3 … separated by spaces or new lines.'}),num('r','Discount rate (%)',{def:8,min:-99})],
  compute(v){const cf=parseList(v.cf,'cf'),r=v.r/100;const npvAt=k=>-v.I0+cf.reduce((s,c,t)=>s+c/Math.pow(1+k,t+1),0);const npv=npvAt(r);
    let irr=NaN;if(npvAt(-0.99)>0&&npvAt(10)<0){let lo=-0.99,hi=10;for(let k=0;k<200;k++){const m=(lo+hi)/2;if(npvAt(m)>0)lo=m;else hi=m}irr=(lo+hi)/2}
    const pay=(disc)=>{let c=-v.I0;for(let t=0;t<cf.length;t++){const x=disc?cf[t]/Math.pow(1+r,t+1):cf[t];if(c+x>=0)return t+(-c)/x;c+=x}return NaN};
    const out=[R('npv','Net present value',npv,{kind:'money',primary:true}),R('irr','Internal rate of return',irr*100,{kind:'pct'}),R('pb','Simple payback',pay(false),{sig:3,unitText:'years'}),R('dpb','Discounted payback',pay(true),{sig:3,unitText:'years'}),R('pi','Profitability index',v.I0>0?(npv+v.I0)/v.I0:NaN,{sig:4})];
    return{results:out,formula:'NPV = −I₀ + Σ CFₜ ÷ (1 + r)ᵗ · IRR: the rate where NPV = 0',steps:cf.slice(0,10).map((c,t)=>`Year ${t+1}: ${fmtSig(c,10)} ÷ ${fmtSig(Math.pow(1+r,t+1),6)} = ${fmtSig(c/Math.pow(1+r,t+1),8)}`),
      assumptions:['Cash flows arrive at the end of each year. IRR is not shown when the cash flows change sign more than once or never pay back.'],refs:['Discounted cash flow analysis (standard engineering economics)']}}});
def({id:'depreciation',cat:'financial',title:'Depreciation',kw:'depreciation straight line declining balance sum of years book value asset',
  inputs:[num('cost','Asset cost',{money:true,def:50000,min:0}),num('salv','Salvage value',{money:true,def:5000,min:0}),num('life','Useful life (years)',{def:5,min:1,max:50,int:true}),sel('m','Method',[['sl','Straight line'],['ddb','Double-declining balance'],['syd','Sum-of-years’ digits']]),num('yr','Show year',{def:1,min:1,int:true})],
  compute(v){need(v.salv<v.cost,'Salvage value must be below the cost.','salv');need(v.yr<=v.life,'The year must be within the useful life.','yr');const n=v.life,base=v.cost-v.salv;const dep=[];let bv=v.cost;
    for(let t=1;t<=n;t++){let d=v.m==='sl'?base/n:v.m==='syd'?base*(n-t+1)/(n*(n+1)/2):Math.min(bv*2/n,bv-v.salv);if(v.m==='ddb'&&t===n)d=bv-v.salv;dep.push(d);bv-=d}
    const bvAt=v.cost-dep.slice(0,v.yr).reduce((a,b)=>a+b,0);
    return{results:[R('d','Depreciation in year '+v.yr,dep[v.yr-1],{kind:'money',primary:true}),R('bv','Book value at end of year '+v.yr,bvAt,{kind:'money'}),R('d1','First-year depreciation',dep[0],{kind:'money'}),R('sched','Schedule',dep.map((d,t)=>`Y${t+1} ${fmtMoney(d)}`).join(' · '),{kind:'text'})],
      formula:v.m==='sl'?'D = (cost − salvage) ÷ life':v.m==='syd'?'Dₜ = (cost − salvage) × remaining life ÷ (n(n+1)/2)':'Dₜ = book value × 2 ÷ life, not below salvage',steps:[`Depreciable base = ${fmtSig(base,10)}`],
      assumptions:['Full-year convention. Tax depreciation (CCA in Canada, MACRS in the US) follows separate rules.'],refs:['Standard accounting depreciation methods']}}});

const NEC_GROUP=[[3,1],[6,0.8],[9,0.7],[20,0.5],[30,0.45],[40,0.4],[Infinity,0.35]];
def({id:'el-derate',cat:'electrical',title:'Cable ampacity derating',kw:'ampacity derating ambient temperature correction grouping bundling adjustment factor conductors',disclaimer:ENG,
  inputs:[num('Ib','Table ampacity',{dim:'current',unit:'A',def:30,min:0,help:'From the ampacity table for the conductor and insulation, at 30 °C ambient.'}),sel('tc','Conductor temperature rating',[['75','75 °C'],['60','60 °C'],['90','90 °C']]),num('ta','Ambient temperature',{dim:'temp',unit:'C',imp:'F',def:40}),num('n','Current-carrying conductors in the raceway or cable',{def:6,min:1,int:true})],
  compute(v){const Tc=+v.tc,Ta=v.ta-273.15;need(Ta<Tc,'Ambient must be below the conductor rating.','ta');const kt=Math.sqrt((Tc-Ta)/(Tc-30)),kg=NEC_GROUP.find(([m])=>v.n<=m)[1],I=v.Ib*kt*kg;

      formula:'I = I_table × √((Tc − Ta) ÷ (Tc − 30)) × adjustment factor',steps:[`kt = √((${Tc} − ${fmtSig(Ta)}) ÷ (${Tc} − 30)) = ${fmtSig(kt,4)}`,`${v.n} conductors → adjustment ${kg}`,`I = ${fmtSig(v.Ib)} × ${fmtSig(kt,4)} × ${kg} = ${fmtSig(I,4)} A`],
      assumptions:['Table ambient 30 °C (86 °F). Terminal ratings (often 75 °C) can limit the usable ampacity.'],refs:['NEC 2023 §310.15(B) temperature correction equation and Table 310.15(C)(1) adjustment factors','Canada: CSA C22.1 Rule 4-004 and Tables 5A/5C give the equivalent factors']}}});

def({id:'el-battery',cat:'electrical',title:'Battery and UPS runtime',kw:'battery runtime ups backup amp hours inverter load hours depth of discharge',disclaimer:ENG,

def({id:'el-solar',cat:'electrical',title:'Solar PV system size',kw:'solar pv panels array size kw battery off grid peak sun hours',disclaimer:ENG,

def({id:'bearing-dist',cat:'cad',title:'Distance and bearing between two points',kw:'bearing azimuth distance coordinates northing easting survey inverse',

  compute(v){const dE=v.E2-v.E1,dN=v.N2-v.N1,d=Math.hypot(dE,dN);need(d>0,'The two points are the same.','E2');let az=Math.atan2(dE,dN)*180/Math.PI;if(az<0)az+=360;
    const dms=x=>{const D=Math.floor(x),m=(x-D)*60,M=Math.floor(m),S=(m-M)*60;return `${D}° ${String(M).padStart(2,'0')}′ ${S.toFixed(1).padStart(4,'0')}″`};
    const q=az<=90?['N',az,'E']:az<=180?['S',180-az,'E']:az<=270?['S',az-180,'W']:['N',360-az,'W'];

def({id:'triangle',cat:'cad',title:'Triangle solver (any triangle)',kw:'triangle solver law of cosines law of sines sss sas asa angles sides area',
  inputs:[sel('k','I know',[['sss','Three sides (SSS)'],['sas','Two sides and the angle between (SAS)'],['asa','Two angles and the side between (ASA)']]),num('a','Side a',{dim:'length',unit:'m',imp:'ft',def:5,opt:true}),num('b','Side b',{dim:'length',unit:'m',imp:'ft',def:6,opt:true}),num('c','Side c',{dim:'length',unit:'m',imp:'ft',def:7,opt:true}),num('A','Angle A (degrees, opposite a)',{opt:true}),num('B','Angle B (degrees, opposite b)',{opt:true}),num('C','Angle C (degrees, opposite c)',{opt:true,help:'SAS uses a, b and C. ASA uses A, B and c.'})],
  compute(v){let {a,b,c,A,B,C}=v;const rd=x=>x*Math.PI/180,dg=x=>x*180/Math.PI;
    if(v.k==='sss'){need(a>0&&b>0&&c>0,'Enter all three sides.','a');need(a+b>c&&a+c>b&&b+c>a,'These sides cannot form a triangle.','a');A=dg(Math.acos((b*b+c*c-a*a)/(2*b*c)));B=dg(Math.acos((a*a+c*c-b*b)/(2*a*c)));C=180-A-B}
    else if(v.k==='sas'){need(a>0&&b>0&&C>0&&C<180,'Enter sides a and b and angle C.','C');c=Math.sqrt(a*a+b*b-2*a*b*Math.cos(rd(C)));A=dg(Math.acos((b*b+c*c-a*a)/(2*b*c)));B=180-A-C}

def({id:'weld',cat:'mechanical',title:'Fillet weld strength',kw:'fillet weld strength throat electrode e70 e60 lrfd asd aisc capacity',disclaimer:ENG,

def({id:'beam-cases',cat:'mechanical',title:'Beam moments and deflections (cantilever and fixed)',kw:'cantilever beam fixed beam deflection moment point load udl end load',disclaimer:ENG,
  inputs:[sel('cs','Case',[['cpt','Cantilever, point load at the free end'],['cudl','Cantilever, uniform load'],['fudl','Fixed both ends, uniform load'],['spt','Simply supported, point load at mid-span']]),num('L','Span',{dim:'length',unit:'m',imp:'ft',def:3,min:0}),num('P','Point load P',{dim:'force',unit:'kN',imp:'kip',def:10,opt:true}),num('w','Uniform load w',{dim:'lineload',unit:'kN/m',imp:'kip/ft',def:5,opt:true}),num('E','Elastic modulus',{dim:'pressure',unit:'GPa',imp:'ksi',def:200,min:0}),num('I','Second moment of area',{dim:'inertia',unit:'cm4',imp:'in4',def:2000,min:0})],
  compute(v){const {L,P,w,E,I}=v,EI=E*I;let M,V,d,lim;

    else if(v.cs==='fudl'){need(w>0,'Enter the uniform load.','w');M=w*L*L/12;V=w*L/2;d=w*L**4/(384*EI);lim=360}
    else{need(P>0,'Enter the point load.','P');M=P*L/4;V=P/2;d=P*L**3/(48*EI);lim=360}

      formula:{cpt:'M = PL · δ = PL³/(3EI)',cudl:'M = wL²/2 · δ = wL⁴/(8EI)',fudl:'M(ends) = wL²/12 · δ = wL⁴/(384EI)',spt:'M = PL/4 · δ = PL³/(48EI)'}[v.cs],steps:[`EI = ${fmtSig(EI/1e3,5)} kN·m²`,`δ = ${fmtSig(d*1000,4)} mm`],

def({id:'stress',cat:'mechanical',title:'Axial stress, strain and elongation',kw:'stress strain elongation axial load tension compression young modulus factor of safety',disclaimer:ENG,
  inputs:[num('F','Axial force',{dim:'force',unit:'kN',imp:'kip',def:50}),num('A','Cross-sectional area',{dim:'area',unit:'mm2',imp:'in2',def:314,min:0,help:'A 20 mm round bar is 314 mm².'}),num('L','Length',{dim:'length',unit:'m',imp:'ft',def:1,min:0}),num('E','Elastic modulus',{dim:'pressure',unit:'GPa',imp:'ksi',def:200,min:0}),num('fy','Yield strength (optional)',{dim:'pressure',unit:'MPa',imp:'ksi',opt:true,min:0})],
