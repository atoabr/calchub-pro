def({id:'gas-z',cat:'gaspipe',title:'Gas compressibility factor Z',kw:'z factor compressibility natural gas papay sutton pseudo critical gas deviation',disclaimer:ENG,
  inputs:[num('G','Gas specific gravity (air = 1)',{def:0.65,min:0.55,max:1.5}),num('P','Pressure (absolute)',{dim:'pressure',unit:'kPa',imp:'psi',def:7000,min:0}),num('T','Temperature',{dim:'temp',unit:'C',imp:'F',def:15})],
  compute(v){const G=v.G,Tpc=(169.2+349.5*G-74.0*G*G)/1.8,Ppc=(756.8-131.0*G-3.6*G*G)*6894.757293168,Tpr=v.T/Tpc,Ppr=v.P/Ppc;
    const Z=1-3.53*Ppr/Math.pow(10,0.9813*Tpr)+0.274*Ppr*Ppr/Math.pow(10,0.8157*Tpr),M=28.9647*G,rho=v.P*M/1000/(Z*8.314462618*v.T);
    return{results:[R('Z','Compressibility factor Z',Z,{sig:4,primary:true}),R('rho','Gas density at these conditions',rho,{dim:'density',show:['kg/m3','lb/ft3']}),R('Tpr','Pseudo-reduced temperature',Tpr,{sig:4}),R('Ppr','Pseudo-reduced pressure',Ppr,{sig:4}),R('Tpc','Pseudo-critical temperature',Tpc,{dim:'temp',show:['K','F']}),R('Ppc','Pseudo-critical pressure',Ppc,{dim:'pressure',show:['kPa','psi']})],
      formula:'Sutton: Tpc = 169.2 + 349.5G − 74.0G² (°R), Ppc = 756.8 − 131.0G − 3.6G² (psia) · Papay: Z = 1 − 3.53 Ppr ÷ 10^(0.9813 Tpr) + 0.274 Ppr² ÷ 10^(0.8157 Tpr)',steps:[`Tpr = ${fmtSig(Tpr,4)}, Ppr = ${fmtSig(Ppr,4)}`,`Z = ${fmtSig(Z,4)}`],
      assumptions:['Sweet natural gas. For H₂S or CO₂ above a few percent apply the Wichert–Aziz correction.'],refs:['Sutton (1985) pseudo-critical correlation; Papay (1968) Z-factor correlation, as in E. S. Menon, Gas Pipeline Hydraulics']}},
  warn:(v,o)=>{const Tpr=o.results.find(r=>r.key==='Tpr').value,Ppr=o.results.find(r=>r.key==='Ppr').value;return[(Tpr<1.2||Tpr>3)&&'Tpr is outside about 1.2–3, where the Papay correlation is less reliable.',Ppr>15&&'Ppr is above about 15; use a full equation of state.']}});
def({id:'hydrotest',cat:'gaspipe',title:'Hydrostatic test water volume',kw:'hydrotest hydrostatic test water volume pressurisation fill pipeline test pressure',disclaimer:ENG,
  inputs:[num('D','Outside diameter',{dim:'length',unit:'mm',imp:'in',def:610,min:0}),num('t','Wall thickness',{dim:'length',unit:'mm',imp:'in',def:9.5,min:0}),num('L','Test section length',{dim:'length',unit:'km',imp:'mi',def:10,min:0}),num('dP','Test pressure (gauge)',{dim:'pressure',unit:'kPa',imp:'psi',def:10000,min:0}),num('E','Pipe elastic modulus',{dim:'pressure',unit:'GPa',imp:'ksi',def:207,min:0}),num('cw','Water compressibility (× 10⁻¹⁰ per Pa)',{def:4.6,min:3,max:6,help:'About 4.6 at 15 °C and 4.4 at 30 °C.'})],
  compute(v){need(2*v.t<v.D,'Wall thickness must be less than half the diameter.','t');const Di=v.D-2*v.t,V=Math.PI*Di*Di/4*v.L,k=Di*(1-0.09)/(v.E*v.t)+v.cw*1e-10,dV=V*v.dP*k;
    return{results:[R('V','Fill volume',V,{dim:'volume',primary:true,show:['m3','galUS']}),R('dV','Extra water to reach test pressure',dV,{dim:'volume',show:['m3','L','galUS']}),R('pct','Extra water as % of fill',dV/V*100,{kind:'pct'})],
      formula:'V = π Dᵢ² L ÷ 4 · ΔV = V × ΔP × (Dᵢ(1 − ν²) ÷ (E t) + C_w), ν = 0.3',steps:[`Dᵢ = ${fmtSig(Di*1000,5)} mm, V = ${fmtSig(V,6)} m³`,`ΔV = ${fmtSig(dV,4)} m³`],

def({id:'visc-conv',cat:'oilpipe',title:'Viscosity conversion (cSt, SSU, cP)',kw:'viscosity conversion centistokes ssu saybolt centipoise kinematic dynamic',
  inputs:[num('nu','Kinematic viscosity',{dim:'kvisc',unit:'cSt',imp:'cSt',def:50,min:0}),num('sg','Specific gravity (water = 1)',{def:0.88,min:0.3,max:2})],
  compute(v){const c=v.nu*1e6;need(c>=1.8,'The Saybolt conversion applies from about 1.8 cSt upward.','nu');const ssu=4.6324*c+(1.0+0.03264*c)/((3930.2+262.7*c+23.97*c*c+1.646*c*c*c)*1e-5);
    return{results:[R('ssu','Saybolt Universal seconds at 100 °F',ssu,{sig:4,unitText:'SUS',primary:true}),R('cp','Dynamic viscosity',c*v.sg,{sig:4,unitText:'cP (mPa·s)'}),R('pas','Dynamic viscosity',c*v.sg/1000,{sig:4,unitText:'Pa·s'})],
      formula:'SUS = 4.6324ν + (1 + 0.03264ν) ÷ ((3930.2 + 262.7ν + 23.97ν² + 1.646ν³) × 10⁻⁵) · μ (cP) = ν (cSt) × SG',steps:[`SUS = ${fmtSig(ssu,5)} for ν = ${fmtSig(c)} cSt`],refs:['ASTM D2161 — conversion of kinematic viscosity to Saybolt Universal viscosity (100 °F equation)']}}});

def({id:'npsh',cat:'waterpipe',title:'NPSH available',kw:'npsh available net positive suction head cavitation pump suction lift vapour pressure',disclaimer:ENG,
  inputs:[num('Ps','Pressure on the liquid surface (absolute)',{dim:'pressure',unit:'kPa',imp:'psi',def:101.325,min:0,help:'Open tank at sea level: 101.3 kPa (14.7 psia); lower at altitude.'}),num('T','Liquid temperature (water)',{dim:'temp',unit:'C',imp:'F',def:20}),num('hs','Static height of liquid above the pump centreline',{dim:'length',unit:'m',imp:'ft',def:2,help:'Negative for a suction lift (liquid below the pump).'}),num('hf','Suction pipe friction loss',{dim:'length',unit:'m',imp:'ft',def:1,min:0}),num('req','NPSH required by the pump (optional)',{dim:'length',unit:'m',imp:'ft',opt:true,min:0})],
  compute(v){const tc=v.T-273.15,rho=waterAt(tc,1),pv=waterAt(tc,2)*1000,N=(v.Ps-pv)/(rho*GRAV)+v.hs-v.hf;const out=[R('N','NPSH available',N,{dim:'length',primary:true,show:['m','ft']}),R('pv','Vapour pressure',pv,{dim:'pressure',show:['kPa','psi']})];

    return{results:out,formula:'NPSHa = (P_surface − P_vapour) ÷ (ρ g) + h_static − h_friction',steps:[`(${fmtSig(v.Ps/1000)} − ${fmtSig(pv/1000,4)}) kPa ÷ (${fmtSig(rho,5)} × 9.807) = ${fmtSig((v.Ps-pv)/(rho*GRAV),4)} m`,`+ ${fmtSig(v.hs)} − ${fmtSig(v.hf)} = ${fmtSig(N,4)} m`],
      assumptions:['Water; vapour pressure and density interpolated from IAPWS values.'],refs:['ANSI/HI 9.6.1 — Rotodynamic pumps, guideline for NPSH margin (margin ratios about 1.1 to 2.5)','Water properties: IAPWS-95']}}});
def({id:'tank-drain',cat:'waterpipe',title:'Tank drain time',kw:'tank drain time orifice torricelli emptying outlet discharge',disclaimer:ENG,
  inputs:[num('Dt','Tank diameter (vertical cylinder)',{dim:'length',unit:'m',imp:'ft',def:2,min:0}),num('H','Water depth above the outlet',{dim:'length',unit:'m',imp:'ft',def:3,min:0}),num('d','Outlet diameter',{dim:'length',unit:'mm',imp:'in',def:50,min:0}),num('Cd','Discharge coefficient',{def:0.61,min:0.3,max:1,help:'Sharp-edged hole 0.61 · short pipe 0.82 · well-rounded nozzle 0.98.'})],
  compute(v){const At=Math.PI*v.Dt**2/4,a=Math.PI*v.d**2/4,t=At/(v.Cd*a)*Math.sqrt(2*v.H/GRAV),Q0=v.Cd*a*Math.sqrt(2*GRAV*v.H);

      formula:'t = (A_tank ÷ (Cd × a)) × √(2H ÷ g) · Q₀ = Cd a √(2gH)',steps:[`A_tank = ${fmtSig(At,4)} m², a = ${fmtSig(a*1e4,4)} cm²`,`t = ${fmtSig(t,5)} s`],assumptions:['Free discharge to atmosphere, no outlet pipe friction, open tank.'],refs:['Torricelli’s law with discharge coefficient (standard fluid mechanics)']}}});
const THRUST_F=[['90','90° bend'],['45','45° bend'],['22.5','22½° bend'],['11.25','11¼° bend'],['dead','Dead end, tee branch or closed valve']];
def({id:'thrust',cat:'waterpipe',title:'Thrust block size',kw:'thrust block restraint bend tee dead end soil bearing water main force',disclaimer:ENG,

const MANN_N=[['0.013','Finished concrete (n = 0.013)'],['0.009','PVC or HDPE (n = 0.009)'],['0.024','Corrugated metal (n = 0.024)'],['0.022','Earth, clean (n = 0.022)'],['0.030','Grassed channel (n = 0.030)'],['0.035','Natural stream, some weeds (n = 0.035)']];
def({id:'manning',cat:'waterpipe',title:'Open channel flow (Manning)',kw:'manning open channel flow ditch canal trapezoidal rectangular normal depth froude',disclaimer:ENG,
  inputs:[num('b','Bottom width',{dim:'length',unit:'m',imp:'ft',def:2,min:0}),num('y','Flow depth',{dim:'length',unit:'m',imp:'ft',def:1,min:0}),num('z','Side slope (horizontal : 1 vertical)',{def:0,min:0,max:10,help:'0 for a rectangular channel; 1.5 or 2 for typical earth ditches.'}),num('S','Bed slope (%)',{def:0.1,min:0.0001,max:50}),sel('n','Lining',MANN_N)],
  compute(v){const {b,y,z}=v,A=(b+z*y)*y,P=b+2*y*Math.sqrt(1+z*z),Rh=A/P,T=b+2*z*y,n=+v.n,vel=Math.pow(Rh,2/3)*Math.sqrt(v.S/100)/n,Q=vel*A,Fr=vel/Math.sqrt(GRAV*A/T);

      formula:'Q = (1/n) A R^(2/3) S^(1/2) · R = A ÷ P · Fr = v ÷ √(g A/T)',steps:[`A = ${fmtSig(A,4)} m², P = ${fmtSig(P,4)} m, R = ${fmtSig(Rh,4)} m`,`v = ${fmtSig(vel,4)} m/s, Q = ${fmtSig(Q,4)} m³/s`],assumptions:['Uniform, steady flow (normal depth).'],refs:['Manning equation (SI form); roughness values from Chow, Open-Channel Hydraulics']}}});

  compute(v){const t1=v.T1-273.15,t2=v.T2-273.15;need(t2>t1,'The maximum temperature must be above the fill temperature.','T2');need(v.P2>v.P1,'Maximum pressure must be above the fill pressure.','P2');

def({id:'hv-oa',cat:'hvac',title:'Outdoor air ventilation (ASHRAE 62.1)',kw:'ventilation outdoor air ashrae 62.1 people area rate cfm per person breathing zone',disclaimer:ENG,
  inputs:[num('Pz','Number of people',{def:20,min:0}),num('Az','Floor area',{dim:'area',unit:'m2',imp:'ft2',def:100,min:0}),num('Rp','People rate (L/s per person)',{def:2.5,min:0,help:'Office 2.5 · classroom (age 9+) 5.0 · retail 3.8 · restaurant dining 3.8 (from 62.1 Table 6-1; 1 L/s = 2.12 cfm).'}),num('Ra','Area rate (L/s per m²)',{def:0.3,min:0,help:'Office 0.3 · classroom 0.6 · retail 0.6 · restaurant dining 0.9.'}),num('Ez','Zone air distribution effectiveness',{def:1,min:0.5,max:1.2,help:'1.0 ceiling supply of cool air · 0.8 ceiling supply of warm air with ceiling return.'})],
  compute(v){const Vbz=v.Rp*v.Pz+v.Ra*v.Az,Voz=Vbz/v.Ez;
    return{results:[R('Voz','Zone outdoor airflow',Voz/1000,{dim:'flow',primary:true,show:['L/s','cfm','m3/h']}),R('Vbz','Breathing-zone outdoor airflow',Vbz/1000,{dim:'flow',show:['L/s','cfm']}),R('pp','Per person',Voz/Math.max(v.Pz,1),{sig:3,unitText:'L/s per person'})],
      formula:'V_bz = R_p P_z + R_a A_z · V_oz = V_bz ÷ E_z',steps:[`${v.Rp} × ${v.Pz} + ${v.Ra} × ${fmtSig(v.Az,5)} = ${fmtSig(Vbz,5)} L/s`,`÷ ${v.Ez} = ${fmtSig(Voz,5)} L/s`],
      assumptions:['Single-zone calculation. Multi-zone systems need the system ventilation efficiency step of 62.1.'],refs:['ANSI/ASHRAE Standard 62.1-2022, Ventilation Rate Procedure §6.2.2']}}});
def({id:'hv-condensate',cat:'hvac',title:'Cooling coil condensate',kw:'condensate drain cooling coil water removal latent dehumidification',disclaimer:ENG,
  inputs:[num('Q','Airflow through the coil',{dim:'flow',unit:'L/s',imp:'cfm',def:1000,min:0}),num('dW','Moisture removed (g water per kg dry air)',{def:3,min:0,help:'Entering minus leaving humidity ratio, from the Psychrometrics calculator.'})],
  compute(v){const m=1.2*v.Q*v.dW/1000;
    return{results:[R('lh','Condensate',m*3600,{sig:4,unitText:'L/h',primary:true}),R('gh','Condensate',m*3600/3.785411784,{sig:4,unitText:'US gal/h'}),R('ld','Per day of operation',m*86400,{sig:4,unitText:'L/day'}),R('lat','Latent load removed',m*2450,{dim:'power',show:['kW','BTU/h']})],
      formula:'ṁ = ρ_air × Q × ΔW · 1 kg of water ≈ 1 L',steps:[`1.2 × ${fmtSig(v.Q,4)} m³/s × ${fmtSig(v.dW/1000)} = ${fmtSig(m*1000,4)} g/s`],assumptions:['Standard air density 1.2 kg/m³; latent heat 2,450 kJ/kg.'],refs:['ASHRAE Handbook — Fundamentals (2025), psychrometrics and coil processes']}}});
def({id:'hv-ductloss',cat:'hvac',title:'Duct system pressure loss',kw:'duct pressure loss static pressure external fittings velocity pressure fan esp',disclaimer:ENG,
  inputs:[num('fr','Friction rate (Pa per m)',{def:1,min:0,help:'From the Duct sizing calculator; 0.8–1.0 Pa/m is common.'}),num('L','Length of the longest run',{dim:'length',unit:'m',imp:'ft',def:40,min:0}),num('vel','Velocity in the run',{dim:'speed',unit:'m/s',imp:'ft/s',def:5,min:0}),num('C','Sum of fitting loss coefficients ΣC',{def:3,min:0,help:'Typical: smooth 90° elbow 0.2–0.3 · branch takeoff 0.5–1 · supply diffuser outlet 1.0. Use ASHRAE Duct Fitting Database values.'}),num('eq','Equipment and accessory losses',{dim:'pressure',unit:'Pa',imp:'inH2O',def:150,min:0,help:'Filters, coils, dampers, grilles from manufacturer data.'})],
  compute(v){const pv=0.5*1.204*v.vel**2,f=v.fr*v.L,ft=v.C*pv,tot=f+ft+v.eq;
    return{results:[R('tot','Total pressure loss',tot,{dim:'pressure',primary:true,show:['Pa','inH2O']}),R('f','Straight duct friction',f,{dim:'pressure',show:['Pa','inH2O']}),R('ft','Fittings',ft,{dim:'pressure',show:['Pa','inH2O']}),R('pv','Velocity pressure',pv,{dim:'pressure',show:['Pa','inH2O']})],
      formula:'Δp = friction rate × L + ΣC × p_v + equipment · p_v = ½ ρ v²',steps:[`p_v = 0.5 × 1.204 × ${fmtSig(v.vel)}² = ${fmtSig(pv,4)} Pa`,`${fmtSig(f,4)} + ${fmtSig(ft,4)} + ${fmtSig(v.eq)} = ${fmtSig(tot,4)} Pa`],assumptions:['Standard air (1.204 kg/m³). Size the fan for this loss at the design airflow.'],refs:['ASHRAE Handbook — Fundamentals (2025), Duct Design: fitting losses as C × velocity pressure']}}});

/* ---------------- FIRE PROTECTION ---------------- */
const HOSE_C=[['15.5','1¾ in hose (C = 15.5)'],['24','1½ in hose (C = 24)'],['8','2 in hose (C = 8)'],['2','2½ in hose (C = 2)'],['0.8','3 in hose, 2½ in couplings (C = 0.8)'],['0.2','4 in supply hose (C = 0.2)'],['0.08','5 in supply hose (C = 0.08)']];
def({id:'fp-hose',cat:'fire',title:'Fire hose friction loss and pump pressure',kw:'fire hose friction loss pump discharge pressure nozzle pressure fireground hydraulics',disclaimer:ENG,
  inputs:[sel('C','Hose',HOSE_C),num('Q','Flow',{dim:'flow',unit:'gpm',imp:'gpm',def:150,min:0}),num('L','Hose length',{dim:'length',unit:'ft',imp:'ft',def:200,min:0}),num('NP','Nozzle pressure',{dim:'pressure',unit:'psi',imp:'psi',def:50,min:0,help:'Smooth-bore handline 50 psi · master stream 80 psi · most fog nozzles 100 psi (some 50 or 75).'}),num('el','Elevation of the nozzle above the pump',{dim:'length',unit:'ft',imp:'ft',def:0}),num('ap','Appliance losses',{dim:'pressure',unit:'psi',imp:'psi',def:0,min:0,help:'Wye or manifold about 10 psi; master stream device about 25 psi.'})],
  compute(v){const q=v.Q/6.30901964e-5,l=v.L/0.3048,FL=+v.C*(q/100)**2*(l/100),el=v.el/0.3048*0.434,pdp=v.NP/6894.757293168+FL+el+v.ap/6894.757293168;
    return{results:[R('pdp','Pump discharge pressure',pdp*6894.757293168,{dim:'pressure',primary:true,show:['psi','bar']}),R('FL','Hose friction loss',FL*6894.757293168,{dim:'pressure',show:['psi','bar']}),R('ep','Elevation pressure',el*6894.757293168,{dim:'pressure',show:['psi','bar']})],
      formula:'FL = C × (Q ÷ 100)² × (L ÷ 100) · PDP = NP + FL + 0.434 × elevation + appliance losses',steps:[`FL = ${v.C} × (${fmtSig(q)} ÷ 100)² × (${fmtSig(l)} ÷ 100) = ${fmtSig(FL,4)} psi`,`PDP = ${fmtSig(v.NP/6894.757293168)} + ${fmtSig(FL,4)} + ${fmtSig(el,3)} + ${fmtSig(v.ap/6894.757293168)} = ${fmtSig(pdp,4)} psi`],
      assumptions:['Coefficients are for typical modern hose; actual loss varies by brand and age, so flow-test your hose.'],refs:['IFSTA Pumping and Aerial Apparatus Driver/Operator Handbook — friction loss coefficients','Elevation 0.434 psi per foot of water']}}});
def({id:'fp-fireflow',cat:'fire',title:'Needed fire flow (ISO method)',kw:'needed fire flow iso building construction class gpm water supply municipal',disclaimer:ENG,
  inputs:[sel('C','Construction class',[['1.5','Wood frame (ISO class 1, C = 1.5)'],['1.0','Joisted masonry / ordinary (class 2, C = 1.0)'],['0.8','Non-combustible (class 3–4, C = 0.8)'],['0.6','Fire-resistive (class 5–6, C = 0.6)']]),num('A','Effective floor area',{dim:'area',unit:'ft2',imp:'ft2',def:10000,min:0,help:'Largest floor plus a share of other floors, per the ISO guide.'})],
  compute(v){const a=v.A/0.09290304,F=18*(+v.C)*Math.sqrt(a),Fr=Math.max(500,Math.round(F/250)*250);
    return{results:[R('Fr','Construction fire flow (rounded)',Fr*6.30901964e-5,{dim:'flow',primary:true,show:['gpm','L/s']}),R('F','Calculated',F*6.30901964e-5,{dim:'flow',show:['gpm','L/s']})],
      formula:'C_i = 18 × F × √A_i (gpm, A in ft²), rounded to the nearest 250 gpm, minimum 500 gpm',steps:[`18 × ${v.C} × √${fmtSig(a,6)} = ${fmtSig(F,5)} gpm → ${Fr} gpm`],
      assumptions:['Construction factor only. The full ISO method then adjusts for occupancy, exposure and communication, and IFC Appendix B (or the local water authority) may set the governing value.'],refs:['ISO (Insurance Services Office) Guide for Determination of Needed Fire Flow']}}});
def({id:'fp-standpipe',cat:'fire',title:'Standpipe pressure at the base',kw:'standpipe pressure class i 100 psi elevation friction nfpa 14 riser',disclaimer:ENG,
  inputs:[num('Po','Residual pressure needed at the most remote outlet',{dim:'pressure',unit:'psi',imp:'psi',def:100,min:0,help:'NFPA 14: 100 psi at the hydraulically most remote 2½ in outlet (Class I and III).'}),num('h','Height of that outlet above the supply',{dim:'length',unit:'ft',imp:'ft',def:75,min:0}),num('fl','Friction loss in the standpipe and fittings',{dim:'pressure',unit:'psi',imp:'psi',def:15,min:0})],
  compute(v){const el=v.h/0.3048*0.433*6894.757293168,P=v.Po+el+v.fl;
    return{results:[R('P','Pressure needed at the base or pump discharge',P,{dim:'pressure',primary:true,show:['psi','bar']}),R('el','Elevation loss',el,{dim:'pressure',show:['psi','bar']})],formula:'P_base = P_outlet + 0.433 × h + friction',steps:[`${fmtSig(v.Po/6894.757293168)} + 0.433 × ${fmtSig(v.h/0.3048)} + ${fmtSig(v.fl/6894.757293168)} = ${fmtSig(P/6894.757293168,4)} psi`],
      assumptions:['Flow demand (for example 500 gpm for the first standpipe) is set by NFPA 14 and the building code.'],refs:['NFPA 14 (2024) — Installation of Standpipe and Hose Systems, minimum residual pressure']}}});

const METAL_D=[['24k','24k gold',19.32],['22k','22k yellow gold',17.8],['18ky','18k yellow gold',15.6],['18kw','18k white gold (palladium)',15.9],['14k','14k yellow gold',13.1],['10k','10k yellow gold',11.6],['ag925','Sterling silver 925',10.36],['pt950','Platinum 950',20.7],['pd950','Palladium 950',12.0],['brass','Brass',8.5]];
def({id:'jw-metal',cat:'jewelry',title:'Metal weight from volume',kw:'metal weight volume density gold silver platinum grams dwt cad model',
  inputs:[num('V','Volume',{dim:'volume',unit:'cm3',imp:'in3',def:1,min:0,help:'From the CAD model or by water displacement (1 mL = 1 cm³).'}),sel('m','Metal',METAL_D.map(x=>[x[0],`${x[1]} (${x[2]} g/cm³)`]))],
  compute(v){const d=METAL_D.find(x=>x[0]===v.m)[2],g=v.V*1e6*d;
    return{results:[R('g','Weight',g,{sig:4,unitText:'g',primary:true}),R('dwt','Pennyweight',g/1.55517384,{sig:4,unitText:'dwt'}),R('ozt','Troy ounces',g/31.1034768,{sig:4,unitText:'ozt'})],
      formula:'weight = volume × density',steps:[`${fmtSig(v.V*1e6)} cm³ × ${d} g/cm³ = ${fmtSig(g,4)} g`],assumptions:['Typical alloy densities; exact values depend on the alloy recipe.'],refs:['Typical alloy densities (casting-grain suppliers’ data); 1 dwt = 1.55517384 g, 1 ozt = 31.1034768 g']}}});
def({id:'jw-plating',cat:'jewelry',title:'Plating thickness and metal used',kw:'gold plating rhodium vermeil microns thickness mg metal used electroplating',
  inputs:[num('A','Surface area to plate',{dim:'area',unit:'cm2',imp:'in2',def:10,min:0}),num('t','Thickness (µm)',{def:2.5,min:0,help:'Gold flash under 0.175 µm · gold plate about 0.5 µm · heavy gold plate 2.5 µm · vermeil (US FTC) at least 2.5 µm.'}),sel('m','Plating metal',[['19.3','Gold (19.3 g/cm³)'],['12.4','Rhodium (12.4 g/cm³)'],['10.5','Silver (10.5 g/cm³)'],['8.9','Nickel (8.9 g/cm³)']]),num('price','Metal price per gram (optional)',{money:true,opt:true,min:0})],
  compute(v){const mg=v.A*1e4*v.t*1e-4*(+v.m)*1000;const out=[R('mg','Metal deposited',mg,{sig:4,unitText:'mg',primary:true})];if(Number.isFinite(v.price))out.push(R('c','Metal cost',mg/1000*v.price,{kind:'money'}));
    return{results:out,formula:'mass = area × thickness × density',steps:[`${fmtSig(v.A*1e4)} cm² × ${v.t} µm × ${v.m} g/cm³ = ${fmtSig(mg,4)} mg`],assumptions:['Metal on the part only; bath losses and drag-out are extra.'],refs:['US FTC Jewelry Guides 16 CFR 23.4 (gold plate, vermeil thickness terms)']}}});
def({id:'jw-scrap',cat:'jewelry',title:'Scrap gold value (several pieces)',kw:'scrap gold value buy melt karat grams payout pieces mixed',
  inputs:[area_('items','Pieces: weight in grams and karat (or fineness), one per line','5.2 14k\n3.1 18k\n8.0 22k',{help:'For example “5.2 14k” or “3.1 750”.'}),num('price','Gold price per gram (24k, fine)',{money:true,def:100,min:0}),num('pay','Payout (% of melt value)',{def:85,min:0,max:100})],
  compute(v){const lines=String(v.items||'').split(/\n/).map(s=>s.trim()).filter(Boolean);need(lines.length,'Enter at least one piece.','items');let fine=0,tot=0;const st=[];
    for(const ln of lines){const m=ln.match(/^([\d.]+)\s*(?:g\b)?\s+([\d.]+)\s*(k|kt|karat)?$/i);need(m,`Check this line: "${ln}". Use weight then karat, e.g. 5.2 14k.`,'items');const w=+m[1],x=+m[2],pur=m[3]||x<=24?x/24:x/1000;need(pur>0&&pur<=1,`Check the purity in "${ln}".`,'items');fine+=w*pur;tot+=w;st.push(`${w} g × ${fmtSig(pur*100,4)} % = ${fmtSig(w*pur,4)} g fine`)}
    const melt=fine*v.price;
    return{results:[R('pay','Payout',melt*v.pay/100,{kind:'money',primary:true}),R('melt','Melt value',melt,{kind:'money'}),R('fine','Fine gold content',fine,{sig:4,unitText:'g'}),R('tot','Total weight',tot,{sig:4,unitText:'g'})],
      formula:'fine gold = Σ weight × karat ÷ 24 · value = fine gold × price',steps:st,assumptions:['Nominal purity; real items are often slightly below nominal, and stones or solder add weight.'],refs:['Karat purity k/24 (ISO 9202:2019 fineness)']}}});

def({id:'st-counter',cat:'stone',title:'Countertop slabs and cut-outs',kw:'countertop slab granite quartz sink cutout area slabs needed kitchen',disclaimer:ENG,
  inputs:[area_('sec','Counter sections: length and depth, one per line','300 65\n180 65',{help:'In the units chosen below, e.g. “300 65”.'}),sel('u','Units',[['cm','cm'],['in','inches']]),num('nc','Number of cut-outs',{def:1,min:0,int:true}),text('cs','Cut-out size (length depth)','80 50'),text('slab','Slab size (length depth)','320 160'),num('waste','Waste (%)',{def:20,min:0,max:60,help:'15–25 % is typical, more for veined stone that must be book-matched.'})],
  compute(v){const f=v.u==='cm'?0.01:0.0254,pair=(s,k)=>{const p=String(s||'').trim().split(/[\s×x*,]+/).map(Number);need(p.length===2&&p.every(x=>x>0),`Enter two numbers in "${s}".`,k);return p[0]*p[1]*f*f};
    const lines=String(v.sec||'').split(/\n/).map(s=>s.trim()).filter(Boolean);need(lines.length,'Enter at least one counter section.','sec');const A=lines.reduce((s,l)=>s+pair(l,'sec'),0),Ac=v.nc*pair(v.cs,'cs'),As=pair(v.slab,'slab'),net=A-Ac,n=Math.ceil(A*(1+v.waste/100)/As);
    return{results:[R('n','Slabs needed',n,{kind:'int',primary:true}),R('A','Counter area (to cut from slabs)',A,{dim:'area',show:['m2','ft2']}),R('net','Finished area (less cut-outs)',net,{dim:'area',show:['m2','ft2']}),R('As','Slab area',As,{dim:'area',show:['m2','ft2']})],
      formula:'slabs = ⌈counter area × (1 + waste) ÷ slab area⌉',steps:[`Counter ${fmtSig(A,4)} m², slab ${fmtSig(As,4)} m² → ${n} slab${n>1?'s':''}`],assumptions:['Cut-outs still use slab material, so slabs are counted on the full counter area.'],refs:['Fabricator layout practice; common quartz slab 320 × 160 cm, granite 300 × 180 cm (varies by supplier)']}}});
def({id:'st-agg-conv',cat:'stone',title:'Aggregate tonnes, m³ and yd³',kw:'aggregate conversion tonnes cubic yards cubic metres tons gravel sand density',
  inputs:[num('q','Quantity',{def:10,min:0}),sel('qu','Quantity units',[['t','tonnes'],['ton','US tons'],['m3','m³'],['yd3','yd³']]),sel('mat','Material',AGG.filter(x=>Number.isFinite(x[2])).map(x=>[x[0],x[1]]))],
  compute(v){const d=AGG.find(x=>x[0]===v.mat)[2],kg={t:1000,ton:907.18474}[v.qu],m3=kg?v.q*kg/d:v.q*({m3:1,yd3:0.764554857984}[v.qu]),t=m3*d/1000;
    return{results:[R('t','Tonnes',t,{sig:4,primary:true,unitText:'t'}),R('ton','US tons',t*1000/907.18474,{sig:4,unitText:'US ton'}),R('m3','Cubic metres',m3,{sig:4,unitText:'m³'}),R('yd3','Cubic yards',m3/0.764554857984,{sig:4,unitText:'yd³'})],
      formula:'mass = volume × bulk density',steps:[`${fmtSig(m3,5)} m³ × ${d} kg/m³ = ${fmtSig(t,5)} t`],assumptions:['Loose bulk density; compacted material is denser and wet material heavier.'],refs:['Typical aggregate bulk densities (supplier data sheets)']}}});

function runGolden(engine){
  const {runCalc,fromSI,CALCS}=engine; const rows=[];
  for(const g of GOLDEN){
    let ok=true, detail=[];
    try{
      const raw={...g.in}; const out=runCalc(g.calc,raw);
      for(const [k,exp] of Object.entries(g.expect)){
        const r=out.results.find(x=>x.key===k); if(!r){ok=false;detail.push(`${k}: missing`);continue}
        if(typeof exp==='string'){ const pass=String(r.value).includes(exp); if(!pass)ok=false; detail.push(`${k}: ${r.value} ${pass?'✓':'≠ '+exp}`); continue }
        const [ev,unit,tol=1e-9]=exp; let got=unit?fromSI(r.value,r.dim,unit):r.value;
        if(r.kind==='money') got=engine.cents(got);   // money compared at cent precision
        const pass=Math.abs(got-ev)<=Math.max(Math.abs(ev)*tol,1e-9);
        if(!pass)ok=false; detail.push(`${k}: ${+got.toPrecision(8)}${unit?' '+unit:''} ${pass?'✓':'≠ '+ev}`);
      }
    }catch(e){ ok=false; detail.push('Error: '+e.message) }
    const c=CALCS.find(x=>x.id===g.calc);
    rows.push({calc:g.calc,title:c?c.title:g.calc,version:c?c.version:'?',ok,detail:detail.join(' · '),ref:g.ref});
  }
  return rows;
}
if(typeof module!=='undefined') module.exports={GOLDEN,runGolden};

function fmtVal(r){
  const sig=r.sig||S.settings.sig;
  if(typeof r.value==='string') return {main:esc(r.value)};
  if(r.kind==='money') return {main:fmtMoney(r.value,S.settings.currency)};
  if(r.kind==='int') return {main:fmtInt(r.value)};

function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('load'));document.head.appendChild(s)})}
async function authInit(){
  if(S.user&&!S.user.id){S.user=null;save()}                       // retire the old demo sign-in
  const a=CFG.auth;if(a.provider!=='supabase'||!a.url||!a.anonKey){AUTH.ready=true;return}
  try{
    if(!window.supabase)await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js');
    AUTH.client=window.supabase.createClient(a.url,a.anonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
    AUTH.available=true;
    const {data}=await AUTH.client.auth.getSession();await setUser(data&&data.session&&data.session.user);
    AUTH.client.auth.onAuthStateChange((ev,sess)=>{setUser(sess&&sess.user)});
  }catch(e){AUTH.available=false}
  AUTH.ready=true;renderSide();if(['history','settings','pricing'].includes(view.name))rerender();
}

  const before=S.user&&S.user.id;

  else if(before){S.user=null;save()}
  renderSide();if(['history','settings'].includes(view.name))rerender();
}
const SYNC_TABLE='calchub_user_data';
async function syncPull(){
  if(!AUTH.client||!S.user||!S.user.id)return;
  try{const {data,error}=await AUTH.client.from(SYNC_TABLE).select('saves,sheet,sheet_meta,favs').eq('user_id',S.user.id).maybeSingle();if(error)throw error;
    if(data){const ids=new Set(S.saves.map(s=>s.id));S.saves=[...S.saves,...(data.saves||[]).filter(s=>!ids.has(s.id))];

      S.favs=[...new Set([...(S.favs||[]),...(data.favs||[])])];save()}

/* ---------- licence keys (checked by your licence service; see license-worker.js) ---------- */
async function licCall(action,body){
  if(!CFG.license.endpoint)throw new Error('Licence checking is not set up in this copy yet.');
  const r=await fetch(CFG.license.endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...body})});
  const d=await r.json().catch(()=>({}));if(!r.ok&&!('valid' in d))throw new Error(d.error||'The licence service did not answer. Try again.');return d;
}
async function activateLicense(key){
  key=String(key||'').trim();if(!/^[A-Za-z0-9-]{8,80}$/.test(key))throw new Error('That does not look like a licence key. Copy it from your receipt email.');
  const d=await licCall('activate',{key,instance:'CalcHub Pro · '+(navigator.platform||'device')});
  if(!d.valid)throw new Error(d.error||'This key is not valid or has reached its device limit.');
  S.license={key,plan:d.plan==='business'?'business':'pro',expires:d.expires||null,instanceId:d.instanceId||null,checkedAt:Date.now(),label:d.label||''};save();
}
async function revalidateLicense(){
  const L=S.license;if(!L||!CFG.license.endpoint||!navigator.onLine)return;if(Date.now()-(L.checkedAt||0)<7*864e5)return;
  try{const d=await licCall('validate',{key:L.key,instanceId:L.instanceId});if(d.valid){S.license={...L,plan:d.plan==='business'?'business':'pro',expires:d.expires||null,checkedAt:Date.now()}}else if(d.valid===false){S.license=null;toast('Your Pro licence is no longer active.')}save();renderSide()}catch(e){/* offline grace */}
}
async function removeLicense(){const L=S.license;try{if(L&&CFG.license.endpoint)await licCall('deactivate',{key:L.key,instanceId:L.instanceId})}catch(e){}S.license=null;save();closeModal();renderSide();rerender();toast('Licence removed from this device')}

      if(i.def!==undefined){let d=i.def;if(u!==i.unit)d=+fmtSig(fromSI(toSI(i.def,i.dim,i.unit),i.dim,u),5).replace(/,/g,'');f.vals[i.key]=String(d)}else f.vals[i.key]='';}

function renderResult(){

  document.querySelectorAll('.fld').forEach(f=>f.classList.remove('bad'));document.querySelectorAll('.fld .err').forEach(e=>e.textContent='');

   ${refs.length?`<div class="blk"><h3>Standards & sources</h3><ul class="notes">${refs.map(a=>`<li>${esc(edRef(a))}</li>`).join('')}</ul>${refs.some(r=>editionsOf(r).length)?`<p class="ednote">${esc(EDITION_NOTE)}</p>`:''}</div>`:''}
   ${c.disclaimer?`<div class="disc">Informational only. Verify with a licensed professional, the governing code edition and local rules before use in design or construction.</div>`:''}
   <div class="acts"><button class="btn pri sm" data-act="pdf">${ico('pdf')}PDF report</button><button class="btn sm" data-act="addsheet">${ico('plus')}Add to sheet</button><button class="btn sm" data-act="save">Save</button><button class="btn sm" data-act="share">Share link</button><button class="btn sm" data-act="csv">CSV</button><button class="btn sm" data-act="copy">Copy</button><span class="sp"></span><button class="link" data-act="report" style="font-size:13px;font-weight:500;color:var(--muted)">Report a wrong result</button></div>`;
  const r={id:c.id,vals:{...form.vals},units:{...form.units},at:Date.now()};S.recent=[r,...S.recent.filter(x=>x.id!==c.id)].slice(0,12);save();updateBar();
}

function snapshot(){ // freeze the current result as plain text for the sheet / report
  const c=calc(last.calc);
  const inputs=c.inputs.map(i=>{let v=last.raw.vals[i.key];if(v===''||v===undefined)return null;if(i.type==='select')v=(i.options.find(o=>String(o[0])===String(v))||[,v])[1];
    if(i.type==='num'&&!isPlainNum(String(v).trim())){try{v=`${String(v).trim()} = ${fmtSig(numFrom(v,i.key,i.label),8)}`}catch(e){}}return [i.label,`${v}${last.raw.units[i.key]?' '+ulabel(last.raw.units[i.key]):''}`]}).filter(Boolean);
  const results=last.results.map(r=>{const f=fmtVal(r);return [r.label,plain(f.main)+(f.alt?'  (= '+plain(f.alt)+')':''),!!r.primary]});
  return {id:uid(),calc:c.id,title:c.title,cat:catOf(c.cat).name,version:c.version,at:Date.now(),inputs,results,formula:last.formula,steps:last.steps||[],assumptions:[...(last.warnings||[]).map(w=>'Warning: '+w),...(last.assumptions||[])],refs:(last.refs||refsOf(c)).map(edRef),edNote:(last.refs||refsOf(c)).some(r=>editionsOf(r).length),disclaimer:!!c.disclaimer,summary:summary()};
}
function summary(){const p=last.results.find(r=>r.primary)||last.results[0];return plain(p.label+': '+fmtVal(p).main)}

/* ---------- PDF writer: Helvetica + Courier (WinAnsi), no library, works offline ---------- */
const WIN={'€':128,'‚':130,'„':132,'…':133,'†':134,'‡':135,'‰':137,'‹':139,'‘':145,'’':146,'“':147,'”':148,'•':149,'–':150,'—':151,'™':153,'›':155};
const SUBS={'−':'-','√':'sqrt','∛':'cbrt','Σ':'sum ','π':'pi','θ':'theta','≥':'>=','≤':'<=','⌈':'ceil(','⌉':')','₀':'0','₁':'1','₂':'2','₃':'3','₄':'4','ᵢ':'i','₊':'+','ⁿ':'^n','⁴':'^4','⁻':'-','⁺':'+','′':"'",'″':'"','Ω':'ohm','→':'->','⇄':'<->','δ':'delta','ρ':'rho','Δ':'delta ','≈':'~','µ':'u','μ':'mu','ω':'omega','α':'alpha','σ':'sigma','τ':'tau','η':'eta','ν':'nu','ε':'eps','⅔':'2/3','∞':'inf','×':'x','·':'·','≠':'!=','⁄':'/','◆':'*','◇':'*','★':'*','☆':'*','✓':'ok','✕':'x','⌖':'+','≥':'>=','ε':'eps'};
function pdfStr(s){let o='';for(const ch of String(s)){if(WIN[ch]!==undefined){o+=String.fromCharCode(WIN[ch]);continue}const m=SUBS[ch];if(m!==undefined){o+=m;continue}const c=ch.charCodeAt(0);o+=c<256?ch:'?'}return o}
const pdfEsc=s=>pdfStr(s).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');
function makePDF(doc){ // doc: {title, meta:[[k,v]], sections:[snapshot]}
  const W=612,H=792,M=54,BOT=60,pages=[];let ops=[],y=0;
  const C={ink:'0.08 0.09 0.11',muted:'0.36 0.39 0.42',accent:'0.05 0.36 0.55',line:'0.82 0.84 0.81',band:'0.93 0.94 0.92',warn:'0.48 0.32 0.0',warnbg:'1 0.95 0.84'};
  const cw=(f,size)=>size*(f==='F3'?0.6:f==='F2'?0.56:0.52);
  const wrap=(t,f,size,width)=>{const max=Math.max(8,Math.floor(width/cw(f,size)));const out=[];for(const para of String(t).split('\n')){let line='';for(const w of para.split(' ')){if((line+' '+w).trim().length>max){if(line)out.push(line);let ww=w;while(ww.length>max){out.push(ww.slice(0,max));ww=ww.slice(max)}line=ww}else line=(line?line+' ':'')+w}out.push(line)}return out};
  const newPage=()=>{if(ops.length)pages.push(ops);ops=[];y=H-M};
  const need=h=>{if(y-h<BOT)newPage()};
  const text=(t,x,f,size,color)=>ops.push(`BT ${color||C.ink} rg /${f} ${size} Tf ${x.toFixed(1)} ${y.toFixed(1)} Td (${pdfEsc(t)}) Tj ET`);
  const para=(t,{f='F1',size=10,color,x=M,width=W-2*M,lead=1.38,gap=0}={})=>{for(const ln of wrap(t,f,size,width)){need(size*lead);y-=size*lead;text(ln,x,f,size,color)}y-=gap};
  const rule=(color=C.line,wdt=0.6)=>ops.push(`${color} RG ${wdt} w ${M} ${y.toFixed(1)} m ${W-M} ${y.toFixed(1)} l S`);
  const rect=(x,yy,w,h,color)=>ops.push(`${color} rg ${x.toFixed(1)} ${yy.toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)} re f`);
  const head=t=>{need(30);y-=18;text(t.toUpperCase(),M,'F2',8.5,C.accent);y-=5;rule()};
  const table=(rows)=>{const lw=(W-2*M)*0.48,vx=M+lw+10,vw=W-M-vx;for(const [k,v,b] of rows){const kl=wrap(k,'F1',9.5,lw-6),vl=wrap(v,b?'F4':'F3',9.5,vw);const n=Math.max(kl.length,vl.length),h=n*13+5;need(h);const top=y;for(let j=0;j<n;j++){y=top-13*(j+1);if(kl[j])text(kl[j],M,b?'F2':'F1',9.5,b?C.ink:C.muted);if(vl[j])text(vl[j],vx,b?'F4':'F3',9.5)}y=top-h;rule(C.line,0.4)}};
  newPage();
  // document header
  rect(0,H-58,W,58,C.ink);rect(M-4,H-52,46,46,'1 1 1');ops.push(`q 42 0 0 42 ${M-2} ${H-50} cm /Im1 Do Q`);
  y=H-26;text('CalcHub Pro',M+54,'F2',14,'1 1 1');y=H-42;text('Best Quality First Inc.  ·  Quality Service Forever',M+54,'F1',9,'0.8 0.82 0.85');
  y=H-34;text('Calculation report',W-M-112,'F1',10.5,'0.8 0.82 0.85');y=H-M-34;
  para(doc.title,{f:'F2',size:20,lead:1.2,gap:6});
  const meta=doc.meta.filter(m=>m[1]);if(meta.length){for(const [k,v] of meta){need(14);y-=14;text(k,M,'F1',9.5,C.muted);text(v,M+110,'F1',9.5)}y-=6}
  rule(C.ink,1.2);
  doc.sections.forEach((s,k)=>{
    need(70);y-=26;{const hc=pdfHue(s.cat);if(hc)rect(M-12,y-18,4,32,hc)}text(`${doc.sections.length>1?(k+1)+'.  ':''}${s.title}`,M,'F2',14.5);y-=14;text(`${s.cat}  ·  calculator v${s.version}  ·  ${new Date(s.at).toLocaleString()}`,M,'F1',8.5,C.muted);
    head('Inputs');table(s.inputs.map(([a,b])=>[a,b,false]));
    head('Results');table(s.results);
    head('Formula');{const lines=wrap(s.formula,'F3',9.5,W-2*M-16);const h=lines.length*13+10;need(h);rect(M,y-h,W-2*M,h,C.band);y-=4;for(const ln of lines){y-=13;text(ln,M+8,'F3',9.5)}y-=8}
    if(s.steps.length){head('Working');s.steps.forEach((st,j)=>para(`${j+1}.  ${st}`,{f:'F3',size:9,lead:1.4}))}
    if(s.assumptions.length){head('Assumptions');s.assumptions.forEach(a=>para('•  '+a,{size:9.5,color:C.muted}))}
    if(s.refs.length){head('Standards & sources');s.refs.forEach(a=>para('•  '+a,{size:9.5}));if(s.edNote)para(EDITION_NOTE,{size:8.5})}
    if(s.disclaimer){y-=8;const lines=wrap('Informational only. Verify with a licensed professional, the governing code edition and local rules before use in design or construction.','F1',9,W-2*M-16);const h=lines.length*12+10;need(h);rect(M,y-h,W-2*M,h,C.warnbg);y-=4;for(const ln of lines){y-=12;text(ln,M+8,'F1',9,C.warn)}y-=8}
    y-=10;
  });
  if(doc.sign){need(60);y-=30;rule(C.ink,0.6);y-=14;text('Prepared by: '+(doc.sign.by||'________________'),M,'F1',9.5);text('Checked by: ________________',M+260,'F1',9.5);y-=16;text('Date: '+new Date().toLocaleDateString(),M,'F1',9.5);text('Signature: ________________',M+260,'F1',9.5)}
  pages.push(ops);
  const objs=[];const add=s=>{objs.push(s);return objs.length};
  const cat=add(''),pagesId=add('');
  const logoBin=atob(LOGO_JPG);const img=add(`<< /Type /XObject /Subtype /Image /Width 160 /Height 160 /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${logoBin.length} >>\nstream\n${logoBin}\nendstream`);
  const fonts=[['F1','Helvetica'],['F2','Helvetica-Bold'],['F3','Courier'],['F4','Courier-Bold']].map(([k,b])=>[k,add(`<< /Type /Font /Subtype /Type1 /BaseFont /${b} /Encoding /WinAnsiEncoding >>`)]);
  const fontRes=fonts.map(([k,id])=>`/${k} ${id} 0 R`).join(' ');
  const info=add(`<< /Title (${pdfEsc(doc.title)}) /Producer (CalcHub Pro) /CreationDate (D:${new Date().toISOString().replace(/[-:T]/g,'').slice(0,14)}) >>`);
  const kids=[];pages.forEach((p,k)=>{const foot=`${C.line} RG 0.5 w ${M} 42 m ${W-M} 42 l S BT ${C.muted} rg /F1 8 Tf ${M} 30 Td (${pdfEsc('CalcHub Pro · Best Quality First Inc. · '+doc.title)}) Tj ET BT ${C.muted} rg /F1 8 Tf ${W-M-62} 30 Td (${pdfEsc('Page '+(k+1)+' of '+pages.length)}) Tj ET`;
    const content=p.join('\n')+'\n'+foot;const cs=add(`<< /Length ${content.length} >>\nstream\n${content}\nendstream`);
    kids.push(add(`<< /Type /Page /Parent ${pagesId} 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << ${fontRes} >> /XObject << /Im1 ${img} 0 R >> >> /Contents ${cs} 0 R >>`))});
  objs[cat-1]=`<< /Type /Catalog /Pages ${pagesId} 0 R >>`;objs[pagesId-1]=`<< /Type /Pages /Kids [${kids.map(k=>k+' 0 R').join(' ')}] /Count ${kids.length} >>`;
  let out='%PDF-1.4\n%\xE2\xE3\xCF\xD3\n';const off=[];objs.forEach((o,k)=>{off.push(out.length);out+=`${k+1} 0 obj\n${o}\nendobj\n`});
  const xref=out.length;out+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+off.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<< /Size ${objs.length+1} /Root ${cat} 0 R /Info ${info} 0 R >>\nstartxref\n${xref}\n%%EOF`;
  const bytes=new Uint8Array(out.length);for(let i=0;i<out.length;i++)bytes[i]=out.charCodeAt(i)&255;return bytes;
}
const sheetDoc=()=>({title:S.sheetMeta.title||'Calculation sheet',meta:[['Project',S.sheetMeta.project],['Reference',S.sheetMeta.ref],['Prepared by',S.sheetMeta.by],['Date',new Date().toLocaleDateString()],['Calculations',String(S.sheet.length)]],sections:S.sheet,sign:{by:S.sheetMeta.by}});
function csvFor(){const c=calc(last.calc);const rows=[['section','name','value','unit']];for(const i of c.inputs){const v=last.raw.vals[i.key];if(v!==''&&v!==undefined)rows.push(['input',i.label,v,last.raw.units[i.key]?ulabel(last.raw.units[i.key]):''])}for(const r of last.results){const f=fmtVal(r);rows.push(['result',r.label,plain(f.main),''])}rows.push(['formula',last.formula,'',''],['meta','calculator',c.id+' v'+c.version,'']);return rows.map(r=>r.map(x=>/[",\n]/.test(String(x))?'"'+String(x).replace(/"/g,'""')+'"':x).join(',')).join('\n')}
let dlApi;
const TOP_LEVEL=(()=>{try{return window.self===window.top}catch(e){return false}})();
async function offer(filename,data,fallbackText,reportDoc,reportRoute='report'){
  if(dlApi===undefined){try{dlApi=window.claude&&claude.use?await claude.use('downloads'):null}catch(e){dlApi=null}}
  let reason=dlApi?'':'no-download-permission';
  if(dlApi){try{await dlApi.save({filename,data});toast('Saved '+filename);return}
    catch(e){const c=e&&e.code;if(c==='declined'){toast('Download cancelled');return}if(c==='rate_limited'){toast('A download prompt is already open');return}reason=c||'unavailable'}}
  // Outside Claude's viewer (opened as its own page or self-hosted) a normal browser download may work.
  let tried=false;
  if(TOP_LEVEL){try{const type=/\.pdf$/i.test(filename)?'application/pdf':/\.csv$/i.test(filename)?'text/csv':'text/plain';const u=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);tried=true}catch(e){}}
  if(tried&&!window.claude){toast('Downloading '+filename);return} // standalone website / installed app: plain browser download
  if(reportDoc){window._reportRoute=reportRoute;if(reportRoute==='report')window._reportDoc=reportDoc}
  modal(`<h2 style="font-size:18px">${tried?'Saving '+esc(filename):'PDF download is blocked in this window'}</h2>
   <p style="margin:0">${tried?'Your browser should be saving the file now. If nothing appears in your downloads, use one of the options below.':'This window does not allow file downloads. Downloads work when CalcHub Pro is open inside Claude: open claude.ai (or the Claude app), go to <b>Artifacts</b>, open <b>CalcHub Pro</b>, and press <b>PDF report</b> again. You will be asked to confirm the download.'}</p>
   ${reportDoc?`<p class="muted" style="margin:0;font-size:13.5px">Or open the printable report: it shows the same inputs, results, formulas, working and sources${TOP_LEVEL?', and you can print it or save it as PDF from there':''}.</p>`:''}
   ${fallbackText?`<textarea readonly style="min-height:150px">${esc(fallbackText)}</textarea>`:''}
   <div style="display:flex;gap:8px;flex-wrap:wrap">${reportDoc?'<button class="btn pri" data-act="openreport">Open printable report</button>':''}<button class="btn" data-act="close">Close</button></div>
   <p class="muted" style="margin:0;font-size:12px">Reason: ${esc(reason)}${TOP_LEVEL?' · page opened on its own':' · page shown inside a viewer'}</p>`);
}

function vHistory(){
  const recent=S.recent.length?`<section class="sec"><h2>Recent on this device</h2><div class="strip">${S.recent.map(r=>calc(r.id)).filter(Boolean).map(c=>`<button class="pill" data-calc="${c.id}">${esc(c.title)}</button>`).join('')}</div></section>`:'';
  if(plan()==='guest') return `<p class="eyebrow">Your work</p><h1 class="ptitle">History & saved</h1><div class="panel" style="margin-top:14px"><p style="margin-top:0">Create a free account to save calculations with a name and keep them on all your devices. Without an account, a recent list is kept on this device.</p><button class="btn pri" data-act="user">Create free account</button></div>${recent}`;
  const where=S.user&&S.user.id?`synced to ${esc(S.user.email)}`:'kept in this browser';
  return `<p class="eyebrow">Your work</p><div class="chead"><h1 class="ptitle" style="margin:0">History & saved</h1>${S.saves.length?'<button class="btn sm" data-act="csvall" style="margin-left:auto">Export all as CSV</button>':''}</div><p class="muted" style="margin:0 0 14px">${S.saves.length} saved calculation${S.saves.length===1?'':'s'} · ${where}</p>
   ${S.saves.length?`<div class="panel tbl" style="padding:6px 12px"><table class="t"><thead><tr><th>Name</th><th>Calculator</th><th>Result</th><th>Saved</th><th></th></tr></thead><tbody>
   ${[...S.saves].reverse().map(s=>`<tr><td><input type="text" value="${esc(s.name)}" data-rename="${s.id}" id="rn_${s.id}" aria-label="Name" style="min-width:160px"></td><td>${esc(calc(s.calc)?.title||s.calc)} <span class="chip">v${esc(s.version)}</span></td><td class="n">${esc(s.summary)}</td><td class="n">${new Date(s.at).toLocaleDateString()}</td>
   <td style="white-space:nowrap"><button class="btn sm" data-open="${s.id}">Open</button> <button class="btn sm ghost" data-del="${s.id}" aria-label="Delete">✕</button></td></tr>`).join('')}</tbody></table></div>`
   :`<div class="empty">Nothing saved yet. Open any calculator and press Save.</div>`}${recent}`;
}

   <div style="display:flex;gap:8px;flex-wrap:wrap">${S.user&&S.user.id?'<button class="btn" data-act="signout">Sign out</button>':AUTH.available?'<button class="btn" data-act="user">Sign in</button>':''}<button class="btn" data-go="pricing">See plans</button>${S.license?'<button class="btn" data-act="licremove">Remove licence</button>':'<button class="btn" data-act="licmodal">Enter licence key</button>'}</div></div>

function vAbout(){
  const allRefs=[...new Set(CALCS.flatMap(refsOf))].sort();
  const edRows=EDITIONS.map(([re,ed])=>[ed,CALCS.filter(c=>refsOf(c).some(r=>re.test(r)))]).filter(x=>x[1].length);
  return `<div class="prose"><p class="eyebrow">About</p><h1 class="ptitle">Formulas and sources</h1>
 <p>Every calculator is a small, pure function with a version number. Inputs are converted to SI units, calculated, and converted back for display. The formulas are checked against ${GOLDEN.length} test cases with independently worked reference values; anyone can run them on the Admin page.</p>
 <h2>Precision</h2><p>Engineering results show ${S.settings.sig} significant figures by default. Money is rounded to the cent. Unit factors are exact values from NIST Special Publication 811.</p>
 <h2>Pipeline calculators</h2><p>Wall thickness follows the ASME B31.8 (gas) and B31.4 (liquids) design formulas with the code's design, joint and temperature factors. Gas flow uses the Weymouth and Panhandle A equations as published by Menon. Liquid pressure drop uses Darcy–Weisbach with the Colebrook–White friction factor. Always check the edition your project is bound to.</p>
 <h2>Jewelry and gemstones</h2><p>Gold values use nominal karat purity (k/24). Carat estimates use the industry's mounted-stone factors and the stone's specific gravity; they are estimates, not weights.</p>
 <h2>Standards and editions</h2><p>${esc(EDITION_NOTE)}</p><div class="tbl"><table class="t"><thead><tr><th>Standard and edition</th><th>Used by</th></tr></thead><tbody>${edRows.map(([ed,cs])=>`<tr><td><b>${esc(ed)}</b></td><td>${cs.map(c=>`<button class="link" data-calc="${c.id}">${esc(c.title)}</button>`).join(' · ')}</td></tr>`).join('')}</tbody></table></div>
 <h2>All sources cited</h2><ul class="notes" style="color:var(--ink)">${allRefs.map(r=>`<li>${esc(edRef(r))}</li>`).join('')}</ul>
 <h2>Disclaimer</h2><p>Engineering, pipeline, building and chemistry results are informational. They are not certified design values and do not replace a licensed professional or the governing code.</p>
 <h2>Privacy</h2><p>No ads and no tracking cookies. Your recent list, saves and calculation sheet stay in this browser unless you sign in. Shared links contain only the calculator, its inputs and the result. See the <button class="link" data-go="privacy">privacy policy</button>.</p></div>`}
function vAdmin(){
  if(!CFG.adminTools)adminTab='tests';
  const tabs=CFG.adminTools?[['tests','Formula tests'],['calcs','Calculators'],['feedback',`Reports (${S.feedback.length})`],['tables','Reference tables']]:[['tests','Formula tests']];
  let body='';
  if(adminTab==='tests'){const rows=runGolden({runCalc,fromSI,CALCS,cents});const pass=rows.filter(r=>r.ok).length;
    body=`<div class="panel" style="margin-bottom:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap"><span class="chip ${pass===rows.length?'ok':'bad'}" style="font-size:14px;padding:4px 12px">${pass} / ${rows.length} passed</span><span class="muted">Covers all ${CALCS.length} calculators. Any failure blocks a release.</span><button class="btn sm" data-act="rerun">Run again</button></div>
    <div class="panel tbl" style="padding:6px 12px"><table class="t"><thead><tr><th></th><th>Calculator</th><th>Checked values</th><th>Reference</th></tr></thead><tbody>${rows.map(r=>`<tr><td><span class="chip ${r.ok?'ok':'bad'}">${r.ok?'Pass':'Fail'}</span></td><td>${esc(r.title)} <span class="chip">v${esc(r.version)}</span></td><td class="n" style="font-size:12.5px">${esc(r.detail)}</td><td style="font-size:13px">${esc(r.ref)}</td></tr>`).join('')}</tbody></table></div>`}
  else if(adminTab==='calcs'){body=`<div class="panel tbl" style="padding:6px 12px"><table class="t"><thead><tr><th>Calculator</th><th>Category</th><th>Version</th><th>Enabled</th></tr></thead><tbody>${CALCS.map(c=>`<tr><td>${esc(c.title)}</td><td>${esc(catOf(c.cat).name)}</td><td class="n">${esc(c.version)}</td><td><input type="checkbox" data-en="${c.id}" id="en_${c.id}" ${enabled(c)?'checked':''} aria-label="Enable ${esc(c.title)}" style="width:18px;height:18px;accent-color:var(--accent)"></td></tr>`).join('')}</tbody></table></div>
    ${S.audit.length?`<div class="panel" style="margin-top:12px"><h2 style="font-size:15px;margin-bottom:6px">Audit log</h2>${S.audit.slice(-8).reverse().map(a=>`<div class="mono" style="font-size:12.5px">${new Date(a.at).toLocaleString()} · ${esc(a.what)}</div>`).join('')}</div>`:''}`}

  const l=e.target.closest('[data-reflink]');if(l){e.preventDefault();const s=$('#ref-'+l.dataset.reflink);if(s)s.scrollIntoView({behavior:'smooth',block:'start'})}});
function doSave(){modal(`<h2 style="font-size:18px">Save calculation</h2><div class="fld"><label for="sv_name">Name</label><input type="text" id="sv_name" maxlength="80" value="${esc(calc(last.calc).title+' — '+new Date().toLocaleDateString())}"></div><p class="muted" style="margin:0;font-size:13px">${esc(summary())}</p><div style="display:flex;gap:8px"><button class="btn pri" data-act="dosave">Save</button><button class="btn" data-act="close">Cancel</button></div>`)}

applyTheme();setPh();productInit();
function routeHash(){const h=(location.hash||'').slice(1);
if(['pricing','privacy','terms','refunds','help','about','ref'].includes(h))go(h);else if(/^s\./.test(h))go('shared',h);else if(/^c\.[a-z0-9-]+$/.test(h)&&calc(h.slice(2)))go('calc',h.slice(2));else if(CATEGORIES.some(c=>c.id===h))go('cat',h);else if(h==='sheet')go('sheet');else go('home');}
routeHash();window.addEventListener('hashchange',routeHash);
</script>
<script>if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js')}</script>
</body></html>
