<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="CalcHub Pro — 105 engineering, building-services, pipeline, finance, jewelry and gemstone calculators with formulas, code editions, working and PDF reports. By Engr. Abrar Hussain, Best Quality First Inc.">
<meta property="og:title" content="CalcHub Pro — every calculation, with the formula on the page"><meta property="og:description" content="105 calculators for engineers and trades, with formulas, standards and PDF calculation reports."><meta property="og:type" content="website">
<meta name="theme-color" content="#14181D"><link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="CalcHub Pro">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="config.js"></script>
</head><body>
<title>CalcHub Pro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: engineer's calculation pad — grouped category rail, input sheet beside a result card that reads like a stamped calc sheet (formula, working, sources) */
:root{
  --paper:#F3F4F1; --surface:#FFFFFF; --sunk:#ECEEEA; --line:#D9DCD6; --line-strong:#B9BEB6;
  --ink:#14181D; --muted:#5B636C; --accent:#0D5C8C; --accent-ink:#0A4A71; --accent-soft:#E2EEF6; --on-accent:#FFFFFF;
  --result:#FFF6E5; --result-ink:#7A4A06; --ok:#18794E; --ok-soft:#E3F3EA; --bad:#B42318; --bad-soft:#FDECEA; --warn-soft:#FFF3D6; --warn-ink:#7A5200;
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",ui-sans-serif,system-ui,sans-serif;
  --f-ui:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --shadow:0 1px 2px rgba(20,24,29,.06),0 8px 24px rgba(20,24,29,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F1215; --surface:#171B20; --sunk:#12161A; --line:#2A3038; --line-strong:#3A424C;
  --ink:#E6E9EC; --muted:#98A1AB; --accent:#6CB4E8; --accent-ink:#9CCDF0; --accent-soft:#132B3C; --on-accent:#0F1215;
  --result:#2A2111; --result-ink:#F2C879; --ok:#5FD39A; --ok-soft:#10291D; --bad:#F2877C; --bad-soft:#341614; --warn-soft:#2D2410; --warn-ink:#F0CB76;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F1215; --surface:#171B20; --sunk:#12161A; --line:#2A3038; --line-strong:#3A424C;
  --ink:#E6E9EC; --muted:#98A1AB; --accent:#6CB4E8; --accent-ink:#9CCDF0; --accent-soft:#132B3C; --on-accent:#0F1215;
  --result:#2A2111; --result-ink:#F2C879; --ok:#5FD39A; --ok-soft:#10291D; --bad:#F2877C; --bad-soft:#341614; --warn-soft:#2D2410; --warn-ink:#F0CB76;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.15;text-wrap:balance}
.mono{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-strong);background:var(--surface);padding:8px 13px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent-ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{background:var(--accent-ink);color:var(--on-accent)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.ghost{background:none;border-color:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--accent-ink);cursor:pointer;font-weight:600}
.link:hover{text-decoration:underline}
input[type=text],input[type=email],input[type=date],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:9px 11px;font-size:15px}
textarea{resize:vertical;min-height:96px;font-family:var(--f-num);font-size:14px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:5px;background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.chip.std{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent;font-family:var(--f-num);font-weight:500}
.chip.warn{background:var(--warn-soft);color:var(--warn-ink);border-color:transparent}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.eyebrow{font-family:var(--f-num);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* ---------- shell ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:14px;align-items:center}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;cursor:pointer;padding:0;flex:none}
.brand .logo{width:46px;height:46px;flex:none;border-radius:10px;background:#fff;object-fit:contain;padding:3px;border:1px solid var(--line)}
.brand .bt{display:flex;flex-direction:column;align-items:flex-start;text-align:left;line-height:1.15}
.brand b{font-family:var(--f-display);font-size:20px;font-weight:700;letter-spacing:-.01em}
.brand small{font-size:11.5px;color:var(--muted);font-weight:400;white-space:nowrap}
.brand small strong{color:var(--ink);font-weight:600}
.credit{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-block:20px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:13px;color:var(--muted);text-align:center}
.credit img{width:34px;height:34px;border-radius:7px;background:#fff;padding:2px;border:1px solid var(--line)}
.credit b{color:var(--ink)}
.paper .ph .brandline{display:flex;align-items:center;gap:10px}
.paper .ph img{width:44px;height:44px;border-radius:8px;background:#fff;border:1px solid var(--line);padding:2px}
.brand b span{color:var(--accent)}
.sbox{position:relative;flex:1;max-width:620px}
.sbox input{padding-left:38px;padding-right:62px;background:var(--sunk);border-color:transparent;height:40px}
.sbox>svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.sbox kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-family:var(--f-num);font-size:11.5px;border:1px solid var(--line-strong);border-radius:5px;padding:1px 5px;color:var(--muted);background:var(--surface)}
.sres{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);max-height:60vh;overflow:auto;z-index:30;padding:6px}
.sres button{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;text-align:left;border:0;background:none;padding:8px 10px;border-radius:7px;cursor:pointer}
.sres button:hover,.sres button.on{background:var(--accent-soft)}
.sres small{color:var(--muted);font-size:12.5px}
.tsp{flex:none;display:flex;gap:6px;align-items:center;margin-left:auto}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 10px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--paper)}
.count{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:11.5px;font-family:var(--f-num)}
.layout{display:grid;grid-template-columns:248px minmax(0,1fr);max-width:1480px;margin:0 auto}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 67px);align-self:start;height:calc(100vh - 67px);overflow:auto;padding:16px 10px 30px max(16px,env(safe-area-inset-left,0px));border-right:1px solid var(--line)}
.side h4{font-family:var(--f-num);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:18px 8px 6px;font-weight:500}
.side h4:first-child{margin-top:0}
.nb{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:7px 8px;border-radius:7px;cursor:pointer;font-weight:500;text-align:left;font-size:14.5px}
.nb:hover{background:var(--sunk)}
.nb.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.nb .ct{margin-left:auto;font-size:12px;color:var(--muted);font-family:var(--f-num)}
main{padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.wrap{max-width:1160px;margin:0 auto}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:22px;align-items:end;margin-bottom:26px}
.hero h1{font-family:var(--f-display);font-size:clamp(30px,4vw,44px);font-weight:700;letter-spacing:-.015em}
.hero p{margin:8px 0 0;color:var(--muted);max-width:58ch;font-size:16px}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.how div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px;min-width:0}
.how b{display:block;font-family:var(--f-num);font-size:12px;color:var(--accent-ink);font-weight:600;margin-bottom:2px}
.figs{display:flex;gap:26px;margin-top:16px;font-size:13px;color:var(--muted)}
.figs b{display:block;font-family:var(--f-num);font-size:24px;color:var(--ink);font-weight:500;line-height:1.1}
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;cursor:pointer;white-space:nowrap;font-weight:500}
.pill:hover{border-color:var(--accent)}
.pill small{color:var(--muted)}
.sec{margin-top:30px}
.sec>h2{font-family:var(--f-display);font-size:20px;font-weight:700;margin-bottom:12px;display:flex;align-items:baseline;gap:10px}
.sec>h2 small{font-family:var(--f-ui);font-size:13px;font-weight:400;color:var(--muted)}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.cat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 14px 10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.cat header{display:flex;align-items:flex-start;gap:11px;margin-bottom:4px}
.cat header .ic{width:36px;height:36px;border-radius:8px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.cat header h3{font-size:16px;font-weight:700;font-family:var(--f-display)}
.cat header small{display:block;color:var(--muted);font-size:12.5px;font-weight:400;margin-top:2px}
.cat ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.cat li button{width:100%;text-align:left;border:0;background:none;padding:5px 6px;border-radius:6px;cursor:pointer;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.cat li button:hover{background:var(--sunk);color:var(--accent-ink)}
.cat li .st{color:var(--result-ink)}
.cat .new{font-family:var(--f-num);font-size:10.5px;font-weight:600;color:var(--result-ink);background:var(--result);padding:1px 6px;border-radius:4px;align-self:center}
.empty{border:1px dashed var(--line-strong);border-radius:10px;padding:14px;color:var(--muted);font-size:14px}

/* ---------- calculator ---------- */
.crumbs{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:8px;flex-wrap:wrap}
.chead{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:6px}
.chead h1{font-family:var(--f-display);font-size:clamp(24px,3vw,32px);font-weight:700;margin-right:4px}
.star{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;width:36px;height:36px;cursor:pointer;font-size:17px;color:var(--muted)}
.star.on{color:var(--result-ink);border-color:var(--result-ink)}
.guide{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);margin:0 0 16px}
.guide span b{font-family:var(--f-num);color:var(--accent-ink);font-weight:600;margin-right:4px}
.cgrid{display:grid;grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr);gap:18px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.card>h2{font-family:var(--f-num);font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:12px;display:flex;justify-content:space-between;gap:8px}
.fields{display:flex;flex-direction:column;gap:13px}
.fld label{display:block;font-weight:600;font-size:14px;margin-bottom:5px}
.fld .help{font-size:12.5px;color:var(--muted);margin-top:4px}
.fld .err{font-size:13px;color:var(--bad);margin-top:4px}
.fld.bad input,.fld.bad textarea{border-color:var(--bad)}
.ig{display:flex;align-items:stretch;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);overflow:hidden}
.ig:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ig input{border:0!important;box-shadow:none!important;border-radius:0;font-family:var(--f-num);background:none}
.ig .pre{display:grid;place-items:center;padding:0 10px;color:var(--muted);background:var(--sunk);font-family:var(--f-num);font-size:14px}
.ig select{width:auto;max-width:42%;border:0;border-left:1px solid var(--line);border-radius:0;background:var(--sunk);font-size:14px;padding:0 8px;font-family:var(--f-num);box-shadow:none!important}
.res{position:sticky;top:calc(env(safe-area-inset-top,0px) + 86px);box-shadow:var(--shadow)}
.prim{border-radius:10px;background:var(--result);padding:14px 16px;margin-bottom:12px;border:1px solid transparent}
.prim .lab{font-size:13px;font-weight:600;color:var(--result-ink)}
.prim .val{font-family:var(--f-num);font-size:clamp(24px,3.2vw,34px);font-weight:500;line-height:1.2;word-break:break-word;margin-top:2px}
.prim .alt{font-family:var(--f-num);font-size:13.5px;color:var(--muted);margin-top:3px}
.prim.err{background:var(--bad-soft)} .prim.err .lab{color:var(--bad)} .prim.err .val{font-family:var(--f-ui);font-size:16px;font-weight:600;color:var(--bad)}
.rtab{width:100%;border-collapse:collapse;font-size:14px}
.rtab td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.rtab td:last-child{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.rtab td small{display:block;color:var(--muted);font-size:12px}
.blk{margin-top:14px}
.blk h3{font-family:var(--f-num);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:6px}
.formula{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-family:var(--f-num);font-size:13.5px;overflow-x:auto;white-space:pre-wrap}
.steps{margin:0;padding-left:22px;font-size:13px;font-family:var(--f-num)}
.steps li{margin-bottom:4px}
.notes{font-size:13px;color:var(--muted);margin:0;padding-left:18px}
.notes li{margin-bottom:3px}
.disc{margin-top:12px;background:var(--warn-soft);color:var(--warn-ink);border-radius:8px;padding:9px 12px;font-size:13px;font-weight:500}
.acts{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.acts .sp{flex-basis:100%;height:0}
.convgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.convgrid div{background:var(--sunk);border-radius:8px;padding:8px 10px}
.convgrid small{display:block;color:var(--muted);font-size:12px}
.convgrid b{font-family:var(--f-num);font-weight:500;font-size:15px;word-break:break-all}

/* ---------- sheet / report preview ---------- */
.sheet-head{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.paper{background:var(--surface);border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow);padding:clamp(18px,4vw,44px);max-width:860px;margin:0 auto}
.paper .ph{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:18px}
.paper .ph b{font-family:var(--f-display);font-size:22px}
.paper .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:4px 18px;font-size:13px;margin-bottom:20px}
.paper .meta span{color:var(--muted)}
.paper section{border-top:1px solid var(--line);padding-top:16px;margin-top:18px}
.paper section h2{font-family:var(--f-display);font-size:19px;margin-bottom:2px}
.paper table{width:100%;border-collapse:collapse;font-size:13.5px;margin:6px 0 10px}
.paper td{padding:5px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.paper td:last-child{font-family:var(--f-num);text-align:right}
.paper td.b{font-weight:700}
.sitem{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 4px;border-bottom:1px solid var(--line)}
.sitem .n{font-family:var(--f-num);color:var(--muted);width:26px}
.sitem .t{flex:1;min-width:180px}
.sitem .t small{display:block;color:var(--muted);font-family:var(--f-num);font-size:12.5px}

/* ---------- tables & misc ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.tbl{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t th{font-family:var(--f-num);font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:500}
table.t td.n{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{border:1px solid var(--line-strong);background:var(--surface);border-radius:7px;padding:6px 13px;cursor:pointer;font-weight:600;font-size:14px}
.tabs button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.setgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.ptitle{font-family:var(--f-display);font-size:30px;font-weight:700;margin-bottom:6px}
.prose{max-width:740px} .prose h2{font-family:var(--f-display);font-size:21px;margin:22px 0 6px} .prose p{margin:0 0 10px}
.overlay{position:fixed;inset:0;background:rgba(10,12,15,.5);z-index:40}
.modal{position:fixed;z-index:41;left:50%;top:50%;transform:translate(-50%,-50%);width:min(500px,calc(100% - 32px));max-height:90vh;overflow:auto;background:var(--surface);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 15px;border-radius:8px;font-size:14px;font-weight:600;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.sr{position:absolute;left:-9999px}

function fmtSig(x, sig=4){

const R = (key,label,value,o={}) => ({key,label,value,...o});           // o: dim, kind ('num'|'money'|'int'|'text'|'pct'), primary, sig
const sq = x=>x*x, deg=x=>x*180/Math.PI, rad=x=>x*Math.PI/180;
function parseList(txt,key){const parts=String(txt||'').split(/[\s,;]+/).filter(Boolean);const out=parts.map(Number);const bad=parts.findIndex((p,k)=>!Number.isFinite(out[k]));need(bad<0,`"${parts[bad]}" is not a number.`,key);need(out.length>0,'Enter at least one number.',key);return out}
function dms(d){const sgn=d<0?'-':'';d=Math.abs(d);let D=Math.floor(d),M=Math.floor((d-D)*60),S=Math.round(((d-D)*60-M)*60*100)/100;if(S>=60){S=0;M++}if(M>=60){M=0;D++}return `${sgn}${D}°${String(M).padStart(2,'0')}′${String(S).padStart(2,'0')}″`}
function parseAngle(t){const s=String(t).trim();if(/^[-+]?\d*\.?\d+$/.test(s))return parseFloat(s);const m=s.match(/^([-+])?\s*(\d+(?:\.\d+)?)\s*(?:°|d|\s)\s*(\d+(?:\.\d+)?)?\s*(?:'|′|m|\s)?\s*(\d+(?:\.\d+)?)?\s*(?:"|″|s)?$/i);need(m,'Write the angle as decimal degrees (36.87) or degrees minutes seconds (36 52 12).','a');const v=+m[2]+(+(m[3]||0))/60+(+(m[4]||0))/3600;need((+(m[3]||0))<60&&(+(m[4]||0))<60,'Minutes and seconds must be below 60.','a');return m[1]==='-'?-v:v}
function bearing(az){az=((az%360)+360)%360;let ns,ew,a;if(az<=90){ns='N';ew='E';a=az}else if(az<=180){ns='S';ew='E';a=180-az}else if(az<=270){ns='S';ew='W';a=az-180}else{ns='N';ew='W';a=360-az}return `${ns} ${dms(a)} ${ew}`}
function molarMass(f){
  let s=String(f).replace(/\s/g,''); need(s.length,'Type a formula, for example C6H12O6.','f');
  const parts=s.split(/[·*.]/); let total=0, detail={};
  for(const part of parts){ let mult=1; let p=part; const m=p.match(/^(\d+)(.*)$/); if(m){mult=+m[1];p=m[2]}
    let i=0; const group=()=>{const counts={};while(i<p.length&&p[i]!==')'){
      if(p[i]==='('){i++;const inner=group();need(p[i]===')','Missing ")" in formula.','f');i++;const n=num();for(const k in inner)counts[k]=(counts[k]||0)+inner[k]*n;continue}
      const el=p.slice(i).match(/^[A-Z][a-z]?/);need(el,`Unexpected "${p[i]}" in formula. Elements start with a capital letter.`,'f');need(ATOMIC[el[0]]!==undefined,`Unknown element "${el[0]}".`,'f');i+=el[0].length;const n=num();counts[el[0]]=(counts[el[0]]||0)+n}
      return counts};
    const num=()=>{const m=p.slice(i).match(/^\d+/);if(m){i+=m[0].length;return +m[0]}return 1};
    const c=group(); need(i>=p.length,'Unmatched ")" in formula.','f');
    for(const k in c){detail[k]=(detail[k]||0)+c[k]*mult;total+=ATOMIC[k]*c[k]*mult}
  }
  return {total,detail};
}
function amort(P,r,n){ /* monthly rate r, n payments */ return r===0?P/n:P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1) }

def({id:'date-diff',cat:'general',title:'Date difference',kw:'days between dates age duration calendar',
  inputs:[date('a','Start date','2026-01-01'),date('b','End date','2026-12-31')],
  compute(v){need(/^\d{4}-\d{2}-\d{2}$/.test(v.a||''),'Choose a start date.','a');need(/^\d{4}-\d{2}-\d{2}$/.test(v.b||''),'Choose an end date.','b');
    const pa=v.a.split('-').map(Number),pb=v.b.split('-').map(Number);let A=Date.UTC(pa[0],pa[1]-1,pa[2]),B=Date.UTC(pb[0],pb[1]-1,pb[2]);let sign=1;if(B<A){[A,B]=[B,A];sign=-1}
    const days=Math.round((B-A)/864e5);const da=new Date(A),db=new Date(B);let y=db.getUTCFullYear()-da.getUTCFullYear(),m=db.getUTCMonth()-da.getUTCMonth(),d=db.getUTCDate()-da.getUTCDate();
    if(d<0){m--;d+=new Date(Date.UTC(db.getUTCFullYear(),db.getUTCMonth(),0)).getUTCDate()}if(m<0){y--;m+=12}
    return{results:[R('days','Days',sign*days,{primary:true,kind:'int'}),R('weeks','Weeks and days',`${Math.floor(days/7)} weeks ${days%7} days`,{kind:'text'}),R('ymd','Calendar difference',`${y} years ${m} months ${d} days`,{kind:'text'})],

def({id:'average',cat:'general',title:'Average and statistics',kw:'mean median mode standard deviation',
  inputs:[area_('list','Numbers (separated by spaces, commas or new lines)','2 4 4 4 5 5 7 9')],
  compute(v){const a=parseList(v.list,'list');const n=a.length,sum=a.reduce((x,y)=>x+y,0),mean=sum/n,s=[...a].sort((x,y)=>x-y);
    const med=n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2;const cnt={};a.forEach(x=>cnt[x]=(cnt[x]||0)+1);const mx=Math.max(...Object.values(cnt));const modes=Object.keys(cnt).filter(k=>cnt[k]===mx);
    const ss=a.reduce((t,x)=>t+sq(x-mean),0);const pop=Math.sqrt(ss/n),samp=n>1?Math.sqrt(ss/(n-1)):NaN;
    return{results:[R('mean','Mean',mean,{primary:true}),R('median','Median',med),R('mode','Mode',mx>1?modes.join(', '):'No repeated value',{kind:'text'}),R('count','Count',n,{kind:'int'}),R('sum','Sum',sum,{sig:10}),R('min','Minimum',s[0]),R('max','Maximum',s[n-1]),R('sdp','Std deviation (population)',pop),R('sds','Std deviation (sample)',n>1?samp:'Needs 2+ values',{kind:n>1?'num':'text'})],
      formula:'mean = Σx ÷ n · σ = √(Σ(x − mean)² ÷ n) · s = √(Σ(x − mean)² ÷ (n − 1))',steps:[`Σx = ${fmtSig(sum,10)}, n = ${n}, mean = ${fmtSig(mean)}`,`Σ(x − mean)² = ${fmtSig(ss)}`]}}});

def({id:'loan-emi',cat:'financial',title:'Loan / EMI',kw:'emi installment monthly payment amortization',
  inputs:[num('P','Loan amount',{money:true,def:100000,min:0}),num('rate','Annual interest rate (%)',{def:10,min:0,max:100}),num('term','Term',{def:12,min:1,int:true}),sel('tu','Term unit',[['m','Months'],['y','Years']])],

def({id:'mortgage',cat:'financial',title:'Mortgage',kw:'home loan house down payment property tax insurance',

def({id:'compound',cat:'financial',title:'Compound interest',kw:'savings investment future value growth',

  compute(v){const n=+v.n,i=v.rate/100/n,N=n*v.years;const g=Math.pow(1+i,N);const fvP=v.P*g,fvC=i===0?v.C*N:v.C*(g-1)/i,fv=fvP+fvC,dep=v.P+v.C*N;

def({id:'ohms-law',cat:'electrical',title:"Ohm's law",kw:'voltage current resistance power watts',disclaimer:ENG,
  inputs:[num('V','Voltage',{dim:'voltage',unit:'V',def:12,opt:true}),num('I','Current',{dim:'current',unit:'A',opt:true}),num('Rr','Resistance',{dim:'resistance',unit:'Ω',def:4,opt:true}),num('P','Power',{dim:'power',unit:'W',opt:true})],
  compute(v){const k=['V','I','Rr','P'].filter(x=>Number.isFinite(v[x]));need(k.length===2,'Fill in exactly two of the four values; leave the other two empty.','V');
    let {V,I,Rr,P}=v,how='';const has=x=>k.includes(x);
    if(has('V')&&has('I')){Rr=V/I;P=V*I;how='R = V ÷ I, P = V × I'}else if(has('V')&&has('Rr')){I=V/Rr;P=V*V/Rr;how='I = V ÷ R, P = V² ÷ R'}else if(has('V')&&has('P')){I=P/V;Rr=V*V/P;how='I = P ÷ V, R = V² ÷ P'}
    else if(has('I')&&has('Rr')){V=I*Rr;P=I*I*Rr;how='V = I × R, P = I² × R'}else if(has('I')&&has('P')){V=P/I;Rr=P/(I*I);how='V = P ÷ I, R = P ÷ I²'}else{I=Math.sqrt(P/Rr);V=Math.sqrt(P*Rr);how='I = √(P ÷ R), V = √(P × R)'}

def({id:'voltage-drop',cat:'electrical',title:'Voltage drop',kw:'cable length drop copper aluminium',disclaimer:ENG,
  inputs:[num('I','Load current',{dim:'current',unit:'A',def:20,min:0}),num('L','One-way cable length',{dim:'length',unit:'m',imp:'ft',def:30,min:0}),num('A','Conductor cross-section',{dim:'area',unit:'mm2',imp:'mm2',def:4,min:0}),sel('mat','Conductor',[['copper','Copper'],['aluminium','Aluminium']]),sel('ph','System',[['1','Single-phase / DC'],['3','Three-phase']]),num('V','Nominal voltage',{dim:'voltage',unit:'V',def:230,min:0})],
  compute(v){need(v.A>0,'Cross-section must be above zero.','A');const Amm=v.A*1e6,k=v.ph==='3'?Math.sqrt(3):2,vd=k*v.L*v.I*RHO[v.mat]/Amm,pct=v.V>0?vd/v.V*100:NaN;

def({id:'wire-size',cat:'electrical',title:'Wire size',kw:'cable sizing awg mm2 ampacity nec iec',disclaimer:ENG,version:'1.0.0',
  inputs:[sel('std','Standard',[['nec','NEC (US, AWG)'],['iec','IEC 60364 (mm²)']]),num('I','Load current',{dim:'current',unit:'A',def:40,min:0}),num('L','One-way length',{dim:'length',unit:'m',imp:'ft',def:10,min:0}),num('V','Supply voltage',{dim:'voltage',unit:'V',def:240,min:1}),sel('ph','System',[['1','Single-phase'],['3','Three-phase']]),num('maxvd','Maximum voltage drop (%)',{def:3,min:0.1,max:20}),sel('cont','Continuous load (NEC ×125%)',[['no','No'],['yes','Yes']])],
  compute(v){need(v.I>0,'Load current must be above zero.','I');const k=v.ph==='3'?Math.sqrt(3):2;const design=v.std==='nec'&&v.cont==='yes'?v.I*1.25:v.I;
    const tbl=v.std==='nec'?NEC_CU75.rows:(v.ph==='3'?IEC_CU_PVC_C.rows3:IEC_CU_PVC_C.rows2);const src=v.std==='nec'?NEC_CU75.source:IEC_CU_PVC_C.source+(v.ph==='3'?', 3 loaded conductors':', 2 loaded conductors');
    const steps=[`Design current = ${fmtSig(v.I)} A${design!==v.I?' × 1.25 = '+fmtSig(design)+' A':''}`];
    for(const row of tbl){const amp=row[3]?Math.min(row[2],row[3]):row[2];const vd=k*v.L*v.I*RHO.copper/row[1],pct=vd/v.V*100;
      if(amp>=design&&pct<=v.maxvd){steps.push(`${row[0]}: ampacity ${amp} A ≥ ${fmtSig(design)} A, drop ${fmtSig(pct,3)}% ≤ ${fmtSig(v.maxvd)}% → selected`);

      steps.push(`${row[0]}: ${amp<design?`ampacity ${amp} A too low`:`drop ${fmtSig(pct,3)}% too high`}`)}

/* ================================================================
   RUN: validate + convert + compute
   raw: {key: number | [number, unit] | string}
   ================================================================ */
function runCalc(id, raw={}){
  const c=CALCS.find(x=>x.id===id); if(!c) throw new ValErr('Unknown calculator.');
  const v={};
  for(const inp of c.inputs){
    let x=raw[inp.key];
    if(inp.type==='num'){
      let unit=inp.unit; if(Array.isArray(x)){unit=x[1];x=x[0]}
      if(x===undefined||x===null||x===''){ if(raw.__useDefaults&&inp.def!==undefined){x=inp.def} else if(inp.opt){v[inp.key]=NaN;continue} else throw new ValErr(`Enter ${inp.label.toLowerCase()}.`,inp.key) }
      x=typeof x==='string'?numFrom(x,inp.key,inp.label):x;
      fin(x,inp.key,inp.label);
      if(inp.min!==undefined&&x<inp.min) throw new ValErr(`${inp.label} must be at least ${inp.min}.`,inp.key);
      if(inp.max!==undefined&&x>inp.max) throw new ValErr(`${inp.label} must be at most ${inp.max}.`,inp.key);
      if(inp.int&&!Number.isInteger(x)) throw new ValErr(`${inp.label} must be a whole number.`,inp.key);
      v[inp.key]=inp.dim?toSI(x,inp.dim,unit):x;
    } else v[inp.key]=x===undefined?inp.def:x;
  }
  const out=c.compute(v);
  for(const r of out.results){ if(r.kind!=='text'&&r.kind!==undefined&&r.kind!=='int'&&r.kind!=='money'&&r.kind!=='pct'&&r.kind!=='num') continue;
    if(typeof r.value==='number'&&!Number.isFinite(r.value)) throw new ValErr('These inputs do not give a finite result. Check for zeros.'); }
  return {...out, calc:c.id, version:c.version, disclaimer:c.disclaimer};
}

const GRADES = [['B','Grade B / L245 (245 MPa · 35.5 ksi)',245e6],['X42','X42 / L290 (290 MPa · 42.1 ksi)',290e6],['X46','X46 / L320 (320 MPa · 46.4 ksi)',320e6],

/* Friction factor: laminar 64/Re; turbulent Colebrook–White solved iteratively (start: Swamee–Jain) */
function frictionFactor(Re, rel){
  if(Re<2300) return {f:64/Re, regime:'Laminar', method:'f = 64 ÷ Re'};
  let f=0.25/sq(Math.log10(rel/3.7+5.74/Math.pow(Re,0.9)));
  for(let k=0;k<60;k++){ const nf=1/sq(-2*Math.log10(rel/3.7+2.51/(Re*Math.sqrt(f)))); if(Math.abs(nf-f)<1e-12){f=nf;break} f=nf }
  return {f, regime:Re<4000?'Transitional (uncertain — treated as turbulent)':'Turbulent', method:'Colebrook–White: 1/√f = −2 log₁₀(ε/3.7D + 2.51/(Re√f))'};
}
function darcy({Q,D,L,eps,rho,nu,dz=0}){
  need(D>0,'Inside diameter must be above zero.','D');need(Q>0,'Flow rate must be above zero.','Q');need(nu>0,'Viscosity must be above zero.','nu');need(rho>0,'Density must be above zero.','rho');
  const A=area(D), v=Q/A, Re=v*D/nu, ff=frictionFactor(Re, eps/D);
  const hf=ff.f*(L/D)*v*v/(2*G0), dpf=rho*G0*hf, dpz=rho*G0*dz;
  return {A,v,Re,...ff,hf,dpf,dpz,dp:dpf+dpz};
}
function darcyResults(r, L){
  return [R('dp','Total pressure drop',r.dp,{dim:'pressure',primary:true,show:['bar','kPa','psi']}),

}

/* Barlow-type wall thickness / MAOP shared by B31.8 and B31.4 */
function barlow(v, factorText, factor, refs, code){
  const S=gradeS(v.grade,v.S), D=v.D;need(D>0,'Outside diameter must be above zero.','D');
  const tol=(v.tol||0)/100, CA=Number.isFinite(v.CA)?v.CA:0; need(tol<0.5,'Mill tolerance must be below 50%.','tol');
  const steps=[`SMYS S = ${fmtSig(S/1e6)} MPa (${fmtSig(S/6894757.293168)} ksi)`,`Combined factor = ${factorText} = ${fmtSig(factor,4)}`];
  if(v.mode==='t'){
    need(v.P>0,'Enter the design pressure.','P');
    const tp=v.P*D/(2*S*factor), treq=tp+CA, tnom=treq/(1-tol), hoop=v.P*D/(2*tnom);
    steps.push(`Pressure design thickness t = P D ÷ (2 S × factors) = ${fmtSig(v.P/1e6)} MPa × ${fmtSig(D*1000)} mm ÷ (2 × ${fmtSig(S/1e6)} MPa × ${fmtSig(factor,4)}) = ${fmtSig(tp*1000)} mm`);
    if(CA) steps.push(`+ corrosion allowance ${fmtSig(CA*1000)} mm = ${fmtSig(treq*1000)} mm`);
    if(tol) steps.push(`÷ (1 − ${fmtSig(tol*100)}% mill under-tolerance) = ${fmtSig(tnom*1000)} mm minimum nominal wall`);
    return {results:[R('tnom','Minimum nominal wall thickness',tnom,{dim:'length',primary:true,show:['mm','in']}),R('tp','Pressure design thickness',tp,{dim:'length',show:['mm','in']}),
      R('Dt','D / t ratio (nominal)',D/tnom,{sig:4}),R('hoopPct','Hoop stress / SMYS at design pressure (nominal wall)',hoop/S*100,{kind:'pct'})],
      formula:`${code}: P = 2 S t ÷ D × ${factorText}  →  t = P D ÷ (2 S × ${factorText})`,steps,
      assumptions:['Choose the next standard wall (e.g. ASME B36.10 schedule) at or above the minimum nominal wall.','Does not cover external loads, buckling, fatigue, road/rail crossings or fittings — check those separately.'],refs};
  }
  need(v.t>0,'Enter the nominal wall thickness.','t');
  const tnet=v.t*(1-tol)-CA; need(tnet>0,'Allowances are larger than the wall thickness.','t');
  const P=2*S*tnet*factor/D, hoop=P*D/(2*v.t);
  steps.push(`Net wall = ${fmtSig(v.t*1000)} mm × (1 − ${fmtSig(tol*100)}%) − ${fmtSig(CA*1000)} mm = ${fmtSig(tnet*1000)} mm`);
  steps.push(`P = 2 × ${fmtSig(S/1e6)} MPa × ${fmtSig(tnet*1000)} mm ÷ ${fmtSig(D*1000)} mm × ${fmtSig(factor,4)} = ${fmtSig(P/1e6)} MPa = ${fmtSig(P/6894.757293168)} psi`);
  return {results:[R('P','Maximum design pressure (MAOP basis)',P,{dim:'pressure',primary:true,show:['MPa','bar','psi']}),R('hoop','Hoop stress at that pressure (nominal wall)',hoop,{dim:'pressure',show:['MPa','ksi']}),
    R('hoopPct','Hoop stress / SMYS',hoop/S*100,{kind:'pct'}),R('Dt','D / t ratio',D/v.t,{sig:4})],
    formula:`${code}: P = 2 S t ÷ D × ${factorText}`,steps,
    assumptions:['MAOP of a real line also depends on the hydrostatic test pressure, fittings, flanges and valves — the lowest rating governs.'],refs};
}

  compute(v){need(v.P1>v.P2&&v.P2>0,'Inlet pressure must be higher than outlet pressure (both absolute).','P2');need(v.D>0&&v.L>0,'Diameter and length must be above zero.','D');

def({id:'oil-dp',cat:'oilpipe',title:'Liquid pipeline pressure drop (Darcy–Weisbach)',kw:'oil pressure drop friction factor colebrook reynolds crude product pipeline',disclaimer:ENG,

  compute(v){const r=darcy({Q:v.Q,D:v.D,L:v.L,eps:v.eps,rho:v.rho,nu:v.nu,dz:v.dz});
    return{results:darcyResults(r,v.L),formula:'ΔP = f (L/D) ρ v²/2 + ρ g Δz · Re = v D ÷ ν',steps:[`v = Q ÷ A = ${fmtSig(r.v)} m/s`,`Re = ${fmtSig(r.v)} × ${fmtSig(v.D)} ÷ ${fmtSig(v.nu,4)} = ${fmtSig(r.Re,5)} → ${r.regime}`,`${r.method} → f = ${fmtSig(r.f,5)}`,`ΔP_friction = ${fmtSig(r.dpf/1e5)} bar, ΔP_elevation = ${fmtSig(r.dpz/1e5)} bar`],
      assumptions:['Newtonian liquid at constant temperature; for waxy or heavy crude, use the viscosity at the flowing temperature.'],refs:['Darcy–Weisbach; Colebrook–White (1939); Swamee–Jain start value','Crane TP-410, Flow of Fluids']}}});
def({id:'oil-api',cat:'oilpipe',title:'API gravity, specific gravity and density',kw:'api gravity specific gravity crude oil density light heavy',
  inputs:[sel('from','I know',[['api','API gravity (°API)'],['sg','Specific gravity at 60 °F'],['rho','Density (kg/m³ at 15.6 °C)']]),num('x','Value',{def:35})],
  compute(v){fin(v.x,'x','Value');let sg;if(v.from==='api'){need(v.x>-131.5,'API gravity must be above −131.5.','x');sg=141.5/(v.x+131.5)}else if(v.from==='sg'){need(v.x>0,'Specific gravity must be above zero.','x');sg=v.x}else{need(v.x>0,'Density must be above zero.','x');sg=v.x/999.016}
    const api=141.5/sg-131.5,cls=api>31.1?'Light crude (> 31.1 °API)':api>=22.3?'Medium crude (22.3–31.1 °API)':api>=10?'Heavy crude (10–22.3 °API)':'Extra-heavy (< 10 °API, denser than water)';
    return{results:[R('api','API gravity',api,{unitText:'°API',primary:v.from!=='api'}),R('sg','Specific gravity (60/60 °F)',sg,{sig:5,primary:v.from==='api'}),R('rho','Density',sg*999.016,{unitText:'kg/m³'}),R('bbl','Mass of one barrel',sg*999.016*0.158987294928,{unitText:'kg/bbl'}),R('cls','Classification',cls,{kind:'text'})],
      formula:'SG = 141.5 ÷ (°API + 131.5) · ρ = SG × 999.016 kg/m³',steps:[`SG = ${fmtSig(sg,5)}, °API = ${fmtSig(api,5)}`],refs:['API MPMS Ch. 11.1 / ASTM D1250 definition of API gravity','Classification bands: commonly used industry ranges']}}});
def({id:'oil-linefill',cat:'oilpipe',title:'Pipeline linefill volume',kw:'linefill barrels pipeline volume fill time inventory',
  inputs:[num('D','Inside diameter',{dim:'length',unit:'mm',imp:'in',def:500,min:0}),num('L','Length',{dim:'length',unit:'km',imp:'mi',def:1,min:0}),num('Q','Flow rate (optional, for fill time)',{dim:'flow',unit:'m3/h',imp:'bbl/h',opt:true})],

def({id:'oil-pump',cat:'oilpipe',title:'Pump power for a pressure rise',kw:'pump station power hydraulic horsepower kw differential pressure liquid',disclaimer:ENG,
  inputs:[num('Q','Flow rate',{dim:'flow',unit:'m3/h',imp:'bbl/h',def:500,min:0}),num('dp','Differential pressure',{dim:'pressure',unit:'bar',imp:'psi',def:50,min:0}),num('rho','Liquid density',{dim:'density',unit:'kg/m3',imp:'lb/ft3',def:850,min:0}),num('ep','Pump efficiency (%)',{def:75,min:1,max:100}),num('em','Motor efficiency (%)',{def:95,min:1,max:100})],

      formula:'P_h = Q ΔP · P_shaft = P_h ÷ η_pump · P_motor = P_shaft ÷ η_motor · H = ΔP ÷ (ρ g)',steps:[`P_h = ${fmtSig(v.Q*3600)} m³/h × ${fmtSig(v.dp/1e5)} bar = ${fmtSig(Ph/1000)} kW`,`÷ ${fmtSig(v.ep)}% ÷ ${fmtSig(v.em)}% = ${fmtSig(Pm/1000)} kW`],assumptions:['Select a motor rating with margin (often 10–15%) above the shaft power.'],refs:['Hydraulic Institute — pump power definitions']}}});

const HWC=[['150','PVC / HDPE / GRP (C = 150)',150],['140','Copper, cement-lined ductile iron (C = 140)',140],['130','New cast iron, concrete (C = 130)',130],['120','New steel (C = 120)',120],['100','Old cast iron / steel (C = 100)',100],['custom','Other — enter C below',NaN]];
def({id:'water-hw',cat:'waterpipe',title:'Head loss — Hazen–Williams',kw:'hazen williams head loss water main friction c factor',disclaimer:ENG,
  inputs:[sel('find','Solve for',[['h','Head loss from flow'],['Q','Flow from allowable head loss']]),num('Q','Flow rate',{dim:'flow',unit:'L/s',imp:'gpm',def:100,opt:true}),num('h','Allowable head loss',{dim:'length',unit:'m',imp:'ft',opt:true}),num('D','Inside diameter',{dim:'length',unit:'mm',imp:'in',def:300,min:0}),num('L','Length',{dim:'length',unit:'m',imp:'ft',def:1000,min:0}),sel('Csel','Pipe material (C factor)',HWC.map(x=>[x[0],x[1]]),'130'),num('Cc','C factor (only for "Other")',{opt:true})],
  compute(v){const C=v.Csel==='custom'?v.Cc:+v.Csel;need(C>0,'Enter a C factor.','Cc');need(v.D>0&&v.L>0,'Diameter and length must be above zero.','D');
    if(v.find==='h'){need(v.Q>0,'Enter the flow rate.','Q');const hf=10.67*v.L*Math.pow(v.Q,1.852)/(Math.pow(C,1.852)*Math.pow(v.D,4.8704)),u=v.Q/area(v.D);
      return{results:[R('hf','Head loss',hf,{dim:'length',primary:true,show:['m','ft']}),R('dp','Pressure loss',hf*998.2*G0,{dim:'pressure',show:['kPa','psi']}),R('perkm','Head loss per km',hf/(v.L/1000),{unitText:'m/km'}),R('u','Velocity',u,{dim:'speed',show:['m/s','ft/s']})],
        formula:'h_f = 10.67 L Q^1.852 ÷ (C^1.852 D^4.8704)   (SI: m, m³/s)',steps:[`h_f = 10.67 × ${fmtSig(v.L)} × ${fmtSig(v.Q,4)}^1.852 ÷ (${C}^1.852 × ${fmtSig(v.D,4)}^4.8704) = ${fmtSig(hf)} m`,`v = ${fmtSig(u)} m/s`],assumptions:['Water at ordinary temperatures, turbulent flow, pipes over about 50 mm.'],refs:['Hazen–Williams equation, SI form (e.g. AWWA M11; EPANET manual)']}}
    need(v.h>0,'Enter the allowable head loss.','h');const Q=Math.pow(v.h*Math.pow(C,1.852)*Math.pow(v.D,4.8704)/(10.67*v.L),1/1.852);
    return{results:[R('Q','Flow rate',Q,{dim:'flow',primary:true,show:['L/s','m3/h','gpm']}),R('u','Velocity',Q/area(v.D),{dim:'speed',show:['m/s','ft/s']})],formula:'Q = [h_f C^1.852 D^4.8704 ÷ (10.67 L)]^(1/1.852)',steps:[`Q = ${fmtSig(Q*1000)} L/s`],refs:['Hazen–Williams equation, SI form']}}});
const WATER_T=[['5','5 °C',999.97,1.519e-6],['10','10 °C',999.70,1.307e-6],['20','20 °C',998.21,1.004e-6],['30','30 °C',995.65,0.801e-6],['40','40 °C',992.22,0.658e-6],['60','60 °C',983.20,0.475e-6]];
def({id:'water-dw',cat:'waterpipe',title:'Head loss — Darcy–Weisbach (water)',kw:'darcy weisbach colebrook water friction factor reynolds head loss',disclaimer:ENG,
  inputs:[num('Q','Flow rate',{dim:'flow',unit:'L/s',imp:'gpm',def:50,min:0}),num('D','Inside diameter',{dim:'length',unit:'mm',imp:'in',def:200,min:0}),num('L','Length',{dim:'length',unit:'m',imp:'ft',def:500,min:0}),num('eps','Absolute roughness',{dim:'length',unit:'mm',imp:'in',def:0.0015,min:0,help:'0.0015 mm PVC/HDPE · 0.045 mm steel · 0.26 mm cast iron'}),sel('T','Water temperature',WATER_T.map(x=>[x[0],x[1]]),'20'),num('dz','Elevation rise (outlet − inlet)',{dim:'length',unit:'m',imp:'ft',def:0})],
  compute(v){const w=WATER_T.find(x=>x[0]===v.T),r=darcy({Q:v.Q,D:v.D,L:v.L,eps:v.eps,rho:w[2],nu:w[3],dz:v.dz});

const PIPE_E=[['steel','Steel (E = 200 GPa)',200e9],['di','Ductile iron (E = 170 GPa)',170e9],['conc','Concrete (E = 30 GPa)',30e9],['pvc','PVC (E = 3.3 GPa)',3.3e9],['hdpe','HDPE (E = 1.0 GPa, short-term)',1.0e9]];
def({id:'water-hammer',cat:'waterpipe',title:'Water hammer surge (Joukowsky)',kw:'water hammer surge pressure joukowsky wave speed valve closure transient',disclaimer:ENG,
  inputs:[num('dv','Velocity change (sudden stop)',{dim:'speed',unit:'m/s',imp:'ft/s',def:1.5,min:0}),num('D','Inside diameter',{dim:'length',unit:'mm',imp:'in',def:300,min:0}),num('e','Wall thickness',{dim:'length',unit:'mm',imp:'in',def:8,min:0}),sel('mat','Pipe material',PIPE_E.map(x=>[x[0],x[1]]),'steel'),num('L','Pipe length to reflection point (optional)',{dim:'length',unit:'m',imp:'ft',opt:true}),num('aIn','Known wave speed (optional, overrides)',{dim:'speed',unit:'m/s',imp:'ft/s',opt:true})],
  compute(v){const K=2.19e9,rho=998.2,E=PIPE_E.find(x=>x[0]===v.mat)[2];need(v.e>0,'Wall thickness must be above zero.','e');
    const a=v.aIn>0?v.aIn:Math.sqrt((K/rho)/(1+K*v.D/(E*v.e))),dp=rho*a*v.dv,H=a*v.dv/G0;const out=[R('dp','Surge pressure rise',dp,{dim:'pressure',primary:true,show:['bar','psi']}),R('H','Surge head',H,{dim:'length',show:['m','ft']}),R('a','Pressure wave speed',a,{dim:'speed',show:['m/s','ft/s']})];
    const st=[v.aIn>0?`a = ${fmtSig(a)} m/s (given)`:`a = √[(K/ρ) ÷ (1 + K D ÷ (E e))] = √[(${fmtSig(K/1e9)} GPa ÷ ${rho}) ÷ (1 + ${fmtSig(K*v.D/(E*v.e),4)})] = ${fmtSig(a)} m/s`,`ΔP = ρ a Δv = ${rho} × ${fmtSig(a)} × ${fmtSig(v.dv)} = ${fmtSig(dp/1e5)} bar`];
    if(v.L>0){const tc=2*v.L/a;out.push(R('tc','Critical closure time 2L/a',tc,{unitText:'s'}));st.push(`Closing slower than ${fmtSig(tc)} s reduces the surge below the Joukowsky value.`)}
    return{results:out,formula:'ΔP = ρ a Δv · a = √[(K/ρ) ÷ (1 + K D ÷ (E e))]',steps:st,assumptions:['Water at 20 °C (K = 2.19 GPa, ρ = 998 kg/m³); thin-walled pipe, no air; instantaneous closure gives the maximum surge.','Add the surge to the steady working pressure when checking the pipe rating.'],refs:['Joukowsky equation; Wylie & Streeter, Fluid Transients','AWWA M11 / M23 — surge allowances']}}});
def({id:'water-size',cat:'waterpipe',title:'Pipe size for a target velocity',kw:'pipe sizing diameter velocity water main flow',disclaimer:ENG,
  inputs:[num('Q','Flow rate',{dim:'flow',unit:'L/s',imp:'gpm',def:50,min:0}),num('v','Target velocity',{dim:'speed',unit:'m/s',imp:'ft/s',def:1.5,min:0,help:'Typical: 0.6–1.5 m/s distribution mains, 1.5–2.5 m/s pumped mains.'})],

def({id:'water-pump',cat:'waterpipe',title:'Pump head and power (water)',kw:'pump head power kw water static friction total dynamic head',disclaimer:ENG,
  inputs:[num('Q','Flow rate',{dim:'flow',unit:'L/s',imp:'gpm',def:50,min:0}),num('Hs','Static lift (water level to discharge)',{dim:'length',unit:'m',imp:'ft',def:30}),num('Hf','Friction and minor losses',{dim:'length',unit:'m',imp:'ft',def:8,min:0}),num('Hp','Required residual pressure head',{dim:'length',unit:'m',imp:'ft',def:10,min:0}),num('ep','Pump efficiency (%)',{def:75,min:1,max:100}),num('em','Motor efficiency (%)',{def:92,min:1,max:100})],

def({id:'jw-cast',cat:'jewelry',title:'Wax-to-metal casting weight',kw:'casting wax model weight metal needed sprue lost wax',

/* Hunter's probability method (NBS BMS65, 1940): smallest r with P(more than r fixtures flowing) ≤ risk */
function binomTail(n,p,r){ // P(X > r), log-space so large n does not underflow
  let lt=n*Math.log1p(-p), cdf=Math.exp(lt);
  for(let k=1;k<=r;k++){ lt+=Math.log((n-k+1)/k)+Math.log(p)-Math.log1p(-p); cdf+=Math.exp(lt) }
  return Math.max(0,1-cdf);
}

def({id:'hv-duct',cat:'hvac',title:'Duct sizing (equal friction)',kw:'duct size round rectangular equal friction velocity cfm pressure drop',disclaimer:ENG,
  inputs:[num('Q','Airflow',{dim:'flow',unit:'L/s',imp:'cfm',def:500,min:0}),num('fr','Friction rate',{def:1.0,min:0.05,max:10,help:'Pa per metre. 0.8–1.0 Pa/m (0.08–0.1 in. w.c. per 100 ft) is common for supply ducts.'}),sel('fru','Friction rate unit',[['pa','Pa per metre'],['in','in. w.c. per 100 ft']]),num('eps','Duct roughness',{dim:'length',unit:'mm',imp:'mm',def:0.09,min:0,help:'0.09 mm galvanized steel · 0.9 mm flexible duct (extended)'}),num('ar','Rectangular aspect ratio (width ÷ height)',{def:2,min:1,max:8})],

    let lo=0.02,hi=5;for(let k=0;k<100;k++){const m=Math.sqrt(lo*hi);if(grad(m)>fr)lo=m;else hi=m}const D=hi,vel=v.Q/area(D);

    const eqD=(a,b)=>1.30*Math.pow(a*b,0.625)/Math.pow(a+b,0.25);let lo2=0.01,hi2=5;for(let k=0;k<100;k++){const h=(lo2+hi2)/2;if(eqD(v.ar*h,h)<D)lo2=h;else hi2=h}const hh=hi2,ww=v.ar*hh;

/* psychrometrics, ASHRAE (Hyland–Wexler) saturation pressure over liquid water */
const pws=T=>Math.exp(-5.8002206e3/T+1.3914993-4.8640239e-2*T+4.1764768e-5*T*T-1.4452093e-8*T*T*T+6.5459673*Math.log(T)); // Pa, T in K
def({id:'hv-psychro',cat:'hvac',title:'Psychrometrics (air properties)',kw:'psychrometric dew point wet bulb humidity ratio enthalpy relative humidity',disclaimer:ENG,
  inputs:[num('t','Dry-bulb temperature',{dim:'temp',unit:'C',imp:'F',def:25}),num('rh','Relative humidity (%)',{def:50,min:0.1,max:100}),num('p','Barometric pressure',{dim:'pressure',unit:'kPa',imp:'psi',def:101.325,min:0})],
  compute(v){const T=v.t;need(T>=273.15&&T<=373.15,'Dry-bulb must be between 0 and 100 °C.','t');need(v.p>=50000&&v.p<=110000,'Barometric pressure must be between 50 and 110 kPa.','p');const tc=T-273.15,pw=v.rh/100*pws(T),W=0.621945*pw/(v.p-pw),h=1.006*tc+W*(2501+1.86*tc);
    let lo=200,hi=T;for(let k=0;k<80;k++){const m=(lo+hi)/2;if(pws(m)>pw)hi=m;else lo=m}const Td=(lo+hi)/2;
    let a=Math.max(Td,240),b=T;for(let k=0;k<80;k++){const ts=(a+b)/2,tsc=ts-273.15,ps=pws(ts),Ws=0.621945*ps/(v.p-ps),Wc=((2501-2.326*tsc)*Ws-1.006*(tc-tsc))/(2501+1.86*tc-4.186*tsc);if(Wc>W)b=ts;else a=ts}const Twb=(a+b)/2;
    const vol=287.042*T*(1+1.607858*W)/v.p;
    return{results:[R('Td','Dew point',Td,{dim:'temp',primary:true,show:['C','F']}),R('Twb','Wet-bulb temperature',Twb,{dim:'temp',show:['C','F']}),R('W','Humidity ratio',W*1000,{unitText:'g/kg dry air'}),R('h','Enthalpy',h,{unitText:'kJ/kg dry air'}),R('v','Specific volume',vol,{unitText:'m³/kg dry air'}),R('pw','Vapour pressure',pw,{dim:'pressure',show:['kPa','psi']})],
      formula:'p_w = φ p_ws(t) · W = 0.621945 p_w ÷ (p − p_w) · h = 1.006 t + W(2501 + 1.86 t) · dew point: p_ws(T_d) = p_w',steps:[`p_ws(${fmtSig(tc)} °C) = ${fmtSig(pws(T)/1000,5)} kPa (Hyland–Wexler)`,`W = ${fmtSig(W,5)} kg/kg, h = ${fmtSig(h)} kJ/kg`,'Wet bulb solved from the ASHRAE adiabatic-saturation relation.'],refs:['ASHRAE Handbook — Fundamentals, Ch. 1 Psychrometrics (Hyland–Wexler formulation)']}}});

def({id:'hv-heatloss',cat:'hvac',title:'Heat loss through a wall or roof',kw:'heat loss u value r value conduction wall roof window',disclaimer:ENG,

def({id:'fp-k',cat:'fire',title:'Sprinkler flow and pressure (K-factor)',kw:'sprinkler k factor flow pressure gpm psi nozzle q = k sqrt p',disclaimer:ENG,
  inputs:[sel('find','Solve for',[['Q','Flow from K and pressure'],['P','Pressure from K and flow'],['K','K-factor from flow and pressure']]),sel('ku','K-factor units',[['us','US: gpm/psi^½'],['si','SI: L/min/bar^½']]),num('K','K-factor',{def:5.6,opt:true}),num('P','Pressure at the sprinkler',{dim:'pressure',unit:'psi',imp:'psi',def:7,opt:true}),num('Q','Flow',{dim:'flow',unit:'gpm',imp:'gpm',opt:true})],
  compute(v){const toUS=v.ku==='si'?1/14.4:1;const psi=x=>x/6894.757293168,gpm=x=>x/6.30901964e-5;let K=Number.isFinite(v.K)?v.K*toUS:NaN,P=psi(v.P),Q=gpm(v.Q);
    if(v.find==='Q'){need(K>0&&P>0,'Enter K-factor and pressure.','K');Q=K*Math.sqrt(P)}else if(v.find==='P'){need(K>0&&Q>0,'Enter K-factor and flow.','K');P=(Q/K)**2}else{need(Q>0&&P>0,'Enter flow and pressure.','Q');K=Q/Math.sqrt(P)}
    return{results:[R(v.find,v.find==='Q'?'Flow':v.find==='P'?'Pressure':'K-factor (US)',v.find==='Q'?Q*6.30901964e-5:v.find==='P'?P*6894.757293168:K,v.find==='Q'?{dim:'flow',primary:true,show:['gpm','L/min']}:v.find==='P'?{dim:'pressure',primary:true,show:['psi','bar']}:{primary:true,unitText:'gpm/psi^½'}),R('Ksi','K-factor (SI)',K*14.4,{unitText:'L/min/bar^½',sig:4})],
      formula:'Q = K √P   (K_SI ≈ 14.4 × K_US)',steps:[`K = ${fmtSig(K)} gpm/psi^½, P = ${fmtSig(P)} psi, Q = ${fmtSig(Q)} gpm`],assumptions:['Minimum end-head pressure is usually 7 psi (0.5 bar) unless the sprinkler listing requires more.'],refs:['NFPA 13 — sprinkler discharge Q = K√P']}}});
def({id:'fp-friction',cat:'fire',title:'Sprinkler pipe friction loss (Hazen–Williams)',kw:'friction loss sprinkler pipe hazen williams nfpa 13 psi per foot c factor',disclaimer:ENG,
  inputs:[num('Q','Flow',{dim:'flow',unit:'gpm',imp:'gpm',def:100,min:0}),num('d','Inside diameter',{dim:'length',unit:'in',imp:'in',def:2.067,min:0,help:'2.067 in = 2 in Schedule 40'}),num('C','C factor',{def:120,min:60,max:150,help:'NFPA 13: 100 black steel dry · 120 black steel wet · 140 copper · 150 CPVC'}),num('L','Pipe length',{dim:'length',unit:'ft',imp:'ft',def:50,min:0}),num('Le','Equivalent length of fittings',{dim:'length',unit:'ft',imp:'ft',def:10,min:0})],
  compute(v){const Qg=v.Q/6.30901964e-5,din=v.d/0.0254,p=4.52*Math.pow(Qg,1.85)/(Math.pow(v.C,1.85)*Math.pow(din,4.87)),Lt=(v.L+v.Le)/0.3048,dp=p*Lt;

def({id:'fp-pump',cat:'fire',title:'Fire pump power and test points',kw:'fire pump horsepower rated flow churn 150% nfpa 20 pump curve',disclaimer:ENG,

function runGolden(engine){
  const {runCalc,fromSI,CALCS}=engine; const rows=[];
  for(const g of GOLDEN){
    let ok=true, detail=[];
    try{
      const raw={...g.in}; const out=runCalc(g.calc,raw);
      for(const [k,exp] of Object.entries(g.expect)){
        const r=out.results.find(x=>x.key===k); if(!r){ok=false;detail.push(`${k}: missing`);continue}
        if(typeof exp==='string'){ const pass=String(r.value).includes(exp); if(!pass)ok=false; detail.push(`${k}: ${r.value} ${pass?'✓':'≠ '+exp}`); continue }
        const [ev,unit,tol=1e-9]=exp; let got=unit?fromSI(r.value,r.dim,unit):r.value;
        if(r.kind==='money') got=engine.cents(got);   // money compared at cent precision
        const pass=Math.abs(got-ev)<=Math.max(Math.abs(ev)*tol,1e-9);
        if(!pass)ok=false; detail.push(`${k}: ${+got.toPrecision(8)}${unit?' '+unit:''} ${pass?'✓':'≠ '+ev}`);
      }
    }catch(e){ ok=false; detail.push('Error: '+e.message) }
    const c=CALCS.find(x=>x.id===g.calc);
    rows.push({calc:g.calc,title:c?c.title:g.calc,version:c?c.version:'?',ok,detail:detail.join(' · '),ref:g.ref});
  }
  return rows;
}
if(typeof module!=='undefined') module.exports={GOLDEN,runGolden};

/* ---------- formatting ---------- */
function unitFor(inp){ if(!inp.dim) return null; if(S.settings.system==='imperial') return inp.imp||SYS_UNITS.imperial[inp.dim]||inp.unit; return inp.unit }
function showUnits(r){ let u=r.show||[SYS_UNITS[S.settings.system][r.dim]||Object.keys(UNITS[r.dim])[0]]; if(S.settings.system==='imperial'){const i=u.findIndex(x=>IMP.has(x)); if(i>0) u=[u[i],...u.filter((_,k)=>k!==i)]} return u }
function fmtVal(r){
  const sig=r.sig||S.settings.sig;
  if(typeof r.value==='string') return {main:esc(r.value)};
  if(r.kind==='money') return {main:fmtMoney(r.value,S.settings.currency)};
  if(r.kind==='int') return {main:fmtInt(r.value)};
  if(r.kind==='pct') return {main:fmtSig(r.value,sig)+' %'};
  if(r.dim){const us=showUnits(r);const parts=us.map(u=>fmtSig(fromSI(r.value,r.dim,u),sig)+' '+ulabel(u));return {main:parts[0],alt:parts.slice(1).join(' · ')}}
  return {main:fmtSig(r.value,sig)+(r.unitText?' '+esc(r.unitText):'')};
}
const plain=s=>String(s).replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'");
const refsOf=c=>c.refs||[];
/* sources are returned by compute(); cache them on each calculator for cards, search and the About page */

/* ---------- sign-in: email link through Supabase (only when configured) ---------- */
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('load'));document.head.appendChild(s)})}
async function authInit(){
  if(S.user&&!S.user.id){S.user=null;save()}                       // retire the old demo sign-in
  const a=CFG.auth;if(a.provider!=='supabase'||!a.url||!a.anonKey){AUTH.ready=true;return}
  try{
    if(!window.supabase)await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js');
    AUTH.client=window.supabase.createClient(a.url,a.anonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
    AUTH.available=true;
    const {data}=await AUTH.client.auth.getSession();await setUser(data&&data.session&&data.session.user);
    AUTH.client.auth.onAuthStateChange((ev,sess)=>{setUser(sess&&sess.user)});
  }catch(e){AUTH.available=false}
  AUTH.ready=true;renderSide();if(['history','settings','pricing'].includes(view.name))rerender();
}
async function setUser(u){
  const before=S.user&&S.user.id;
  if(u){S.user={id:u.id,email:u.email};save();if(before!==u.id){await syncPull();toast('Signed in as '+u.email)}}
  else if(before){S.user=null;save()}
  renderSide();if(['history','settings'].includes(view.name))rerender();
}
const SYNC_TABLE='calchub_user_data';
async function syncPull(){
  if(!AUTH.client||!S.user||!S.user.id)return;
  try{const {data,error}=await AUTH.client.from(SYNC_TABLE).select('saves,sheet,sheet_meta,favs').eq('user_id',S.user.id).maybeSingle();if(error)throw error;
    if(data){const ids=new Set(S.saves.map(s=>s.id));S.saves=[...S.saves,...(data.saves||[]).filter(s=>!ids.has(s.id))];
      if(!S.sheet.length&&data.sheet)S.sheet=data.sheet;if(data.sheet_meta&&!S.sheetMeta.project)S.sheetMeta={...S.sheetMeta,...data.sheet_meta};
      S.favs=[...new Set([...(S.favs||[]),...(data.favs||[])])];save()}
    await syncPush(true);
  }catch(e){toast('Could not load your saved work. It is still on this device.')}
}
let _syncT=null;
function syncSoon(){if(!AUTH.client||!S.user||!S.user.id)return;clearTimeout(_syncT);_syncT=setTimeout(()=>syncPush(),1500)}
async function syncPush(){
  if(!AUTH.client||!S.user||!S.user.id)return;
  try{await AUTH.client.from(SYNC_TABLE).upsert({user_id:S.user.id,saves:S.saves.slice(-500),sheet:S.sheet,sheet_meta:S.sheetMeta,favs:S.favs,updated_at:new Date().toISOString()})}catch(e){}
}

/* ---------- licence keys (checked by your licence service; see license-worker.js) ---------- */
async function licCall(action,body){
  if(!CFG.license.endpoint)throw new Error('Licence checking is not set up in this copy yet.');
  const r=await fetch(CFG.license.endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...body})});
  const d=await r.json().catch(()=>({}));if(!r.ok&&!('valid' in d))throw new Error(d.error||'The licence service did not answer. Try again.');return d;
}
async function activateLicense(key){
  key=String(key||'').trim();if(!/^[A-Za-z0-9-]{8,80}$/.test(key))throw new Error('That does not look like a licence key. Copy it from your receipt email.');
  const d=await licCall('activate',{key,instance:'CalcHub Pro · '+(navigator.platform||'device')});
  if(!d.valid)throw new Error(d.error||'This key is not valid or has reached its device limit.');
  S.license={key,plan:d.plan==='business'?'business':'pro',expires:d.expires||null,instanceId:d.instanceId||null,checkedAt:Date.now(),label:d.label||''};save();
}
async function revalidateLicense(){
  const L=S.license;if(!L||!CFG.license.endpoint||!navigator.onLine)return;if(Date.now()-(L.checkedAt||0)<7*864e5)return;
  try{const d=await licCall('validate',{key:L.key,instanceId:L.instanceId});if(d.valid){S.license={...L,plan:d.plan==='business'?'business':'pro',expires:d.expires||null,checkedAt:Date.now()}}else if(d.valid===false){S.license=null;toast('Your Pro licence is no longer active.')}save();renderSide()}catch(e){/* offline grace */}
}
async function removeLicense(){const L=S.license;try{if(L&&CFG.license.endpoint)await licCall('deactivate',{key:L.key,instanceId:L.instanceId})}catch(e){}S.license=null;save();closeModal();renderSide();rerender();toast('Licence removed from this device')}
const maskKey=k=>k?'••••-'+String(k).slice(-4):'';
const licForm=()=>`<div class="fld"><label for="lic_key">Licence key</label><input type="text" id="lic_key" autocomplete="off" spellcheck="false" placeholder="Paste the key from your receipt email" class="mono"><div class="err" id="lic_err"></div></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri" data-act="licactivate">Activate</button>${CFG.license.endpoint?'':'<span class="muted" style="font-size:13px;align-self:center">Licence checking is not set up in this copy yet.</span>'}</div>`;
async function doActivate(){const b=document.querySelector('[data-act="licactivate"]');if(b)b.disabled=true;
  try{await activateLicense($('#lic_key').value);closeModal();renderSide();rerender();toast(`${PLAN_NAME[plan()]} is active on this device`)}
  catch(e){$('#lic_err').textContent=e.message}finally{if(b)b.disabled=false}}

function initForm(c,preset){
  const f={id:c.id,vals:{},units:{}};
  for(const i of c.inputs){
    if(i.dim){const u=unitFor(i);f.units[i.key]=u;
      if(i.def!==undefined){let d=i.def;if(u!==i.unit)d=+fmtSig(fromSI(toSI(i.def,i.dim,i.unit),i.dim,u),5).replace(/,/g,'');f.vals[i.key]=String(d)}else f.vals[i.key]='';}
    else f.vals[i.key]=i.def===undefined?'':String(i.def);
  }
  if(preset){Object.assign(f.vals,preset.vals||{});Object.assign(f.units,preset.units||{})}
  return f;
}
function numHint(i,v){const t=String(v??'').trim();if(!t||isPlainNum(t))return '';try{const x=numFrom(t,i.key,i.label);return Number.isFinite(x)?'= '+esc(fmtSig(x,8))+(form&&form.units[i.key]?' '+esc(ulabel(form.units[i.key])):''):''}catch(e){return ''}}

  const v=form.vals[i.key]??'',id='in_'+i.key;
  let ctl;
  if(i.type==='select') ctl=`<select id="${id}" data-k="${i.key}">${i.options.map(([val,l])=>`<option value="${esc(val)}" ${String(v)===String(val)?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
  else if(i.type==='textarea') ctl=`<textarea id="${id}" data-k="${i.key}" spellcheck="false">${esc(v)}</textarea>`;
  else if(i.type==='date') ctl=`<input type="date" id="${id}" data-k="${i.key}" value="${esc(v)}">`;
  else if(i.type==='text') ctl=`<input type="text" id="${id}" data-k="${i.key}" value="${esc(v)}" spellcheck="false" style="font-family:var(--f-num)">`;
  else { const pre=i.money?`<span class="pre">${esc((new Intl.NumberFormat('en-US',{style:'currency',currency:S.settings.currency}).formatToParts(0).find(p=>p.type==='currency')||{}).value||'$')}</span>`:'';
    const us=i.dim?`<select data-u="${i.key}" id="u_${i.key}" aria-label="${esc(i.label)} unit">${Object.keys(UNITS[i.dim]).map(u=>`<option value="${esc(u)}" ${form.units[i.key]===u?'selected':''}>${esc(ulabel(u))}</option>`).join('')}</select>`:'';
    ctl=`<div class="ig">${pre}<input type="text" inputmode="decimal" id="${id}" data-k="${i.key}" value="${esc(v)}" ${i.opt?'placeholder="optional"':''} autocomplete="off">${us}</div><div class="xval" id="x_${i.key}" aria-live="polite">${numHint(i,v)}</div>`; }
  return `<div class="fld" id="f_${i.key}"><label for="${id}">${esc(i.label)}</label>${ctl}${i.help?`<div class="help">${esc(i.help)}</div>`:''}<div class="err" id="e_${i.key}" aria-live="polite"></div></div>`;
}

function renderResult(){

  document.querySelectorAll('.fld').forEach(f=>f.classList.remove('bad'));document.querySelectorAll('.fld .err').forEach(e=>e.textContent='');
  const raw={};for(const i of c.inputs){raw[i.key]=i.type==='num'?(form.vals[i.key]===''?'':[form.vals[i.key],form.units[i.key]||i.unit]):form.vals[i.key]}
  try{ last={...runCalc(c.id,raw),raw:{vals:{...form.vals},units:{...form.units}}}; }
  catch(e){ last=null;
    if(c.id==='scientific'){const empty=!String(form.vals.expr||'').trim();const o=$('#sciOut');if(o){o.textContent=empty?'= 0':'= …';o.classList.add('wait')}el.innerHTML=`<h2><span>Result</span><span>${esc(catOf(c.cat).name)}</span></h2><div class="prim pending"><div class="lab">${empty?'Ready':'Keep going…'}</div><div class="val">${empty?'0':sciGood!=null?esc(sciGood):'…'}</div></div><p class="muted" style="margin:8px 0 0;font-size:13.5px">${empty?'Tap the keys or type an expression.':esc(e.message)}</p>`;$('#mbar').hidden=true;return}
    if(e.key){const f=$('#f_'+e.key);if(f){f.classList.add('bad');$('#e_'+e.key).textContent=e.message}}
    el.innerHTML=`<h2>Result</h2><div class="prim err"><div class="lab">Check your inputs</div><div class="val">${esc(e.message)}</div></div>`; $('#mbar').hidden=true; return; }
  const prim=last.results.filter(r=>r.primary), rest=last.results.filter(r=>!r.primary);
  if(c.id==='scientific'){sciGood=plain(fmtVal(prim[0]).main);const o=$('#sciOut');if(o){o.textContent='= '+sciGood;o.classList.remove('wait')}}
  const P=prim.map(r=>{const f=fmtVal(r);return `<div class="prim"><div class="lab">${esc(r.label)}</div><div class="val">${f.main}</div>${f.alt?`<div class="alt">= ${f.alt}</div>`:''}</div>`}).join('');
  const rows=c.conv?`<div class="convgrid">${rest.map(r=>`<div><small>${esc(r.label)}</small><b>${fmtVal(r).main}</b></div>`).join('')}</div>`

  const refs=last.refs||refsOf(c);
  el.innerHTML=`<h2><span>Result</span><span>${esc(catOf(c.cat).name)}</span></h2>${P}${rows}
   <div class="blk"><h3>Formula</h3><div class="formula">${esc(last.formula)}</div></div>
   ${last.steps?.length?`<div class="blk"><h3>Working</h3><ol class="steps">${last.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol></div>`:''}
   ${last.assumptions?.length?`<div class="blk"><h3>Assumptions</h3><ul class="notes">${last.assumptions.map(a=>`<li>${esc(a)}</li>`).join('')}</ul></div>`:''}
   ${refs.length?`<div class="blk"><h3>Standards & sources</h3><ul class="notes">${refs.map(a=>`<li>${esc(edRef(a))}</li>`).join('')}</ul>${refs.some(r=>editionsOf(r).length)?`<p class="ednote">${esc(EDITION_NOTE)}</p>`:''}</div>`:''}
   ${c.disclaimer?`<div class="disc">Informational only. Verify with a licensed professional, the governing code edition and local rules before use in design or construction.</div>`:''}
   <div class="acts"><button class="btn pri sm" data-act="pdf">${ico('pdf')}PDF report</button><button class="btn sm" data-act="addsheet">${ico('plus')}Add to sheet</button><button class="btn sm" data-act="save">Save</button><button class="btn sm" data-act="share">Share link</button><button class="btn sm" data-act="csv">CSV</button><button class="btn sm" data-act="copy">Copy</button><span class="sp"></span><button class="link" data-act="report" style="font-size:13px;font-weight:500;color:var(--muted)">Report a wrong result</button></div>`;
  const r={id:c.id,vals:{...form.vals},units:{...form.units},at:Date.now()};S.recent=[r,...S.recent.filter(x=>x.id!==c.id)].slice(0,12);save();updateBar();

/* ---------- report model (shared by preview + PDF) ---------- */
function snapshot(){ // freeze the current result as plain text for the sheet / report
  const c=calc(last.calc);
  const inputs=c.inputs.map(i=>{let v=last.raw.vals[i.key];if(v===''||v===undefined)return null;if(i.type==='select')v=(i.options.find(o=>String(o[0])===String(v))||[,v])[1];
    if(i.type==='num'&&!isPlainNum(String(v).trim())){try{v=`${String(v).trim()} = ${fmtSig(numFrom(v,i.key,i.label),8)}`}catch(e){}}return [i.label,`${v}${last.raw.units[i.key]?' '+ulabel(last.raw.units[i.key]):''}`]}).filter(Boolean);
  const results=last.results.map(r=>{const f=fmtVal(r);return [r.label,plain(f.main)+(f.alt?'  (= '+plain(f.alt)+')':''),!!r.primary]});
  return {id:uid(),calc:c.id,title:c.title,cat:catOf(c.cat).name,version:c.version,at:Date.now(),inputs,results,formula:last.formula,steps:last.steps||[],assumptions:last.assumptions||[],refs:(last.refs||refsOf(c)).map(edRef),edNote:(last.refs||refsOf(c)).some(r=>editionsOf(r).length),disclaimer:!!c.disclaimer,summary:summary()};
}
function summary(){const p=last.results.find(r=>r.primary)||last.results[0];return plain(p.label+': '+fmtVal(p).main)}

/* ---------- PDF writer: Helvetica + Courier (WinAnsi), no library, works offline ---------- */
const WIN={'€':128,'‚':130,'„':132,'…':133,'†':134,'‡':135,'‰':137,'‹':139,'‘':145,'’':146,'“':147,'”':148,'•':149,'–':150,'—':151,'™':153,'›':155};
const SUBS={'−':'-','√':'sqrt','∛':'cbrt','Σ':'sum ','π':'pi','θ':'theta','≥':'>=','≤':'<=','⌈':'ceil(','⌉':')','₀':'0','₁':'1','₂':'2','₃':'3','₄':'4','ᵢ':'i','₊':'+','ⁿ':'^n','⁴':'^4','⁻':'-','⁺':'+','′':"'",'″':'"','Ω':'ohm','→':'->','⇄':'<->','δ':'delta','ρ':'rho','Δ':'delta ','≈':'~','µ':'u','μ':'mu','ω':'omega','α':'alpha','σ':'sigma','τ':'tau','η':'eta','ν':'nu','ε':'eps','⅔':'2/3','∞':'inf','×':'x','·':'·','≠':'!=','⁄':'/','◆':'*','◇':'*','★':'*','☆':'*','✓':'ok','✕':'x','⌖':'+','≥':'>=','ε':'eps'};
function pdfStr(s){let o='';for(const ch of String(s)){if(WIN[ch]!==undefined){o+=String.fromCharCode(WIN[ch]);continue}const m=SUBS[ch];if(m!==undefined){o+=m;continue}const c=ch.charCodeAt(0);o+=c<256?ch:'?'}return o}
const pdfEsc=s=>pdfStr(s).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');
function makePDF(doc){ // doc: {title, meta:[[k,v]], sections:[snapshot]}
  const W=612,H=792,M=54,BOT=60,pages=[];let ops=[],y=0;
  const C={ink:'0.08 0.09 0.11',muted:'0.36 0.39 0.42',accent:'0.05 0.36 0.55',line:'0.82 0.84 0.81',band:'0.93 0.94 0.92',warn:'0.48 0.32 0.0',warnbg:'1 0.95 0.84'};
  const cw=(f,size)=>size*(f==='F3'?0.6:f==='F2'?0.56:0.52);
  const wrap=(t,f,size,width)=>{const max=Math.max(8,Math.floor(width/cw(f,size)));const out=[];for(const para of String(t).split('\n')){let line='';for(const w of para.split(' ')){if((line+' '+w).trim().length>max){if(line)out.push(line);let ww=w;while(ww.length>max){out.push(ww.slice(0,max));ww=ww.slice(max)}line=ww}else line=(line?line+' ':'')+w}out.push(line)}return out};
  const newPage=()=>{if(ops.length)pages.push(ops);ops=[];y=H-M};
  const need=h=>{if(y-h<BOT)newPage()};

const TOP_LEVEL=(()=>{try{return window.self===window.top}catch(e){return false}})();
async function offer(filename,data,fallbackText,reportDoc,reportRoute='report'){
  if(dlApi===undefined){try{dlApi=window.claude&&claude.use?await claude.use('downloads'):null}catch(e){dlApi=null}}
  let reason=dlApi?'':'no-download-permission';
  if(dlApi){try{await dlApi.save({filename,data});toast('Saved '+filename);return}
    catch(e){const c=e&&e.code;if(c==='declined'){toast('Download cancelled');return}if(c==='rate_limited'){toast('A download prompt is already open');return}reason=c||'unavailable'}}
  // Outside Claude's viewer (opened as its own page or self-hosted) a normal browser download may work.
  let tried=false;
  if(TOP_LEVEL){try{const type=/\.pdf$/i.test(filename)?'application/pdf':/\.csv$/i.test(filename)?'text/csv':'text/plain';const u=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);tried=true}catch(e){}}
  if(tried&&!window.claude){toast('Downloading '+filename);return} // standalone website / installed app: plain browser download
  if(reportDoc){window._reportRoute=reportRoute;if(reportRoute==='report')window._reportDoc=reportDoc}
  modal(`<h2 style="font-size:18px">${tried?'Saving '+esc(filename):'PDF download is blocked in this window'}</h2>
   <p style="margin:0">${tried?'Your browser should be saving the file now. If nothing appears in your downloads, use one of the options below.':'This window does not allow file downloads. Downloads work when CalcHub Pro is open inside Claude: open claude.ai (or the Claude app), go to <b>Artifacts</b>, open <b>CalcHub Pro</b>, and press <b>PDF report</b> again. You will be asked to confirm the download.'}</p>
   ${reportDoc?`<p class="muted" style="margin:0;font-size:13.5px">Or open the printable report: it shows the same inputs, results, formulas, working and sources${TOP_LEVEL?', and you can print it or save it as PDF from there':''}.</p>`:''}
   ${fallbackText?`<textarea readonly style="min-height:150px">${esc(fallbackText)}</textarea>`:''}
   <div style="display:flex;gap:8px;flex-wrap:wrap">${reportDoc?'<button class="btn pri" data-act="openreport">Open printable report</button>':''}<button class="btn" data-act="close">Close</button></div>
   <p class="muted" style="margin:0;font-size:12px">Reason: ${esc(reason)}${TOP_LEVEL?' · page opened on its own':' · page shown inside a viewer'}</p>`);
}

function vHistory(){
  const recent=S.recent.length?`<section class="sec"><h2>Recent on this device</h2><div class="strip">${S.recent.map(r=>calc(r.id)).filter(Boolean).map(c=>`<button class="pill" data-calc="${c.id}">${esc(c.title)}</button>`).join('')}</div></section>`:'';
  if(plan()==='guest') return `<p class="eyebrow">Your work</p><h1 class="ptitle">History & saved</h1><div class="panel" style="margin-top:14px"><p style="margin-top:0">Create a free account to save calculations with a name and keep them on all your devices. Without an account, a recent list is kept on this device.</p><button class="btn pri" data-act="user">Create free account</button></div>${recent}`;
  const where=S.user&&S.user.id?`synced to ${esc(S.user.email)}`:'kept in this browser';
  return `<p class="eyebrow">Your work</p><div class="chead"><h1 class="ptitle" style="margin:0">History & saved</h1>${S.saves.length?'<button class="btn sm" data-act="csvall" style="margin-left:auto">Export all as CSV</button>':''}</div><p class="muted" style="margin:0 0 14px">${S.saves.length} saved calculation${S.saves.length===1?'':'s'} · ${where}</p>
   ${S.saves.length?`<div class="panel tbl" style="padding:6px 12px"><table class="t"><thead><tr><th>Name</th><th>Calculator</th><th>Result</th><th>Saved</th><th></th></tr></thead><tbody>
   ${[...S.saves].reverse().map(s=>`<tr><td><input type="text" value="${esc(s.name)}" data-rename="${s.id}" id="rn_${s.id}" aria-label="Name" style="min-width:160px"></td><td>${esc(calc(s.calc)?.title||s.calc)} <span class="chip">v${esc(s.version)}</span></td><td class="n">${esc(s.summary)}</td><td class="n">${new Date(s.at).toLocaleDateString()}</td>
   <td style="white-space:nowrap"><button class="btn sm" data-open="${s.id}">Open</button> <button class="btn sm ghost" data-del="${s.id}" aria-label="Delete">✕</button></td></tr>`).join('')}</tbody></table></div>`
   :`<div class="empty">Nothing saved yet. Open any calculator and press Save.</div>`}${recent}`;
}

function vAbout(){
  const allRefs=[...new Set(CALCS.flatMap(refsOf))].sort();
  const edRows=EDITIONS.map(([re,ed])=>[ed,CALCS.filter(c=>refsOf(c).some(r=>re.test(r)))]).filter(x=>x[1].length);
  return `<div class="prose"><p class="eyebrow">About</p><h1 class="ptitle">Formulas and sources</h1>
 <p>Every calculator is a small, pure function with a version number. Inputs are converted to SI units, calculated, and converted back for display. The formulas are checked against ${GOLDEN.length} test cases with independently worked reference values; anyone can run them on the Admin page.</p>
 <h2>Precision</h2><p>Engineering results show ${S.settings.sig} significant figures by default. Money is rounded to the cent. Unit factors are exact values from NIST Special Publication 811.</p>
 <h2>Pipeline calculators</h2><p>Wall thickness follows the ASME B31.8 (gas) and B31.4 (liquids) design formulas with the code's design, joint and temperature factors. Gas flow uses the Weymouth and Panhandle A equations as published by Menon. Liquid pressure drop uses Darcy–Weisbach with the Colebrook–White friction factor. Always check the edition your project is bound to.</p>
 <h2>Jewelry and gemstones</h2><p>Gold values use nominal karat purity (k/24). Carat estimates use the industry's mounted-stone factors and the stone's specific gravity; they are estimates, not weights.</p>
 <h2>Standards and editions</h2><p>${esc(EDITION_NOTE)}</p><div class="tbl"><table class="t"><thead><tr><th>Standard and edition</th><th>Used by</th></tr></thead><tbody>${edRows.map(([ed,cs])=>`<tr><td><b>${esc(ed)}</b></td><td>${cs.map(c=>`<button class="link" data-calc="${c.id}">${esc(c.title)}</button>`).join(' · ')}</td></tr>`).join('')}</tbody></table></div>
 <h2>All sources cited</h2><ul class="notes" style="color:var(--ink)">${allRefs.map(r=>`<li>${esc(edRef(r))}</li>`).join('')}</ul>
 <h2>Disclaimer</h2><p>Engineering, pipeline, building and chemistry results are informational. They are not certified design values and do not replace a licensed professional or the governing code.</p>
 <h2>Privacy</h2><p>No ads and no tracking cookies. Your recent list, saves and calculation sheet stay in this browser unless you sign in. Shared links contain only the calculator, its inputs and the result. See the <button class="link" data-go="privacy">privacy policy</button>.</p></div>`}
function vAdmin(){
  if(!CFG.adminTools)adminTab='tests';
  const tabs=CFG.adminTools?[['tests','Formula tests'],['calcs','Calculators'],['feedback',`Reports (${S.feedback.length})`],['tables','Reference tables']]:[['tests','Formula tests']];
  let body='';
  if(adminTab==='tests'){const rows=runGolden({runCalc,fromSI,CALCS,cents});const pass=rows.filter(r=>r.ok).length;
    body=`<div class="panel" style="margin-bottom:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap"><span class="chip ${pass===rows.length?'ok':'bad'}" style="font-size:14px;padding:4px 12px">${pass} / ${rows.length} passed</span><span class="muted">Covers all ${CALCS.length} calculators. Any failure blocks a release.</span><button class="btn sm" data-act="rerun">Run again</button></div>
    <div class="panel tbl" style="padding:6px 12px"><table class="t"><thead><tr><th></th><th>Calculator</th><th>Checked values</th><th>Reference</th></tr></thead><tbody>${rows.map(r=>`<tr><td><span class="chip ${r.ok?'ok':'bad'}">${r.ok?'Pass':'Fail'}</span></td><td>${esc(r.title)} <span class="chip">v${esc(r.version)}</span></td><td class="n" style="font-size:12.5px">${esc(r.detail)}</td><td style="font-size:13px">${esc(r.ref)}</td></tr>`).join('')}</tbody></table></div>`}
  else if(adminTab==='calcs'){body=`<div class="panel tbl" style="padding:6px 12px"><table class="t"><thead><tr><th>Calculator</th><th>Category</th><th>Version</th><th>Enabled</th></tr></thead><tbody>${CALCS.map(c=>`<tr><td>${esc(c.title)}</td><td>${esc(catOf(c.cat).name)}</td><td class="n">${esc(c.version)}</td><td><input type="checkbox" data-en="${c.id}" id="en_${c.id}" ${enabled(c)?'checked':''} aria-label="Enable ${esc(c.title)}" style="width:18px;height:18px;accent-color:var(--accent)"></td></tr>`).join('')}</tbody></table></div>
    ${S.audit.length?`<div class="panel" style="margin-top:12px"><h2 style="font-size:15px;margin-bottom:6px">Audit log</h2>${S.audit.slice(-8).reverse().map(a=>`<div class="mono" style="font-size:12.5px">${new Date(a.at).toLocaleString()} · ${esc(a.what)}</div>`).join('')}</div>`:''}`}
