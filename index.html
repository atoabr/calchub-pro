  <div class="skp" role="group" aria-label="Calculator keys">${SCI_KEYS.map(([l,t,cls,tt])=>`<button type="button" class="${cls||''}" data-sk="${esc(t)}" ${tt?`title="${esc(tt)}" aria-label="${esc(tt)}"`:''}>${l}</button>`).join('')}</div>
  <select id="sciMore" aria-label="More functions" style="margin-top:8px"><option value="">More functions…</option>${SCI_MORE.map(([v,l])=>`<option value="${esc(v)}">${esc(l)}</option>`).join('')}</select>
  <p class="help" id="sci_help" style="margin:8px 0 0;font-size:12.5px;line-height:1.5">Type or tap. Functions add their brackets for you; 2π means 2 × π; missing closing brackets are added at the end. Press Enter or = to keep a result in the history.</p>
  <div id="sciHist">${sciHistHTML()}</div>`;
}
function sciHistHTML(){const h=S.sciHist||[];if(!h.length)return '';
  return `<div class="shist"><div class="shh"><b>History</b><button type="button" class="link" data-act="scihclear" style="font-size:12.5px">Clear</button></div>${h.map((x,k)=>`<button type="button" data-sh="${k}" title="Use this calculation again"><span>${esc(x.e)}</span><b>= ${esc(x.r)}</b></button>`).join('')}</div>`}
const sciAnsStr=()=>S.sciAns==null?'':String(+(+S.sciAns).toPrecision(12));
function sciCaret(inp){if(document.activeElement===inp)return [inp.selectionStart,inp.selectionEnd];return sciSel||[inp.value.length,inp.value.length]}
function sciShowCaret(){const inp=$('#in_expr'),k=$('#sciCaret');if(!inp||!k)return;
  if(document.activeElement===inp||!sciSel||sciFresh){k.hidden=true;return}
  const cs=getComputedStyle(inp),c=sciShowCaret.c||(sciShowCaret.c=document.createElement('canvas').getContext('2d'));c.font=`${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
  const pos=Math.min(sciSel[0],inp.value.length),x=parseFloat(cs.paddingLeft)+parseFloat(cs.borderLeftWidth)+c.measureText(inp.value.slice(0,pos)).width-inp.scrollLeft;
  k.style.left=Math.max(parseFloat(cs.paddingLeft),Math.min(x,inp.clientWidth))+'px';k.hidden=false;k.style.animation='none';void k.offsetWidth;k.style.animation=''}
function sciMove(inp,c){sciSel=[c,c];try{if(!COARSE||inp.getAttribute('inputmode')==='none')inp.focus({preventScroll:true});inp.setSelectionRange(c,c)}catch(e){}
  // keep the caret in view for long expressions
  if(document.activeElement!==inp){const cs=getComputedStyle(inp),ctx=sciShowCaret.c||(sciShowCaret.c=document.createElement('canvas').getContext('2d'));ctx.font=`${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;const w=ctx.measureText(inp.value.slice(0,c)).width,room=inp.clientWidth-2*parseFloat(cs.paddingLeft);if(w-inp.scrollLeft>room)inp.scrollLeft=w-room+4;else if(w<inp.scrollLeft)inp.scrollLeft=Math.max(0,w-4)}
  sciShowCaret()}
function sciSet(inp,v,caret){inp.value=v;form.vals.expr=v;renderResult();sciMove(inp,caret)}
function sciInsert(t){
  const inp=$('#in_expr');if(!inp)return;
  if(t===':eq')return sciEquals();
  if(t===':clr'){sciFresh=false;return sciSet(inp,'',0)}
  let v=inp.value,[a,b]=sciCaret(inp);if(a==null||a>v.length)a=b=v.length;
  if(t===':left'||t===':right'){sciFresh=false;const c=t===':left'?(a!==b?a:Math.max(0,a-1)):(a!==b?b:Math.min(v.length,b+1));sciMove(inp,c);return}
  if(t===':del'){sciFresh=false;if(a!==b){return sciSet(inp,v.slice(0,a)+v.slice(b),a)}if(a===0)return;
    let k=1;const m=/(asin|acos|atan|sinh|cosh|tanh|sqrt|cbrt|round|floor|ceil|sin|cos|tan|log|exp|abs|nCr|nPr|ln|√|∛)\($|pi$| [×÷+−] $/.exec(v.slice(0,a));if(m)k=m[0].length;
    const gone=v.slice(a-k,a),tail=gone.endsWith('(')&&v[b]===')'?1:0;return sciSet(inp,v.slice(0,a-k)+v.slice(b+tail),a-k)}   // an emptied function loses its ')' too
  if(t===')'&&a===b&&v[a]===')'&&!sciFresh){sciMove(inp,a+1);return}   // step over an auto-added ')'
  if(t===':ans'){if(S.sciAns==null){toast('Press = first to keep an answer');return}t=sciAnsStr()}
  const isOp=/^( [×÷+−] |\^2?|!|%)$/.test(t);
  if(sciFresh){sciFresh=false;if(isOp&&S.sciAns!=null)v=sciAnsStr();else if(!isOp)v='';a=b=v.length}
  const sel=v.slice(a,b);let ins=t,caret;
  if(t.endsWith('()')){ins=sel?t.slice(0,-1)+sel+')':t;caret=a+ins.length-(sel?0:1)}
  else if(t.includes('(,)')){ins=t.replace('(,)','('+sel+',)');caret=a+(sel?ins.indexOf(',')+1:ins.indexOf('(')+1)}
  else caret=a+ins.length;
  sciSet(inp,v.slice(0,a)+ins+v.slice(b),caret);
}
function sciEquals(){
  if(!last||last.calc!=='scientific'){toast('Finish the expression first');return}
  const r=last.results[0],e=($('#in_expr').value||'').trim();if(!e)return;
  S.sciAns=r.value;const rs=plain(fmtVal(r).main);
  S.sciHist=[{e,r:rs},...(S.sciHist||[]).filter(x=>x.e!==e)].slice(0,8);save();
  sciFresh=true;const h=$('#sciHist');if(h)h.innerHTML=sciHistHTML();sciShowCaret();
  const p=$('#result .prim');if(p){p.classList.remove('flash');void p.offsetWidth;p.classList.add('flash')}
}
document.addEventListener('mousedown',e=>{if(e.target.closest('.skp button,[data-smode]'))e.preventDefault()});
let sciRep=null,sciRepeated=false;const sciStop=()=>{clearTimeout(sciRep);clearInterval(sciRep);sciRep=null};
document.addEventListener('pointerdown',e=>{const k=e.target.closest('[data-sk=":left"],[data-sk=":right"],[data-sk=":del"]');if(!k)return;sciRepeated=false;sciStop();
  sciRep=setTimeout(()=>{sciRep=setInterval(()=>{sciRepeated=true;sciInsert(k.dataset.sk)},90)},450)});
['pointerup','pointercancel','pointerleave'].forEach(ev=>document.addEventListener(ev,sciStop,true));
document.addEventListener('focusin',e=>{if(e.target.id==='in_expr')sciShowCaret()});document.addEventListener('focusout',e=>{if(e.target.id==='in_expr')setTimeout(sciShowCaret,0)});
document.addEventListener('click',e=>{
  const k=e.target.closest('[data-sk]');if(k){if(sciRepeated){sciRepeated=false;return}sciInsert(k.dataset.sk);return}
  const m=e.target.closest('[data-smode]');if(m&&form&&form.id==='scientific'){form.vals.mode=m.dataset.smode;document.querySelectorAll('[data-smode]').forEach(b=>b.classList.toggle('on',b===m));const lab=m.parentElement.nextElementSibling;if(lab)lab.textContent=m.dataset.smode==='deg'?'Angles in degrees':'Angles in radians';renderResult();return}
  const h=e.target.closest('[data-sh]');if(h){const x=(S.sciHist||[])[+h.dataset.sh];const inp=$('#in_expr');if(x&&inp){sciFresh=false;sciSet(inp,x.e,x.e.length)}return}
});
document.addEventListener('change',e=>{if(e.target.id==='sciMore'&&e.target.value){const v=e.target.value;e.target.value='';sciInsert(v)}});
document.addEventListener('keydown',e=>{if(e.target.id==='in_expr'&&e.key==='Enter'){e.preventDefault();sciEquals()}});
['keyup','click','select','input'].forEach(ev=>document.addEventListener(ev,e=>{if(e.target.id==='in_expr'){sciSel=[e.target.selectionStart,e.target.selectionEnd];if(ev==='input')sciFresh=false}}));
addEventListener('resize',()=>sciShowCaret());
function doSave(){modal(`<h2 style="font-size:18px">Save calculation</h2><div class="fld"><label for="sv_name">Name</label><input type="text" id="sv_name" maxlength="80" value="${esc(calc(last.calc).title+' — '+new Date().toLocaleDateString())}"></div><p class="muted" style="margin:0;font-size:13px">${esc(summary())}</p><div style="display:flex;gap:8px"><button class="btn pri" data-act="dosave">Save</button><button class="btn" data-act="close">Cancel</button></div>`)}

applyTheme();setPh();productInit();
function routeHash(){const h=(location.hash||'').slice(1);
if(['pricing','privacy','terms','refunds','help','about'].includes(h))go(h);else if(/^s\./.test(h))go('shared',h);else if(/^c\.[a-z0-9-]+$/.test(h)&&calc(h.slice(2)))go('calc',h.slice(2));else if(CATEGORIES.some(c=>c.id===h))go('cat',h);else if(h==='sheet')go('sheet');else go('home');}
routeHash();window.addEventListener('hashchange',routeHash);
</script>
